# Custom JS (ADR Overview: sortable/filterable index table)
extra_javascript = ["javascripts/adr-index.js"]

# =============================================================================
# Theme Configuration
# =============================================================================
[project.theme]

variant = "modern"
language = "en"
custom_dir = "overrides"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    # navigation.indexes intentionally OFF: it turns a section's index.md into a
    # clickable section *title* (poor affordance — users don't expect headers to
    # be links). Instead each section lists an explicit "Overview" item on top.
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Color schemes
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# Fonts
[project.theme.font]
text = "Roboto"
code = "Roboto Mono"

# Icons
[project.theme.icon]
logo = "lucide/cloud"
# Lucide dropped brand icons, so "lucide/github" doesn't exist in the bundled
# icon set and the repo-link include (partials/source.html) fails the build.
# Use the FontAwesome GitHub mark (also used for the social link below).
repo = "fontawesome/brands/github"

# =============================================================================
# Social links
# =============================================================================
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/abilian/hop3"

# Mastodon account to be created
# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@hop3"

# =============================================================================
# Plugins
# =============================================================================
[project.plugins]
search = { enabled = true }
