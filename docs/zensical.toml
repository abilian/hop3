# Hop3 Documentation - Zensical Configuration
# ============================================================================

[project]

site_name = "Hop3 Documentation"
site_description = "The official documentation for the Hop3 self-sovereign cloud platform"
site_author = "Abilian SAS"
site_url = "https://hop3.cloud/"

# Source and output directories
# Note: src/blog/posts/ is generated by preprocess_markdown.py from blog/posts/
docs_dir = "src"
site_dir = "site"

# Repository information
repo_url = "https://github.com/abilian/hop3"
edit_uri = "edit/main/docs/src"

copyright = """
Copyright &copy; 2021-2026 Abilian SAS
"""

