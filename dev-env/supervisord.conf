[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd_err.log

[program:postgresql]
command=/usr/lib/postgresql/14/bin/postgres -D /var/lib/postgresql/14/main -c config_file=/etc/postgresql/14/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql_err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

[program:uwsgi-emperor]
command=/home/hop3/venv/bin/uwsgi --ini /home/hop3/.hop3/uwsgi/uwsgi.ini
directory=/home/hop3
user=hop3
autostart=true
autorestart=true
environment=HOME="/home/hop3"
stdout_logfile=/var/log/supervisor/uwsgi-emperor.log
stderr_logfile=/var/log/supervisor/uwsgi-emperor_err.log

[program:hop3-server]
command=/home/hop3/venv/bin/hop3-server serve
directory=/home/hop3
user=hop3
autostart=true
autorestart=true
environment=HOME="/home/hop3",PATH="/home/hop3/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",HOP3_ROOT="/home/hop3/.hop3",HOP3_SECRET_KEY="dev-secret-key-change-in-production",HOP3_ENABLE_AUTH="false",HOP3_DB_URL="sqlite:////home/hop3/.hop3/hop3.db",ACME_ENGINE="self-signed"
stdout_logfile=/var/log/supervisor/hop3-server.log
stderr_logfile=/var/log/supervisor/hop3-server_err.log
