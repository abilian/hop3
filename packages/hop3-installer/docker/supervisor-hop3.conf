# Supervisor configuration for Hop3 services in Docker
# This file is placed at /etc/supervisor/conf.d/hop3.conf
#
# Services managed:
# - sshd: SSH server for git push and remote access
# - nginx: Reverse proxy for applications
# - uwsgi: Emperor mode for application processes
# - hop3-server: Hop3 API server

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd_err.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log

[program:uwsgi]
command=/home/hop3/venv/bin/uwsgi --emperor /home/hop3/uwsgi-enabled --uid hop3 --gid hop3
directory=/home/hop3
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/uwsgi.log
stderr_logfile=/var/log/supervisor/uwsgi_err.log

[program:hop3-server]
command=/home/hop3/venv/bin/hop3-server serve
directory=/home/hop3
user=hop3
autostart=true
autorestart=true
environment=HOME="/home/hop3"
stdout_logfile=/var/log/supervisor/hop3-server.log
stderr_logfile=/var/log/supervisor/hop3-server_err.log
