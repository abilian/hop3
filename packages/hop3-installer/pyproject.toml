[project]
name = "hop3-installer"
version = "0.6.2"
description = "Installer scripts for Hop3 CLI and Server"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Abilian SAS", email = "contact@abilian.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
# No runtime dependencies - installers must use only stdlib
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "ty",
]

[project.scripts]
# Unified installer command with subcommands (cli, server, bundle)
hop3-install = "hop3_installer.main:main"
# Deployment tool for developers
hop3-deploy = "hop3_installer.deployer:main"

#
# build
#
[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# [tool.uv.build-backend]
# module-name = "hop3_installer"
# module-root = "src"

#
# Tools
#

# Keep!
[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]
skip_covered = true
skip_empty = true
