[project]
name = "hop3-tooling"
version = "0.7.1"
description = "Maintainer and operator tooling for Hop3 (ADR 057)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.10, <4"
dependencies = [
    "click>=8.0.0",
    "httpx>=0.27.2",
    # bench matrix reads the corpus from the committed protocol.yaml
    "pyyaml>=6.0",
    # nix-gen lives in hop3-server; `nix vendor-hash` generates an expression
    # with a placeholder hash to learn the real one.
    "hop3-server",
]

[project.scripts]
hop3-tools = "hop3_tooling.cli:main"
hop3-bench = "hop3_tooling.bench.cli:main"

[tool.uv.sources]
hop3-server = { workspace = true }

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = ["**/*.py*"]
