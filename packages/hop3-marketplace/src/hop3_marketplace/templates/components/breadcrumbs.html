<nav class="py-4 border-b border-slate-100" aria-label="Breadcrumb">
    <ol class="flex items-center gap-2 text-sm">
        <li class="flex items-center gap-2">
            <a href="{{ base_url }}/" class="text-slate-500 hover:text-blue-500">Home</a>
        </li>
        {% for crumb in breadcrumbs %}
        <li class="flex items-center gap-2">
            <span class="text-slate-300">/</span>
            {% if crumb.url %}
            <a href="{{ crumb.url }}" class="text-slate-500 hover:text-blue-500">{{ crumb.label }}</a>
            {% else %}
            <span class="text-slate-800 font-medium">{{ crumb.label }}</span>
            {% endif %}
        </li>
        {% endfor %}
    </ol>
</nav>
