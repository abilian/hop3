[project]
name = "hop3-testlab"
version = "0.7.2"
description = "Hop3 Test Lab — web dashboard + scheduler for the nightly test suite (ADR 044)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" },
]
requires-python = ">=3.11,<4"
dependencies = [
    # The shared engine + result store (ADR 044 §B: one engine, one store).
    "hop3-testing",
    # Web stack — pinned to match hop3-server (the app this one mirrors).
    "litestar[standard]>=2.22.0",
    "dishka>=1.3.0",
    "advanced-alchemy>=0.21",
    "sqlalchemy~=2.0",
    "jinja2",
    "granian[reload]>=2.2.0",
    # In-process nightly scheduler (ADR 044 §10).
    "apscheduler>=3.10,<4",
    # Renders the narrative run report (markdown -> HTML).
    "markdown>=3.5",
    # Postgres driver for the server-resident store (sync SQLAlchemy -> psycopg 3).
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2.13.4",
    "uvicorn>=0.49.0",
]

[project.scripts]
hop3-testlab = "hop3_testlab.cli:main"

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# Keep!
[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "nox>=2026.4.10",
    "pre-commit>=4.6.0",
    "pyrefly>=1.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "ty>=0.0.50",
]

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]
skip_covered = true
skip_empty = true
