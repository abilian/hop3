{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-semibold mb-4">Trends</h1>

<h2 class="text-sm font-semibold text-gray-700 mb-2">Flakiness (last 20 runs)</h2>
{% if flaky %}
<table class="w-full max-w-lg text-sm border-collapse">
  <thead class="text-left text-gray-500 border-b">
    <tr><th class="py-2 pr-4">Test</th><th class="py-2 text-right">Flips</th></tr>
  </thead>
  <tbody>
    {% for name, flips in flaky %}
    <tr class="border-b">
      <td class="py-2 pr-4 font-mono text-xs">{{ name }}</td>
      <td class="py-2 text-right">{{ flips }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% else %}
<p class="text-gray-600">No flaky tests in the recent window.</p>
{% endif %}
{% endblock %}
