[project]
name = "hop3-rootd"
version = "0.7.0"
description = "Privileged operations agent for Hop3 (kernel-boundary executor)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Abilian SAS", email = "contact@abilian.com" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]
# No runtime dependencies. The daemon is the kernel-privilege boundary;
# every transitive dep is part of the trust budget. Stdlib only.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
hop3-rootd = "hop3_rootd.__main__:main"

#
# build
#
[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hop3_rootd"
module-root = "src"

# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel]
# packages = ["src/hop3_rootd"]

#
# Tools
#
[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]
skip_covered = true
skip_empty = true

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/hop3_rootd"
src_package = "hop3_rootd"
units = ["*"]
# counter = "internal"   # or "cloc"

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"
