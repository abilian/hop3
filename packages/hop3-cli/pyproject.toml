[project]
name = "hop3-cli"
version = "0.7.0"
authors = [
    {name = "Stefane Fermigier", email = "sf@abilian.com"},
]
license = "Apache-2.0"
requires-python = "<4.0,>=3.10"
dependencies = [
    # Configuration
    "toml<1.0.0,>=0.10.2",
    "tomlkit>=0.13.0",  # comment-preserving TOML round-trip for hop3.toml edits
    # Communication
    "jsonrpcclient<5.0.0,>=4.0.3",
    "requests<3.0.0,>=2.32.3",
    # Presentation
    "tabulate<1.0.0,>=0.9.0",
    "rich>=13.0.0",  # Rich formatting, tables, progress bars, colors
    # SSH tunneling shells out to the system `ssh -L` (hop3_cli.core.ssh_tunnel);
    # no paramiko/sshtunnel dependency.
    "loguru>=0.7.3",
    "pathspec>=0.12.1",
    "platformdirs>=4.3.8",
]
description = ""
readme = "README.md"

[project.scripts]
hop = "hop3_cli.main:main"
hop3 = "hop3_cli.main:main"

# ----------------------------------------

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# ----------------------------------------

# Present (even if empty) so this package stays its own pytest rootdir/config.
[tool.pytest.ini_options]

# Keep!
[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

# Was:
#[build-system]
#requires = ["pdm-backend"]
#build-backend = "pdm.backend"
#
#[tool.pdm.build]
#includes = ["src/hop3_cli"]

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]
skip_covered = true
skip_empty = true

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/hop3_cli"
src_package = "hop3_cli"
units = ["*"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

# Tiers, cheapest first. Add `expects = [...]` to a tier to scope it to
# the source units it should test (glob patterns over unit names); units
# outside the scope are reported n/a, not as gaps. Use it when layers map
# to tiers — e.g. integration `expects = ["repositories/*", "infra/*"]`,
# e2e `expects = ["web/*"]`. Omit it and the tier is checked against all.

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6
