[project]
name = "hop3-testing"
version = "0.4.0.alpha1"
description = "Testing utilities for Hop3"
readme = "README.md"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.10, <4"
dependencies = [
    # Hop3 packages
    "hop3-cli",
    # Testing
    "pytest>=8.0.0",
    "docker>=7.0.0",
    # Dev tools
    "devtools>=0.12.2",
    "python-dotenv>=1.0.1",
    # Communication
    "httpcore>=1.0.6",
    "httpx>=0.27.2",
    # Pin paramiko to 2.x for compatibility with sshtunnel (used in hop3-cli)
    "paramiko>=2.11.0,<3.0.0",
]

[project.scripts]
hop3-test = "hop3_testing.main:main"

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"
