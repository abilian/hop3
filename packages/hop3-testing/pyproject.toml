[project]
name = "hop3-testing"
version = "0.7.1"
description = "Testing utilities for Hop3"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" }
]
requires-python = ">=3.10, <4"
dependencies = [
    # Hop3 packages
    "hop3-cli",
    "hop3-installer",
    # Testing
    "pytest>=8.0.0",
    "docker>=7.0.0",
    # TOML parsing (Python 3.10 compat)
    "tomli>=2.0.0; python_version < '3.11'",
    # Dev tools
    "devtools>=0.12.2",
    "python-dotenv>=1.0.1",
    # Communication
    "httpcore>=1.0.6",
    "httpx>=0.27.2",
    # paramiko >=3.4.0 carries the Terrapin fix (CVE-2023-48795, audit M4).
    # Upper bound <4 kept conservatively: hop3-testing uses paramiko's SSHClient
    # directly and isn't yet validated against paramiko 4.0's API changes (DSA/DSS
    # removal). (hop3-cli no longer depends on paramiko — it shells out to ssh.)
    "paramiko>=3.4.0,<4",
    # CLI
    "click>=8.0.0",
    # Result storage
    "sqlalchemy>=2.0.0",
    # JWT token generation for E2E tests
    "PyJWT>=2.8.0",
    # Hetzner system tests
    "hcloud>=2.0",
    "jinja2>=3.0",
    "rich>=13.0",
    "attrs>=23.0",
    "termcolor>=2.0",
    "tomlkit>=0.12",
]

[project.scripts]
hop3-test = "hop3_testing.cli:main"

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

#
# Tools
#

# Keep!
[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]
skip_covered = true
skip_empty = true
