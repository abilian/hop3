# A copy of the catalog recipe apps/alpha/redmine-nixgen (catalog commit 56a1ed6), frozen
# as example input: the tests that read it must not change with the catalog.
# hop3.toml — Redmine (Ruby on Rails), generated from the ruby-bundler template.
#
# The Rails specifics live here rather than in the template: a Rails app writes
# inside its own tree, so it takes writable-home-at-runtime, and its runtime
# config / migration / boot command are expressed with the shared config-files,
# pre-exec and exec-args fields. The gem set is pinned by a bundix-generated
# gemset.nix resolved with force_ruby_platform, so every gem — including the
# native nokogiri and pg, and commonmarker's Rust extension — is compiled from
# source rather than fetched as a precompiled binary.
#
# Gemfile is upstream's, less its development and test groups, with `pg`
# declared unconditionally and `puma` added as the application server. Regenerate
# the lock and the gemset from it with the nixpkgs pin's ruby_3_3 and bundix:
#   BUNDLE_FORCE_RUBY_PLATFORM=true bundle lock --add-platform ruby && bundix

[metadata]
id = "redmine-nixgen"
version = "6.1.4"
description = "Flexible project management web application (Ruby on Rails)"

[build]
builder = "nix"

[nix]
template = "ruby-bundler"
url = "https://www.redmine.org/releases/redmine-${version}.tar.gz"
sha256 = "1j9gx39c4hjlcydb171l3a1mhjvll83hkzm0gixdgwvysc3a1lxd"
archive = "tar-gz"
# Redmine 6.1 runs on Ruby 3.2 to 3.4; the template default, ruby_3_3, is in it.
#
# commonmarker 2 compiles a Rust extension, and cargo would fetch its crates
# from the network, which the build sandbox does not have. The hash pins the
# crates vendored ahead of the build; it is nixpkgs' own, for the same gem
# version in its redmine package.
gem-cargo-hashes = { commonmarker = "sha256-rUNsf7DUVueD9revOR6Mab36XnVEmjL4bVv6TIMMqjM=" }
# Rails writes config/database.yml, the secret token, tmp/ and log/ inside its
# install tree; the Nix store is read-only (blocker #12).
writable-home-at-runtime = true
exec-target = "rails"
exec-args = ["server", "-b", "0.0.0.0", "-p", "$PORT"]

# Run once per deploy; both are idempotent. `rake` and `rails` resolve through
# the gem set, which the template puts on PATH. The migration seeds Redmine's
# published admin/admin; the runner resets that account to the generated
# credential, read from the environment rather than argv.
pre-exec = [
  "rake db:migrate",
  """rails runner 'u = User.find_by_login(ENV.fetch("HOP3_ADMIN_USER")) || User.find_by_login("admin"); raise "no admin account to reset" unless u; u.login = ENV.fetch("HOP3_ADMIN_USER"); u.password = u.password_confirmation = ENV.fetch("HOP3_ADMIN_PASSWORD"); u.must_change_passwd = false; u.save!'""",
]

[nix.env-exports]
RAILS_ENV = "production"
RAILS_SERVE_STATIC_FILES = "1"

# The secret that signs every session, from Hop3's generated-once value. It
# used to be `rake generate_secret_token`, guarded by the file it writes; the
# file is in the tree every deploy copies in afresh, so each deploy made a new
# secret and signed everyone out.
[[nix.config-files]]
path = "config/initializers/secret_token.rb"
format = "raw"
raw-content = """
RedmineApp::Application.config.secret_key_base = ENV.fetch("SECRET_KEY_BASE")
"""

# Written on every deploy, from the addon's PG* values.
[[nix.config-files]]
path = "config/database.yml"
format = "raw"
raw-content = """
production:
  adapter: postgresql
  database: ${PGDATABASE:-redmine}
  host: ${PGHOST}
  port: ${PGPORT:-5432}
  username: ${PGUSER}
  password: "${PGPASSWORD}"
  encoding: utf8
"""

[[addons]]
type = "postgres"

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["ruby", "rails", "nix", "postgres"]

[[test.validations]]
path = "/login"
status = 200
contains = "Redmine"

# Generated once, re-injected on every deploy (ADR 046).
[env]
SECRET_KEY_BASE = { generate = "hex", length = 64 }

# Generated admin credentials (ADR 056), applied by the runner in pre-exec.
[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Every deploy replaces src/, so each directory Redmine writes to is a volume.
# files/ holds every attachment and log/ the logs: kept. tmp/ (caches, pids)
# and public/plugin_assets (copied from the plugins at start) are reset.
[[volumes]]
name = "files"
target = "files"

[[volumes]]
name = "log"
target = "log"

[[volumes]]
name = "tmp"
target = "tmp"
type = "scratch"

[[volumes]]
name = "plugin-assets"
target = "public/plugin_assets"
type = "scratch"
