# ------------------------------------------------------------------------
# LeWAF Gate Rules — Forged-Header Detection
# ------------------------------------------------------------------------
#
# This file contains rules that enforce security invariants at the proxy
# boundary.  It is designed for deployments where LeWAF sits behind a
# trusted reverse proxy (nginx) that is configured to OVERWRITE — not
# append — the X-Forwarded-For header:
#
#     proxy_set_header X-Forwarded-For $remote_addr;
#
# When nginx overwrites XFF, any incoming request that already carries an
# X-Forwarded-For header is spoofed: the client is either hitting LeWAF
# directly or an upstream proxy is appending instead of overwriting.
# ------------------------------------------------------------------------


# ============================================================================
# Gate-1: Forged X-Forwarded-For Detection
# ============================================================================
#
# If a request arrives with an X-Forwarded-For header already present, it
# means the trusted proxy did not overwrite it.  This indicates either:
#   (a) a direct connection bypassing nginx, or
#   (b) a misconfigured upstream proxy that appends XFF.
#
# In either case the leftmost XFF entry is attacker-controlled, making
# REMOTE_ADDR-based gates and IP bans unreliable.
#
SecRule REQUEST_HEADERS:X-Forwarded-For "@rx ." \
    "id:95001,\
    phase:1,\
    block,\
    t:none,\
    msg:'Forged X-Forwarded-For — XFF header present at proxy boundary',\
    logdata:'XFF value: %{REQUEST_HEADERS.X-Forwarded-For}',\
    tag:'application-multi',\
    tag:'language-multi',\
    tag:'platform-multi',\
    tag:'attack-protocol',\
    tag:'paranoia-level/1',\
    tag:'OWASP_CRS',\
    tag:'capec/1000/210/272',\
    ver:'LEWAF/0.7.4',\
    severity:'CRITICAL'"
