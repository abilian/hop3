[project]
name = "hop3-server"
version = "0.6.2"
description = "Simple PaaS - Deploy and manage web applications on a single server"
license = "Apache-2.0"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" },
]
readme = "README.md"

dependencies = [
    # Web / app server
    "litestar[standard]>=2.22.0",
    "attrs >= 24.2",
    "jinja2",
    "itsdangerous>=2.0.0",
    # Plugins and DI
    "pluggy ~= 1.4",
    "dishka >= 1.3.0",
    # Database
    "sqlalchemy ~= 2.0",
    "advanced-alchemy >= 0.21",
    "alembic ~= 1.13",
    # Misc
    "termcolor >= 2.5.0",
    "markdown>=3.5",
    "nh3>=0.2",  # HTML sanitizer for untrusted catalog readme (ADR 049 F6)
    # SBOM
    "cyclonedx-bom >= 5.1.1",
    "toml >= 0.10.2",
    # Security
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    # ASGI server
    "granian[reload]>=2.2.0",
    # Database connectors
    "psycopg2-binary>=2.9.10",
    "mysql-connector-python>=9.0.0",
    "redis",
    # Config
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.20",
    # Domain health monitoring (WHOIS registration expiry)
    "python-whois>=0.9.5",
    # Transitive dependencies
    "anyio",
    # Needed for some reason
    "sniffio",
    # Process management (required for running apps)
    "uwsgi>=2.0.31",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "typing-extensions>=4.12.2",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "hop3-testing",
    "types-pyyaml>=6.0.12.20250915",
    "types-markdown>=3.10.0.20251106",
]

[project.scripts]
hop3-server = "hop3.server.cli:main"
hop3-catalog = "hop3.server.catalog.publish:main"

[project.optional-dependencies]
waf = [
    "lewaf>=0.7.5 ; python_full_version >= '3.12'",
]

# ----------------------------------------

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hop3"
module-root = "src"

#[tool.uv.sources]
#hop3-testing = { path = "../hop3-testing", editable = true }

# -----------------------------------------------------------------------------

[tool.deptry.per_rule_ignores]
# X defined as a dependency but not used in the codebase
DEP002 = [
    "cyclonedx-bom",
    "jinja2",
    "itsdangerous",
    "python-multipart",
    "sniffio",
    "uwsgi",
    # Optional WAF engine (hop3-server[waf] extra, ADR 050); imported lazily by
    # the proxy-lifecycle slice that isn't wired yet. Drop this once it imports lewaf.
    "lewaf",
]

#DEP003 = [
#    "snoop",
#]

[tool.tepyd]
# Generated by `tepyd init` — review and adjust.
src_root = "src/hop3"
src_package = "hop3"
units = ["*"]
# counter = "internal"   # or "cloc"

# Source units to exclude from analysis (a reason is required):
# [tool.tepyd.exclude]
# faker = "why this is not tested"

[[tool.tepyd.tiers]]
name = "a_unit"
root = "tests/a_unit"
label = "unit"
target_share = 0.6

[[tool.tepyd.tiers]]
name = "b_integration"
root = "tests/b_integration"
label = "integration"

[[tool.tepyd.tiers]]
name = "c_e2e"
root = "tests/c_e2e"
label = "e2e"

[[tool.tepyd.tiers]]
name = "c_system"
root = "tests/c_system"
label = "system"
