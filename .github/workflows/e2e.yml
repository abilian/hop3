name: E2E Tests

on:
  # Run on schedule (nightly)
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  # Allow manual trigger
  workflow_dispatch:
  # Run on pushes to main branch (but not PRs to avoid long CI times)
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-docker:
    name: E2E Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --inexact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run E2E tests
        run: |
          uv run pytest -v --tb=short packages/hop3-server/tests/d_e2e
        env:
          # HOP3_UNSAFE=true is set in Docker test environment automatically
          # No HOP3_DEV_HOST means tests run in Docker
          PYTEST_TIMEOUT: 300

      - name: Upload E2E test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            packages/hop3-server/tests/d_e2e/*.log
            /tmp/hop3-e2e-*.log
          retention-days: 7
          if-no-files-found: ignore

  system-tests:
    name: System Tests (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: |
          uv sync --inexact

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run system tests
        run: |
          uv run pytest -v --tb=short packages/hop3-server/tests/c_system
        env:
          PYTEST_TIMEOUT: 300

      - name: Upload system test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-logs
          path: |
            packages/hop3-server/tests/c_system/*.log
            /tmp/hop3-system-*.log
          retention-days: 7
          if-no-files-found: ignore
