[project]
name = "hop3"
version = "0.4.0a2"
description = "Simple PaaS - Deploy and manage web applications on a single server"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # Workspace
    # "hop3-agent",
    "hop3-testing",
    "hop3-cli",
    "hop3-tui",
    "hop3-server",
    # Later
    #    "hop3-lib",
    #    "hop3-web",
    # Debug (remove later)
    "devtools~=0.12",
    "snoop ~= 0.6",
    # Used by manual install (remove later)
    "invoke ~= 2.2.0",
    "tomlkit",
    "python-dotenv",
    "attrs>=25.3.0",
    "dishka>=1.7.2",
]

[project.urls]
"Homepage" = "https://hop3.cloud/"
"Source Code" = "https://github.com/abilian/hop3"
"Issue Tracker" = "https://github.com/abilian/hop3/issues"
"Original Project" = "https://github.com/abilian/nua"

[dependency-groups]
dev = [
    # Generic tools
    "abilian-devtools >= 0.7",
    "reuse >= 5.0",
    # Pinned
    "ruff != 0.11.3",
    # Used by `inv watch`
    "watchfiles >= 0.24.0",
    # Used by `make run` to manage multiple processes
    "honcho >= 1.1.0",
    # Testing and testing infra
    "pytest>=8.4.2",
    "pytest-asyncio >= 0.23.0",
    "httpx>=0.27.0",
    "python-dotenv >= 1.0.1",
    "urllib3",
    "snoop>=0.6.0",
    "docker>=7.1.0",
    # Experimental
    "infer-types~=1.0.0",
    # Installer
    "pyinfra ~= 3.0",
    # Type helpers
    "types-toml>=0.10.8.20240310",
    "types-requests>=2.32.0.20241016",
    "types-paramiko>=3.5.0.20240928",
    "types-pytz>=2024.2.0.20241003",
    "types-tabulate>=0.9.0.20240106",
    "types-urllib3>=1.26.25.14",
    # Type checking
    "pyrefly>=0.34.0",
    "beartype>=0.19.0",
    "pytest-beartype>=0.2.0",
    "ty>=0.0.0a7",
    # More tools
    "import-linter>=2.1",
    # SBOM
    "cyclonedx-bom>=5.1.1",
    "lbom>=0.6",
    "sbom4python>=0.11.3",
    "spdx-tools>=0.8.3",
    "pytest-xdist>=3.8.0",
    "uwsgi>=2.0.31",
    "types-pyyaml>=6.0.12.20250915",
    "types-markdown>=3.10.0.20251106",
]

doc = [
    # MkDocs core and extensions
    "mkdocs",
    "mkdocs-material",
    "mkdocs-material-extensions",
    # MkDocs plugins
    "mkdocs-coverage>=1.0",
    "mkdocs-gen-files>=0.5",
    "mkdocs-git-revision-date-localized-plugin>=1.2",
    "mkdocs-include-markdown-plugin",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-minify-plugin>=0.8",
    "mkdocs-roamlinks-plugin",
    "mkdocstrings[python]",
    # Markdown extensions
    "markdown-callouts>=0.4",
    "markdown-exec>=1.8",
    # Syntax highlighting
    "pygments",
    # Documentation linting
    "pydoclint[flake8]>=0.5.9",
]

# ------------------------------------

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hop3-cli = { workspace = true }
hop3-server = { workspace = true }
hop3-testing = { workspace = true }
hop3-tui = { workspace = true }

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# ------------------------------------
# Tools
# ------------------------------------

[tool.isort]
profile = "black"

# ------------------------------------

[tool.pytest.ini_options]
# See: https://docs.pytest.org/en/7.1.x/explanation/pythonpath.html#import-modes
# and: https://docs.pytest.org/en/7.1.x/explanation/goodpractices.html#choosing-an-import-mode
addopts = "-ra --import-mode=importlib --tb=short"
testpaths = [
    "packages/hop3-server/tests/a_unit",
    "packages/hop3-server/tests/b_integration",
    "packages/hop3-server/tests/c_system",
    "packages/hop3-cli/tests",
    # E2E tests with Docker are slow - run separately with: make test-e2e
    # "packages/hop3-server/tests/d_e2e",
    # Disabled for now
    #    "packages/*/tests",
    #    # Tests may be in the same directory as the code
    #    "packages/*/src",
]
markers = [
    "e2e: End-to-end tests using hop3-cli binary (auto-starts local server)",
    "docker: E2E tests using Docker containers (slow, run with make test-e2e)",
    "integration: Integration tests using real database (state-based testing)",
]

# ------------------------------------

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]

# ------------------------------------

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
warn_no_return = true
warn_unused_ignores = true
check_untyped_defs = true

exclude = [
  "^packages/hop3-server/src/hop3/builders/java\\.py$",
]
