[project]
name = "hop3"
version = "0.8.0"
description = "Simple PaaS - Deploy and manage web applications on a single server"
authors = [
    { name = "Stefane Fermigier", email = "sf@abilian.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    # Workspace
    # "hop3-agent",
    "hop3-server",
    "hop3-cli",
    "hop3-tui",
    "hop3-installer",
    "hop3-testing",
    "hop3-rootd",
    "hop3-testlab",
    "hop3-tooling",
    "hop3-marketplace",
    "mdx-truly-sane-lists>=1.3",
]

[project.urls]
"Homepage" = "https://hop3.cloud/"
"Source Code" = "https://github.com/abilian/hop3"
"Issue Tracker" = "https://github.com/abilian/hop3/issues"
"Original Project" = "https://github.com/abilian/nua"

[dependency-groups]
dev = [
    # Generic tools
    "abilian-devtools >= 0.7",
    "reuse >= 5.0",
    # Type checking / linting
    "ruff != 0.11.3",
    "pyrefly>=0.34.0",
    "beartype>=0.19.0",
    "pytest-beartype>=0.2.0",
    "ty>=0.0.0a7",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
    "zuban>=0.8.2",
    # Used by `inv watch`
    "watchfiles >= 0.24.0",
    # Used by `make run` to manage multiple processes
    "honcho >= 1.1.0",
    # Testing and testing infra
    "pytest>=8.4.2",
    "pytest-asyncio >= 0.23.0",
    "httpx>=0.27.0",
    "python-dotenv >= 1.0.1",
    "urllib3",
    "snoop>=0.6.0",
    "docker>=7.1.0",
    "validoc>=0.1.1; python_version >= '3.12'",
    # Experimental
    "infer-types~=1.0.0",
    # Installer
    "pyinfra ~= 3.0",
    # Type helpers
    "types-toml>=0.10.8.20240310",
    "types-requests>=2.32.0.20241016",
    "types-paramiko>=3.5.0.20240928",
    "types-pytz>=2024.2.0.20241003",
    "types-tabulate>=0.9.0.20240106",
    "types-urllib3>=1.26.25.14",
    "types-pyyaml>=6.0.12.20250915",
    "types-markdown>=3.10.0.20251106",
    # More tools
    "import-linter>=2.1",
    # SBOM
    "cyclonedx-bom>=5.1.1",
    "lbom>=0.6",
    "sbom4python>=0.11.3",
    "spdx-tools>=0.8.3",
    "pytest-xdist>=3.8.0",
    # Nothing in the workspace is optional to its test suite: the root conftest
    # fails an importorskip rather than skip it. The WAF suites need the extra.
    "hop3-server[waf]",
    # Drives the S3 side of the opt-in Garage integration test.
    "boto3>=1.35",
    "twine>=6.2.0",
    # 3.12+ only; conditional so the workspace can sync under 3.10 / 3.11.
    "dead-code-detector>=0.5.0; python_version >= '3.12'",
    "md2typst>=0.3.3; python_version >= '3.12'",
    "libcst>=1.8.6",
    "tach>=0.35.0",
    "tepyd>=0.7.0",
]

doc = [
    "zensical",
]

# ------------------------------------

[tool.uv]
package = false
# Supply-chain cooldown: a lock never selects a distribution uploaded in the
# last week. A compromised release is usually caught and yanked within days;
# `uv lock --upgrade` would otherwise take it the hour it lands. The server
# installer applies the same week to its venv (hop3_installer's pip.conf).
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hop3-server = { workspace = true }
hop3-cli = { workspace = true }
hop3-installer = { workspace = true }
hop3-testing = { workspace = true }
hop3-tui = { workspace = true }
hop3-rootd = { workspace = true }
hop3-testlab = { workspace = true }
hop3-tooling = { workspace = true }
hop3-marketplace = { workspace = true }

[build-system]
requires = ["uv-build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

# ------------------------------------
# Tools
# ------------------------------------

[tool.isort]
profile = "black"

# ------------------------------------

[tool.pytest.ini_options]
# See: https://docs.pytest.org/en/7.1.x/explanation/pythonpath.html#import-modes
# and: https://docs.pytest.org/en/7.1.x/explanation/goodpractices.html#choosing-an-import-mode
addopts = "-ra --import-mode=importlib --tb=short"
# Default (bare `pytest`) = the FAST, no-Docker lane (ADR 043). The Docker
# `c_e2e` layer is NOT here; it's the `check` tier, run via `make test`.
# To include c_e2e in the bare-pytest default, add its path back below.
testpaths = [
    "packages/hop3-server/tests/a_unit",
    "packages/hop3-server/tests/b_integration",
    "packages/hop3-cli/tests",
]
markers = [
    "fast: Fast, hermetic tests — no Docker/root/network (the inner loop).",
    "integration: In-process integration tests (real in-memory DB, no Docker).",
    "e2e: End-to-end tests that deploy to a real target (Docker/SSH).",
    "needs_docker: Test requires a Docker daemon (a subset of e2e).",
    "slow: Slow tests (substantial setup); informational label.",
]

[tool.coverage.report]
exclude_also = [
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]
skip_covered = true
skip_empty = true

# ------------------------------------

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
warn_no_return = true
warn_unused_ignores = false
check_untyped_defs = true


[tool.pyrefly]
# Every package's source root, so a cross-package `hop3.*` import resolves the
# same way here as it does at runtime in the workspace venv.
#
# Without this, pyrefly 1.3 resolves those imports to `Unknown` — it no longer
# infers the source roots of a uv workspace, and falls back to importing
# [tool.mypy] above, whose `strict_optional` and `warn_no_return` then report
# the unknowns as errors in code mypy and zuban both accept. `Abort` came out
# as `Unknown`, so `isinstance(e, Abort)` narrowed to `Exception` and `e.msg`
# "did not exist"; `abort_with_diagnosis` came out as `Unknown`, so its
# `NoReturn` stopped reaching the callers that rely on it.
search-path = [
    "packages/hop3-cli/src",
    "packages/hop3-installer/src",
    "packages/hop3-marketplace/src",
    "packages/hop3-rootd/src",
    "packages/hop3-server/src",
    "packages/hop3-testing/src",
    "packages/hop3-testlab/src",
    "packages/hop3-tooling/src",
    "packages/hop3-tui/src",
]

[tool.ty.rules]
# Suppress warnings about mypy-style type: ignore comments
# (these are needed for mypy but ty doesn't recognize them)
unused-type-ignore-comment = "ignore"

[tool.dead-code-detector]
report = "flat"
live-decorators = true

# ----------------------------------------------------------

[tool.bruce]
source  = [
    "packages/hop3-rootd/src",
    "packages/hop3-server/src",
    "packages/hop3-cli/src",
]
context = [
    "docs/src/**/security*.md",
    "notes/adrs/*security*.md",
    "notes/security/security-model.md",
]
history = [
    "notes/security/report-*.md",
    "docs/blog/posts/*security-audit.md",
]
