# hop3.toml - Hop3 Docker application configuration

# The [metadata] section describes your application.
[metadata]
id = "hello-docker"
version = "0.1.0"
title = "Hello Docker App"
author = "Hop3 Demo"
description = "A Docker-based Flask application to demonstrate Hop3 container deployment."

# The [build] section tells Hop3 how to build your application.
[build]
# Use Docker builder - builds image from Dockerfile
builder = "docker"

# The [processes] section defines the web process (informational for Docker)
[processes]
web = "gunicorn app:app --bind 0.0.0.0:8080"
