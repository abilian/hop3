# PEP-621 metadata so Hop3's Python toolchain installs this with `pip install .`.
[project]
name = "flask-app"
version = "0.1.0"
description = "Nua test flask two"
requires-python = ">=3.10"
dependencies = [
    "gunicorn>=23.0.0",
    "Flask>=2.1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["app"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
