# hop3.toml - Native Python app with PostgreSQL addon

[metadata]
id = "demo31-postgres"
version = "0.1.0"
title = "Native PostgreSQL Demo"
description = "Demonstrates native Python deployment with PostgreSQL addon"

[build]
# Use native builder - Python toolchain is auto-detected from requirements.txt
builder = "local"
pip-install = ["-r", "requirements.txt"]

[run]
start = "gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app"
