[metadata]
id = "demo59"
version = "1.0.0"
title = "Elixir Prerequisite Test"

[build]
# The Elixir toolchain installs Hex/rebar (mix local.hex/rebar --force) and runs
# deps.get + compile with app-local MIX_HOME/HEX_HOME, then bakes those into the
# runtime — so there is nothing to hand-roll here, and no app should hardcode
# MIX_HOME/HEX_HOME (a literal "demo59" path crash-loops any other app name).
packages = ["elixir", "erlang"]

[run]
start = "elixir --no-halt -S mix run"

[port]
web = 4000

[healthcheck]
path = "/up"
timeout = 30
interval = 60
