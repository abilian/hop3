# BookStack - Self-hosted documentation wiki
# https://www.bookstackapp.com/

[metadata]
id = "bookstack"
version = "24.12"
title = "BookStack"
description = "Simple, self-hosted documentation platform with a wiki-style interface"
tags = ["php", "mysql", "wiki", "documentation"]

[build]
builder = "docker"

[docker]
port = 80

[env]
# BookStack configuration
# Database settings are injected via DATABASE_URL parsing in start.sh
APP_DEBUG = "false"
APP_ENV = "production"

[[provider]]
name = "mysql"
plan = "standard"
