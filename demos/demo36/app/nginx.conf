server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/kanboard;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
    }

    location ~ /data {
        deny all;
        return 404;
    }

    location ~* ^.+\.(log|sqlite)$ {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* ^.+\.(ico|jpg|gif|png|css|js|svg|eot|ttf|woff|woff2|otf)$ {
        log_not_found off;
        expires 7d;
        etag on;
    }

    gzip on;
    gzip_comp_level 3;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/xml+rss application/javascript image/svg+xml;
}
