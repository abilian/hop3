# Demo 27: OpenCloud
# A self-hosted file sharing platform

[metadata]
name = "demo27"

[build]
builder = "docker"

[env]
# Default admin password (change this!)
ADMIN_PASSWORD = "admin"

[docker]
# OpenCloud listens on port 9200 by default
port = 9200
runtime = "docker-compose"

[healthcheck]
# Health check path
path = "/"
