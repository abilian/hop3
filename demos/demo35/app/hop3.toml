# hop3.toml - Native Python app with declarative Redis provider
#
# This demo showcases the [[addons]] section for declaring addon dependencies.
# The [[addons]] section declares that this app needs a Redis cache.

[metadata]
id = "demo35-provider-redis"
version = "0.1.0"
title = "Declarative Redis Demo"
description = "Demonstrates declarative addon provisioning with [[addons]] section for Redis"
tags = ["python", "redis", "provider", "cache"]

[build]
# Use native builder - Python toolchain is auto-detected from requirements.txt
builder = "local"
pip-install = ["-r", "requirements.txt"]

[run]
start = "gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app"

# Declarative addon dependency — this declares that the app needs Redis
[[addons]]
type = "redis"
