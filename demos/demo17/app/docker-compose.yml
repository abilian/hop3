# Demo 17: Multi-container Docker application
# This compose file is used by Hop3 for deployment

services:
  # Web application service
  web:
    image: ${HOP3_IMAGE_TAG}
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  # Redis service (internal, not exposed to host)
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    # Redis command with persistence
    command: redis-server --appendonly yes

volumes:
  redis_data:
