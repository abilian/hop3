# WordPress - The world's most popular CMS
# https://wordpress.org/

[metadata]
id = "wordpress"
version = "6.7"
title = "WordPress"
description = "The world's most popular content management system"
tags = ["php", "mysql", "cms", "blog"]

[build]
builder = "docker"

[docker]
port = 80

[env]
# WordPress will be configured via DATABASE_URL parsing in start.sh
WORDPRESS_DEBUG = "0"

[[provider]]
name = "mysql"
plan = "standard"
