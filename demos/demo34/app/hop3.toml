# hop3.toml - Native Python app with declarative MySQL provider
#
# This demo showcases the [[provider]] section for declaring addon dependencies.
# The [[provider]] section declares that this app needs a MySQL database.

[metadata]
id = "demo34-provider-mysql"
version = "0.1.0"
title = "Declarative MySQL Demo"
description = "Demonstrates declarative addon provisioning with [[provider]] section for MySQL"
tags = ["python", "mysql", "provider"]

[build]
# Use native builder - Python toolchain is auto-detected from requirements.txt
builder = "local"
pip-install = ["-r", "requirements.txt"]

[run]
start = "gunicorn --workers 2 --bind 0.0.0.0:$PORT app:app"

# Declarative provider section - this declares that the app needs MySQL
[[addons]]
type = "mysql"
