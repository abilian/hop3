preview = true
target-version = "py310"

exclude = [
    "apps",
    "scripts",
    "tasks.py",
    "docs",
    "demos",
    "spikes",
]

lint.select = [
    "ALL",
]

lint.extend-ignore = [
    # Never
    "PD", # We're not using Pandas

    # Later (or never)
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "BLE", # flake8-blind-except
    "CPY", # Copyright
    "D", # pydocstyle
    "DOC", # pydocstyle
    "ERA", # eradicate
    "FIX", # flake8-fixme
    "PTH", # flake8-use-pathlib
    "S", # flake8-bandit
    "T20", # flake8-print
    "TD", # flake8-todos
    "FBT",
    "E501", # line too long

    # False positive, don't remove
    "A001",
    "A004", # ... is shadowing a Python standard library module
    "A005", # ... is shadowing a Python builtin module
    "COM812", # Missing trailing comma
    "FURB113", # repeated-append
    "INP001", # implicit-namespace-package
    "ISC001", # (The following rules may cause conflicts when used with the formatter)
    "PGH003", # Use specific rule codes when ignoring type issues
    "PLC0414", # Import alias does not rename original package
    "PLC1901", # An empty string is falsey; consider using `not s` if this is intended
    "PLR2004", # Magic number
    "PLR6301", # Method could be a function
    "PLR0904", # too-many-public-methods
    "PLR0913", # too-many-arguments
    "PLW1514", # `pathlib.Path(...).write_text` without explicit `encoding` argument
    "RET504", # Unnecessary assignment before `return` statement
    "S101", # Use of `assert` detected
    "SIM102", # Use a single `if` statement instead of nested `if` statements
    "SIM108", # Use ternary operator
    "TRY300", # Consider moving this statement to an `else` block
    "PERF401", #  7 - PERF401	manual-list-comprehension
    "RUF067", # `__init__` module should only contain docstrings and re-exports
    "RUF070", # unnecessary-assign-before-yield
    "RUF001", # ambiguous-unicode-character-string
    "RUF201", #
    #
    # Fix this (later)
    #
    "PLW2901", # redefined-loop-name
    "PLR0917", # too-many-positional-arguments
    "PERF203", # try-except-in-loop
    "TRY301", #  raise-within-try
    "PLR0914", # too-many-locals
    "A002", #    builtin-argument-shadowing
    # TODO (soon)
    "RUF100", # unused noqa
    "PLC0415", # import-outside-top-level
    # "E402", #    module-import-not-at-top-of-file
    "EM102", #   f-string-in-exception
    "TRY003", #  raise-vanilla-args
    "RUF027", #  missing-f-string-syntax
]

[lint.pylint]
max-statements-in-try = 30

[lint.mccabe]
# TODO: Set max-complexity = 10
max-complexity = 11

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
known-first-party = ["hop3"]

[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ANN",
    # Legit
    "PLC2701", # import-private-name
    "SLF001", #  private-member-access
    "RUF069", #  float-equality-comparison
    "PT012", #   pytest-raises-with-multiple-statements
    #
    "PT011", #   pytest-raises-too-broad
    "N806", #    non-lowercase-variable-in-function
    "PLR0915", # too-many-statements
    "B904", #    raise-without-from-inside-except
    "C901", #    complex-structure
    "PLR0912", # too-many-branches
]
"**/noxfile.py" = [
    "INP001", # implicit namespace package
]

"**/src/**/*.py" = [
    "PT", # Pytest warnings in source code are probably false positives
]
"packages/hop3-server/src/hop3/orm/**/*.py" = [
    "TC",
]
"packages/hop3-server/src/hop3/server/cli/**/*.py" = [
    "T20", # flake8-print
]
"packages/hop3-testing/**/*.py" = [
    "FBT",
    "T20", # flake8-print
]
"packages/hop3-tui/**/*.py" = [
    "FBT",
    "T20", # flake8-print
]
"packages/hop3-installer/src/**/*.py" = [
    # Real imports are needed by the bundler
    "TC001",
    "RUF005", #  collection-literal-concatenation
    "DTZ005", #  call-datetime-now-without-tzinfo
    "TRY003", #  raise-vanilla-args
]
"packages/hop3-installer/src/hop3_installer/cli_installer/*.py" = [
    # Real imports are needed by the bundler
    "TC001"
]
"packages/hop3-installer/src/hop3_installer/server_installer/*.py" = [
    # Real imports are needed by the bundler
    "TC001"
]
"packages/hop3-installer/tests/c_e2e/utils/**/*.py" = [
    # A self-contained test-utils package, imported as a package (conftest does
    # `from .utils import ...`) and deliberately NOT on sys.path. Under
    # --import-mode=importlib an absolute `from utils.common` can't resolve, so
    # its internal modules must use parent-relative imports.
    "TID252", # relative-imports
]
"packages/hop3-rootd/src/**/*.py" = [
    # Daemon raises rich exceptions with inline interpolated messages
    "TRY003", # raise-vanilla-args
    "EM101",  # raw-string-in-exception
    "EM102",  # f-string-in-exception
    # AGENTS.md: imports stay at top level (no TYPE_CHECKING shuffling)
    "TC001", # move-first-party-import-to-type-checking-block
    "TC003", # move-standard-library-import-to-type-checking-block
    # Explicit try/except reads clearer at our error / audit boundaries
    "SIM105", # suppress-context-manager
]
