image: rockylinux/latest

packages:
  # Python
  - python3.11
  - python3.11-pip
  - python3.11-devel
  - python3.12
  - python3.12-pip
  - python3.12-devel
  # Build tools
  - make
  - gcc
  # Libraries
  - libpq-devel
  # Extra tools (TODO: remove)
  - rsync
  # For builders
  - npm
  - rubygem-bundler
  - ruby-devel
  # Docker and friends (NB: docker is not available on Rocky Linux)
  - buildah
  - passt-selinux

tasks:
  - setup: |
      cd hop3
      sudo pip3.12 install -U uv nox
      uv sync

  - nox: |
      cd hop3
      uv run nox -e lint
      uv nox -P 3.12
      uv nox -P 3.11

  - buildah: |
      cd hop3
      buildah build .

  # - e2e-docker: |
  #     cd hop3
  #     hop3-test ci
