image: rockylinux/latest

packages:
  # Python
  - python3.11
  - python3.11-pip
  - python3.11-devel
  - python3.12
  - python3.12-pip
  - python3.12-devel
  # Build tools
  - make
  - gcc
  # Libraries
  - libpq-devel
  # Extra tools (TODO: remove)
  - rsync
  # For builders
  - npm
  - rubygem-bundler
  - ruby-devel
  # Docker and friends (NB: docker is not available on Rocky Linux)
  - buildah
  - podman-docker
  - passt-selinux

tasks:
  - setup: |
      cd hop3
      sudo pip3.12 install -U uv nox
      uv sync

  - test: |
      cd hop3
      uv run pytest packages/hop3-server/tests/a_unit
      uv run pytest packages/hop3-server/tests/b_integration
      uv run pytest packages/hop3-cli/tests

  # - nox: |
  #     cd hop3
  #     uv run nox -P 3.12
  #     uv run nox -P 3.11
