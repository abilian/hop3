image: nixos/latest

packages:
  - python
  - uv
  - git
  - gnumake
  - postgresql
  - sqlite
  - gcc
  - openssl
  - pcre2
  - libxcrypt

  # - python3-3.12.12-env
  # - uv-0.9.25
  # - git-2.52.0
  # - gnumake-4.4.1
  # - postgresql-17.7-dev
  # - sqlite-3.51.1-dev
  # - gcc-wrapper-15.2.0
  # - openssl-3.6.0-dev
  # - pcre2-10.46-dev
  # - libxcrypt-4.5.2

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

tasks:
  - setup: |
      cd hop3
      pip install --user -U uv
      export PATH="$HOME/.local/bin:$PATH"
      uv sync

  - lint: |
      cd hop3

      export PATH="$HOME/.local/bin:$PATH"
      uv run make lint

  - test: |
      cd hop3
      export PATH="$HOME/.local/bin:$PATH"
      uv run make test

  - nox: |
      cd hop3
      export PATH="$HOME/.local/bin:$PATH"
      uv run nox -P 3.12

  - buildah: |
      cd hop3
      buildah build .
