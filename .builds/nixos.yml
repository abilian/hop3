# Note:
# To test locally, run: "nix build .#hop3-server -L"
#

image: nixos/latest

repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable

packages:
  - nixpkgs.python3
  - nixpkgs.git
  - nixpkgs.gnumake
  - nixpkgs.ruff

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

tasks:
  # Build packages using nix (verifies nix package definitions)
  - build: |
      cd hop3
      nix build .#hop3-cli -L
      nix build .#hop3-server -L

  # Install with uv and run tests (using FHS shell for uv compatibility)
  - test: |
      cd hop3
      nix develop .#fhs --command bash -c '
        set -ex

        # uv works in FHS environment
        uv sync

        # No Docker on NixOS here -> fast lane only (all packages, no Docker)
        uv run make test-fast
      '

  # Reproducibility gate, static half (ADR 008): every committed nix-gen recipe
  # must generate an expression that parses as Nix. Runs here because this is
  # the only image with nix-instantiate — elsewhere the parse assertions skip.
  # The build half (rebuild bit-for-bit + deploy, `make gate-nix`) needs a warm
  # /nix/store and runs on the nightly box, not on a fresh CI runner.
  - nix-gen: |
      cd hop3
      nix develop .#fhs --command bash -c '
        set -ex
        command -v nix-instantiate
        uv run pytest -q --no-header \
          packages/hop3-server/tests/a_unit/plugins/test_nix_gen_corpus.py
      '

  # Lint check (use ruff from nixpkgs, not pip)
  - check: |
      cd hop3
      ruff check packages/hop3-cli/src packages/hop3-server/src
