image: nixos/latest

repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable

packages:
  - nixpkgs.python3
  - nixpkgs.uv
  - nixpkgs.git
  - nixpkgs.gnumake
  - nixpkgs.postgresql
  - nixpkgs.sqlite
  - nixpkgs.gcc
  - nixpkgs.openssl
  - nixpkgs.pcre2
  - nixpkgs.libxcrypt

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

tasks:
  - setup: |
      cd hop3
      nix develop

  - test: |
      cd hop3
      nix shell --command uv run pytest packages/hop3-server/tests/a_unit
      nix shell --command uv run pytest packages/hop3-cli/tests

  - check: |
      cd hop3
      nix shell --command uv run make check
