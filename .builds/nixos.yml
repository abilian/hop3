image: nixos/latest

repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable

packages:
  - nixpkgs.python3
  - nixpkgs.uv
  - nixpkgs.git
  - nixpkgs.gnumake
  - nixpkgs.postgresql
  - nixpkgs.sqlite
  - nixpkgs.gcc
  - nixpkgs.openssl
  - nixpkgs.pcre2
  - nixpkgs.libxcrypt

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

tasks:
  - setup: |
      cd hop3
      nix develop

