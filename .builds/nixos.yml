image: nixos/latest

repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable

packages:
  - nixpkgs.python3
  - nixpkgs.git
  - nixpkgs.gnumake
  - nixpkgs.ruff

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

tasks:
  # Build packages using nix (verifies nix package definitions)
  - build: |
      cd hop3
      nix build .#hop3-cli -L
      nix build .#hop3-server -L

  # Install with pip and run tests
  - test: |
      cd hop3
      nix develop --command bash -c '
        set -ex

        # Create venv and install
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip hatchling

        # Install test dependencies first
        pip install pytest filelock pytest-xdist faker

        # Install packages (without dev extras since they use uv)
        pip install -e "packages/hop3-cli"
        pip install -e "packages/hop3-testing"
        pip install -e "packages/hop3-server"

        # Run tests
        pytest packages/hop3-cli/tests -v
        pytest packages/hop3-server/tests/a_unit -v
      '

  # Lint check (use ruff from nixpkgs, not pip)
  - check: |
      cd hop3
      ruff check packages/hop3-cli/src packages/hop3-server/src
