image: nixos/latest

repositories:
  nixpkgs: https://nixos.org/channels/nixpkgs-unstable

packages:
  - nixpkgs.python3
  - nixpkgs.git
  - nixpkgs.gnumake

environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"

tasks:
  - setup: |
      cd hop3
      # Use FHS shell to avoid dynamically linked executable issues
      nix develop .#fhs --command uv sync

  - test: |
      cd hop3
      nix develop .#fhs --command uv run pytest packages/hop3-server/tests/a_unit
      nix develop .#fhs --command uv run pytest packages/hop3-cli/tests

  - check: |
      cd hop3
      nix develop .#fhs --command uv run make check

  - build: |
      cd hop3
      nix build
