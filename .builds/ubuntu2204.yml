image: ubuntu/22.04

# SSH key for e2e test machine
secrets:
  - 705a1519-b37e-4205-94a4-354c085dbdcc

packages:
  # Build tools
  - software-properties-common
  - build-essential
  - make
  - gcc
  - g++
  # Python (this is Python 3.10 on 22.04)
  - python3-dev
  - python3-pip
  - python3-venv
  - python3-wheel
  # Libraries
  - libpq-dev
  - libffi-dev
  - libsqlite3-dev
  - libbz2-dev
  # Extra tools (TODO: remove)
  - rsync
  # For builders
  - npm
  - ruby-rubygems
  - bundler
  - ruby-dev
  - golang-go
  # Docker (for tests)
  - docker.io

tasks:
  - setup: |
      cd hop3
      sudo pip install -U uv
      sudo chmod 666 /var/run/docker.sock
      uv sync

  - lint: |
      cd hop3
      uv run make lint

  - test: |
      cd hop3
      # check tier: in-process across all packages (no Docker)
      unset HOP3_DEV_HOST
      uv run make test

  - test-e2e: |
      cd hop3
      # Docker e2e: backups, git-push, real deploys (c_e2e)
      unset HOP3_DEV_HOST
      uv run make test-e2e

  - nox: |
      cd hop3
      sudo chmod 666 /var/run/docker.sock
      uv run nox -P 3.11
      uv run nox -P 3.12
