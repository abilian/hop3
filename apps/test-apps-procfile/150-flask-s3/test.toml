# Test definition for the Flask S3 smoke-test app.

[test]
name = "150-flask-s3"
category = "deployment"
tier = "medium"
priority = "P1"
description = "Flask app that round-trips an object through the Hop3 S3 addon"

[test.requirements]
targets = ["docker", "remote"]
services = ["s3"]

[test.metadata]
author = "hop3-team"
covers = ["python", "flask", "s3", "addons"]

[deployment]
path = "."
type = "python"

# Root endpoint does a real S3 put/get round-trip and reports success
# with "S3 addon OK". This validates the whole chain:
#   addon created → credentials stored → env injected → app reads them → S3 API reachable.
[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "S3 addon OK"

# /config endpoint echoes the S3 env vars (minus the secret) so we can
# verify the addon actually injected something.
[[validations]]
type = "http"
path = "/config"
[validations.expect]
status = 200
contains = "has_access_key"
