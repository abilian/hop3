# Test definition for static website

[test]
name = "000-static"
category = "deployment"
tier = "fast"
priority = "P0"
description = "Simple static website served by nginx"

[test.requirements]
targets = ["docker", "remote"]
services = []

[test.metadata]
author = "hop3-team"
covers = ["static", "nginx"]

[deployment]
path = "."
type = "static"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "<!DOCTYPE html>"
