[test]
name = "nix-golang-minimal"
category = "nix-app"
tier = "fast"
priority = "P1"
description = "Minimal Go app (stdlib only) deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "Hello World"
