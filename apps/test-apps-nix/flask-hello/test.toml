# Test definition for Flask app built with Nix

[test]
name = "nix-flask-hello"
category = "nix-app"
tier = "medium"
priority = "P1"
description = "Flask application built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["python", "flask", "nix", "gunicorn"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "Hello from Nix"
