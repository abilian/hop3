# hop3.toml - Hop3 configuration for Nix-based Flask/Gunicorn app

[build]
builder = "nix"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "flask", "gunicorn", "nix"]

[[test.validations]]
path = "/"
status = 200
contains = "Hello World"
