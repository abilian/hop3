# The same app as apps/test-apps-procfile/020-nodejs-express, packaged by the
# generator from this directory: the git-push case for the node-pnpm-install
# template. Dependencies come from the committed pnpm lockfile, fetched once by
# a fixed-output derivation and installed offline.

[metadata]
id = "nodejs-express-gen"
version = "1.0.0"
description = "Express hello world, packaged from local source by nix-gen"

[build]
builder = "nix"

[nix]
template = "node-pnpm-install"
node-local-source = true
node-manifest = "package.json"
node-lockfile = "pnpm-lock.yaml"
node-deps-hash = "sha256-B4/SuYN7tyXbTB8hhZxVAkJHMnHbWti/nR+Eg3qqr/0="
runtime-package = "nodejs_22"
# The app's own entry script, run by node.
exec-target = "app.js"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "fast"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "express", "pnpm", "nix", "nix-gen", "local-source"]

[[test.validations]]
path = "/"
status = 200
contains = "Hello World, from Node/Express"
