# Filebrowser - Web-based File Browser and Manager

[metadata]
id = "filebrowser"
title = "Filebrowser"
description = "Web-based file browser and manager with a Material Design interface"
author = "Filebrowser Community"
license = "Apache-2.0"
website = "https://filebrowser.org/"
repository = "https://github.com/filebrowser/filebrowser"
tags = ["files", "file-manager"]

[app]
name = "filebrowser"
builder = "docker"

[web]
port = 8080

[healthcheck]
path = "/health"
