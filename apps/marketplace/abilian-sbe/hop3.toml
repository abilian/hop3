# Abilian SBE - Social Business Engine

[metadata]
id = "abilian-sbe"
title = "Abilian SBE"
description = "Abilian SBE (Social Business Engine) is an open-source social business platform for organizations, providing collaboration, document management, and social networking features"
author = "Abilian SAS"
license = "LGPL-2.1"
website = "https://abilian.com/"
repository = "https://github.com/abilian/abilian-sbe-monorepo"
tags = ["collaboration", "social", "enterprise", "documents", "python"]

[app]
name = "abilian-sbe"
builder = "docker"

[web]
port = 8000

[healthcheck]
path = "/"

[[provider]]
name = "postgres"

[[provider]]
name = "redis"
