# OpenCloud - Excellent File Sharing

[metadata]
id = "opencloud"
version = "0.2.0"
upstream_version = "v4.0.0"
title = "OpenCloud"
author = "OpenCloud Authors"
description = "OpenCloud is an open source file sharing platform that provides enterprise-grade file sync and share capabilities."
website = "https://opencloud.eu"
license = "Apache-2.0"
tags = ["storage", "nextcloud", "owncloud", "dropbox", "drive", "files"]

[source]
type = "binary"
url = "https://github.com/opencloud-eu/opencloud/releases/download/${upstream_version}/opencloud-${upstream_version}-linux-amd64"

[build]
packages = []

[run]
start = "/app/scripts/start.sh"
packages = []

[port]
web = 9200

[healthcheck]
path = "/"
timeout = 30

[resources]
memory = "512M"

[env]
OC_INSECURE = "true"
PROXY_TLS = "false"

[integration]
sendmail = true
sso = "optional"

[storage]
local = true
