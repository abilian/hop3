# Redash - Data Visualization and Dashboards

[metadata]
id = "redash"
version = "5.3.1"
upstream_version = "25.8.0"
title = "Redash"
author = "Redash Developers"
description = "Redash helps you make sense of your data. Connect to any data source, easily visualize, dashboard and share your data."
website = "https://redash.io/"
license = "BSD-2-Clause"
tags = ["data", "analytics", "visualization", "dashboards", "bi", "business-intelligence"]

[source]
type = "tarball"
url = "https://github.com/getredash/redash/archive/v${upstream_version}.tar.gz"

[source.nodejs]
version = "18.20.5"

[source.python]
version = "3.10"

[build]
packages = ["python3.10", "python3.10-dev", "python3.10-venv", "nodejs", "curl", "msodbcsql17", "libsasl2-modules-gssapi-mit"]
before-build = [
    "curl -L https://nodejs.org/dist/v${nodejs_version}/node-v${nodejs_version}-linux-x64.tar.xz | tar Jxf - --strip-components 1 -C /usr/local/node",
    "npm install --global yarn@1.22.10",
    "corepack enable",
    "yarn --frozen-lockfile --network-concurrency 1",
    "yarn build",
    "curl -sSL https://install.python-poetry.org | python3.10 -",
    "/etc/poetry/bin/poetry install --only 'main,all_ds,dev,ldap3' --no-root --no-interaction --no-ansi"
]

[run]
start = "/app/scripts/start.sh"
before-run = "python /app/code/redash/manage.py db upgrade"
packages = ["python3.10", "nodejs", "supervisor"]

[port]
web = 5000

[healthcheck]
path = "/"
timeout = 30

[resources]
memory = "2560M"

[env]
REDASH_LOG_LEVEL = "INFO"
REDASH_WEB_WORKERS = "4"
REDASH_VERSION_CHECK = "false"
WORKERS_COUNT = "4"
SNOWFLAKE_HOME = "/run/snowflake-home"

[[provider]]
name = "postgres"

[[provider]]
name = "redis"
options = { noPassword = true }

[integration]
ldap = true
sendmail = true

[storage]
local = true

[processes]
web = "gunicorn -b 0.0.0.0:5000 --name redash -w %(ENV_REDASH_WEB_WORKERS)s redash.wsgi:app --max-requests 1000 --max-requests-jitter 100 --timeout 60"
rq = "python /app/code/redash/manage.py rq worker periodic emails default scheduled_queries queries schemas"
