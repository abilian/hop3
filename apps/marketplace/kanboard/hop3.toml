# Kanboard - Simple Visual Task Board

[metadata]
id = "kanboard"
version = "1.17.4"
upstream_version = "1.2.48"
title = "Kanboard"
author = "Frederic Guillot"
description = "Kanboard is a free and open source Kanban project management software"
website = "http://kanboard.org/"
license = "MIT"
tags = ["productivity", "project-management", "kanban", "task-management", "trello", "wekan"]

[source]
type = "tarball"
url = "https://github.com/kanboard/kanboard/tarball/v${upstream_version}"

[source.plugins]
oauth2 = { version = "1.0.2", url = "https://github.com/kanboard/plugin-oauth2/archive/refs/tags/v${version}.tar.gz" }

[build]
packages = ["php8.3", "apache2", "libapache2-mod-php8.3", "php8.3-mysql", "php8.3-mbstring", "php8.3-gd", "php8.3-xml", "php8.3-curl", "php8.3-zip"]

[run]
start = "/app/scripts/start.sh"
before-run = "php /app/code/cli db:migrate"
packages = ["php8.3", "apache2", "libapache2-mod-php8.3", "php8.3-mysql", "php8.3-mbstring", "php8.3-gd", "php8.3-xml", "php8.3-curl", "php8.3-zip", "mysql-client"]

[port]
web = 8000

[healthcheck]
path = "/"
timeout = 30

[php]
memory_limit = "64M"
upload_max_filesize = "64M"
post_max_size = "64M"
session_save_path = "/run/kanboard/sessions"
session_gc_probability = 1
session_gc_divisor = 100

[[provider]]
name = "mysql"

[integration]
sso = true
sendmail = true

[storage]
local = true

[scheduler]
cronjob = { schedule = "0 23 * * *", command = "php /app/code/cli cronjob" }
