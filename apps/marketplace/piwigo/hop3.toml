# Piwigo - Photo Gallery Software for the Web

[metadata]
id = "piwigo"
version = "3.1.0"
upstream_version = "16.1.0"
title = "Piwigo"
author = "Piwigo authors"
description = "Piwigo is photo gallery software for the web. It manages your photos and allows you to share them with your family, friends, and contacts."
website = "http://www.piwigo.org"
license = "GPL-2.0"
tags = ["images", "sharing", "media", "photos", "picasa"]

[source]
type = "tarball"
url = "https://piwigo.org/download/dlcounter.php?code=${upstream_version}"

[source.php]
version = "8.3"

[build]
packages = ["php", "apache2"]

[run]
start = "/app/scripts/start.sh"
packages = ["php", "apache2"]

[port]
web = 8000

[healthcheck]
path = "/"
timeout = 30

[resources]
memory = "512M"

[env]
PHP_MEMORY_LIMIT = "512M"

[[provider]]
name = "mysql"

[integration]
sendmail = true

[storage]
local = true
