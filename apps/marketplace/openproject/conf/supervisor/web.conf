[program:web]
user=%(ENV_HOP3_USER)s
environment=OPENPROJECT_ENABLE__INTERNAL__ASSETS__SERVER=true
directory=/app/code
command=bundle exec rails server -u puma -b 0.0.0.0 -p 8080
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
