# DokuWiki - Simple Wiki without Database

[metadata]
id = "dokuwiki"
version = "1.26.0"
upstream_version = "2025-05-14b"
title = "DokuWiki"
author = "Andreas Gohr and the DokuWiki Community"
description = "A simple to use and highly versatile Open Source wiki software that doesn't require a database"
website = "https://www.dokuwiki.org"
license = "GPL-2.0"
tags = ["wiki", "collaboration", "documentation"]

[source]
type = "tarball"
url = "http://download.dokuwiki.org/src/dokuwiki/dokuwiki-${upstream_version}.tgz"

# Plugin versions
[source.plugins]
oauth = { version = "2025-10-23", url = "https://github.com/cosmocode/dokuwiki-plugin-oauth/archive/refs/tags/${version}.tar.gz" }
oauthgeneric = { version = "2025-10-02", url = "https://github.com/cosmocode/dokuwiki-plugin-oauthgeneric/archive/refs/tags/${version}.tar.gz" }
smtp = { version = "2025-08-27", url = "https://github.com/splitbrain/dokuwiki-plugin-smtp/archive/refs/tags/${version}.tar.gz" }

[build]
packages = ["php8.3", "apache2", "libapache2-mod-php8.3", "php8.3-xml", "php8.3-mbstring", "php8.3-gd", "php8.3-intl", "rsync"]

[run]
start = "/app/scripts/start.sh"
packages = ["php8.3", "apache2", "libapache2-mod-php8.3", "php8.3-xml", "php8.3-mbstring", "php8.3-gd", "php8.3-intl"]

[port]
web = 8000

[healthcheck]
path = "/"
timeout = 30

[php]
memory_limit = "64M"
upload_max_filesize = "64M"
post_max_size = "64M"
session_save_path = "/run/dokuwiki/sessions"
session_gc_probability = 1
session_gc_divisor = 100

[integration]
sso = true
sendmail = true

[storage]
local = true
