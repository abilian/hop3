[program:dnsmasq]
user=root
; ignore the container /etc/hosts . it contains internal IP of dashboard
command=/usr/sbin/dnsmasq --keep-in-foreground --no-hosts --hostsdir=/run/dnsmasq/hosts --user=%(ENV_VPN_USER)s --conf-file=/app/data/dnsmasq.conf
autostart=false
autorestart=true
; https://veithen.github.io/2015/01/08/supervisord-redirecting-stdout.html
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
