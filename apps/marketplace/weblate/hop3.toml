# Weblate - Web-based Continuous Localization

[metadata]
id = "weblate"
version = "1.34.2"
upstream_version = "5.14.3"
title = "Weblate"
author = "Weblate developers"
description = "Weblate is a libre web-based translation tool with tight version control integration. It provides two user interfaces, propagation of translations across components, quality checks and automatic linking to source files."
website = "https://weblate.org"
license = "GPL-3.0"
tags = ["translation", "localization", "transifex", "i18n", "l10n"]

[source]
type = "pypi"
package = "Weblate"
version = "${upstream_version}"

[source.python]
version = "3.12"

[build]
packages = ["python3", "python3-venv", "nginx", "git"]
before-build = [
    "python3 -m venv /app/code/venv",
    "/app/code/venv/bin/pip install Weblate==${upstream_version} gunicorn",
]

[run]
start = "/app/scripts/start.sh"
packages = ["python3", "nginx", "supervisor", "git"]

[port]
web = 8000

[healthcheck]
path = "/healthz/"
timeout = 30

[resources]
memory = "3584M"

[env]
DJANGO_SETTINGS_MODULE = "weblate.settings"

[[provider]]
name = "postgres"

[[provider]]
name = "redis"

[integration]
sendmail = true
sso = "optional"

[integration.oidc]
enabled = true
redirect_uri = "/accounts/complete/oidc/"

[storage]
local = true

[processes]
web = "/app/code/venv/bin/gunicorn weblate.wsgi --workers 4 --bind 127.0.0.1:8080"
celery_main = "/app/code/venv/bin/celery -A weblate.utils worker -l INFO -n main@%%h"
celery_notify = "/app/code/venv/bin/celery -A weblate.utils worker -l INFO -n notify@%%h -Q notify"
celery_translate = "/app/code/venv/bin/celery -A weblate.utils worker -l INFO -n translate@%%h -Q translate"
celery_backup = "/app/code/venv/bin/celery -A weblate.utils worker -l INFO -n backup@%%h -Q backup"
celery_memory = "/app/code/venv/bin/celery -A weblate.utils worker -l INFO -n memory@%%h -Q memory"
celery_beat = "/app/code/venv/bin/celery -A weblate.utils beat -l INFO"
