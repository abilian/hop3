# Hop3 Configuration for Ghost (Native build)
# Professional publishing platform

[metadata]
id = "ghost"
version = "5.74.5"
title = "Ghost"
description = "Professional publishing platform"
homepage = "https://ghost.org/"
license = "MIT"
categories = ["cms", "blog", "publishing"]

[build]
# Force local builder with node toolchain
builder = "local"
toolchain = "node"

# Install Ghost using ghost-cli
before-build = "bash scripts/download.sh"

# ghost-cli handles dependency installation, just verify
build = "echo 'Ghost installed via ghost-cli'"

[run]
# Setup config and run Ghost
# Note: before-run must be part of start command for proper env var access
start = "bash scripts/setup-config.sh && node current/index.js"

[[addons]]
type = "mysql"

[env]
NODE_ENV = "production"

[healthcheck]
path = "/ghost/api/v4/admin/site/"
