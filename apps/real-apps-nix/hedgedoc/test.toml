# Test definition for HedgeDoc built with Nix

[test]
name = "nix-hedgedoc"
category = "nix-app"
tier = "heavy"
priority = "P2"
description = "HedgeDoc collaborative markdown editor deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "hedgedoc", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/status"
[validations.expect]
status = 200
