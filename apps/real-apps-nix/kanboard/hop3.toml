# Hop3 Configuration for Kanboard (Nix build)
# Kanban project management software

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
DEBUG = "false"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "kanboard", "nix", "project-management"]

[[test.validations]]
path = "/"
status = 302
# `/` 302s to the login page (title "Login"); "Kanboard" only shows once
# authenticated. Match the login form's own controller instead.
contains = "AuthController"

# Kanboard ships a built-in `admin` account with the password `admin`. The
# wrapper resets it to the generated one; without that the published default is
# the way in and the operator's credential does not work.
[admin]
username = "admin"
password = { generate = "password", length = 20 }
