# Test definition for Kanboard built with Nix

[test]
name = "nix-kanboard"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Kanboard project management built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "kanboard", "nix", "project-management"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 302
