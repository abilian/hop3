[test]
name = "nix-keycloak"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "Keycloak SSO / OIDC server — nix hand-crafted with writable-home wrapper"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["java", "jvm", "nix", "postgres", "sso"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/realms/master"
[validations.expect]
status = 200
contains = "master"
