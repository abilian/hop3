# hop3.toml - Hop3 configuration for Nix-based Keycloak (hand-crafted)
# Enterprise SSO / OIDC / SAML identity provider

[metadata]
id = "keycloak"
description = "Enterprise SSO / OIDC / SAML identity and access management"

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
# First deploy: ~200MB copy of the nixpkgs keycloak tree into $PWD
# happens once in the wrapper (one-shot, cached across redeploys),
# then kc.sh runs its implicit build + schema migrations. Cold runs
# can take 3-4 min. Subsequent starts are much faster.
start-timeout = 420

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "jvm", "nix", "postgres", "sso"]

[[test.validations]]
path = "/realms/master"
status = 200
contains = "master"

# Keycloak reads KC_BOOTSTRAP_ADMIN_* at first start to create the temporary
# administrator, so the mapping IS the bootstrap — there is no post-deploy
# `create` command to run.
[admin]
username = "admin"
password = { generate = "password", length = 20 }

[env.computed]
KC_BOOTSTRAP_ADMIN_USERNAME = "${HOP3_ADMIN_USER}"
KC_BOOTSTRAP_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"
