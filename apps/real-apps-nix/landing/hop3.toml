# Hop3 Configuration for the Hop3 landing page (Nix static-site reference)

[metadata]
id = "hop3-landing"
version = "0.1.0"
title = "Hop3 Landing"
description = "Reference real-apps-nix static site (multi-page HTML + CSS)"
homepage = "https://hop3.cloud/"
license = "Apache-2.0"
categories = ["static", "demo"]

[build]
builder = "nix"

[test]
priority = "P1"
tier = "fast"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["static", "nix", "nginx"]

[[test.validations]]
path = "/"
status = 200
contains = "Welcome to Hop3"

[[test.validations]]
path = "/about.html"
status = 200
contains = "About this page"

[[test.validations]]
path = "/style.css"
status = 200
contains = "font-family"
