[test]
name = "nix-landing"
category = "nix-app"
tier = "fast"
priority = "P1"
description = "Multi-page static site deployed via Nix (static worker)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["static", "nix", "nginx"]

[deployment]
path = "."
type = "nix"

# Verify the index page renders and contains expected content.
[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "Welcome to Hop3"

# Verify a second HTML page is reachable (catches static-path-mapping
# regressions where only the index is served).
[[validations]]
type = "http"
path = "/about.html"
[validations.expect]
status = 200
contains = "About this page"

# Verify the CSS is served (catches MIME or path-prefix bugs).
[[validations]]
type = "http"
path = "/style.css"
[validations.expect]
status = 200
contains = "font-family"
