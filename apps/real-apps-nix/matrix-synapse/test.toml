# Test definition for Matrix Synapse built with Nix

[test]
name = "nix-matrix-synapse"
category = "nix-app"
tier = "heavy"
priority = "P2"
description = "Matrix Synapse homeserver deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["python", "matrix-synapse", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/_matrix/client/versions"
[validations.expect]
status = 200
