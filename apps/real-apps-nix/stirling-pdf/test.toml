[test]
name = "nix-stirling-pdf-handcrafted"
category = "nix-app"
tier = "slow"
priority = "P1"
description = "Stirling-PDF deployed via Nix (hand-crafted)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["java", "spring-boot", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/login"
[validations.expect]
status = 200
