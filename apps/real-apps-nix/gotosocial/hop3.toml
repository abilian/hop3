# hop3.toml - Hop3 configuration for Nix-based GoToSocial

[build]
builder = "nix"

[run]
start-timeout = 60

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "sqlite", "fediverse"]

[[test.validations]]
path = "/api/v1/instance"
status = 200
