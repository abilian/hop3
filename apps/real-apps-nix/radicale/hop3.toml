# Hop3 Configuration for Radicale (Nix build)
# Simple CalDAV and CardDAV server

[build]
builder = "nix"

[env]
RADICALE_AUTH_TYPE = "none"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "radicale", "nix"]

[[test.validations]]
path = "/.web/"
status = 200
contains = "Radicale"
