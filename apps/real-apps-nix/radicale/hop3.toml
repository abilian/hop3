# Hop3 Configuration for Radicale (Nix build)
# Simple CalDAV and CardDAV server

[build]
builder = "nix"

# No `[env] RADICALE_AUTH_TYPE`: it defaulted the wrapper's `[auth] type` to
# `none` and nothing ever set it otherwise. Authentication is now spelled out in
# the derivation, where no environment can switch it off.

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "radicale", "nix"]

[[test.validations]]
path = "/.web/"
status = 200
contains = "Radicale"

# Accounts, from the variant that already carries them. Radicale reads an
# htpasswd file and ships no user CLI, so `python3 -c` writing a bcrypt line
# is the account-creation mechanism — and it is layout-independent, which is
# why it transfers between the two Nix packagings unchanged. The derivation
# puts a python3 carrying bcrypt on PATH for it.
[probe]
username = "hop3probe"
# Radicale reads accounts from an htpasswd file and ships no user CLI, so an
# account IS a line in that file. Written create-if-absent, and verified.
create = '''
python3 -c "
import bcrypt, os, pathlib, sys
user, password = sys.argv[1], sys.argv[2]
path = pathlib.Path('users')
existing = path.read_text().splitlines() if path.exists() else []
lines = [l for l in existing if not l.startswith(user + ':')]
lines.append(user + ':' + bcrypt.hashpw(password.encode(), bcrypt.gensalt()).decode())
path.write_text('\\n'.join(lines) + '\\n')
" "$HOP3_PROBE_USER" "$HOP3_PROBE_PASSWORD"
grep -q "^$HOP3_PROBE_USER:" users || {
  echo "Radicale probe entry missing from the htpasswd file" >&2
  exit 1
}
'''

[admin]
username = "admin"
password = { generate = "password", length = 20 }
# The admin's htpasswd entry. Without it the server has no accounts at all, and
# with `type = none` above that meant open access rather than a locked door.
create = '''
python3 -c "
import bcrypt, os, pathlib, sys
user, password = sys.argv[1], sys.argv[2]
path = pathlib.Path('users')
existing = path.read_text().splitlines() if path.exists() else []
lines = [l for l in existing if not l.startswith(user + ':')]
lines.append(user + ':' + bcrypt.hashpw(password.encode(), bcrypt.gensalt()).decode())
path.write_text('\\n'.join(lines) + '\\n')
" "$HOP3_ADMIN_USER" "$HOP3_ADMIN_PASSWORD"
grep -q "^$HOP3_ADMIN_USER:" users || {
  echo "Radicale admin entry missing from the htpasswd file" >&2
  exit 1
}
'''
