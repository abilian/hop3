# hop3.toml - Hop3 configuration for Nix-based Vikunja
# Open source task and project management

[build]
builder = "nix"

[[addons]]
type = "postgres"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/api/v1/info"
status = 200

[[test.validations]]
path = "/"
status = 200
contains = "Vikunja"
