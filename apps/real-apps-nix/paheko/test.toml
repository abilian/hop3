[test]
name = "nix-paheko-handcrafted"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Paheko via Nix (hand-crafted)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "nix", "sqlite", "nonprofit"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/admin/install.php"
[validations.expect]
status = 200
