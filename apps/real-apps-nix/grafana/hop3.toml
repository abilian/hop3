# hop3.toml - Hop3 configuration for Nix-based Grafana
# The open observability platform — uses PostgreSQL for production durability

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
start-timeout = 120

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix"]

[[test.validations]]
path = "/api/health"
status = 200
