# Hop3 Configuration for BookStack (Nix build)
# Documentation/wiki platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
APP_KEY = "base64:dPZQ5oi9mW7WTt9/Dhl2ilhh5ZJRGu2l3wv5HZ/fKN8="
APP_ENV = "production"
APP_DEBUG = "false"

[env.computed]
DB_CONNECTION = "mysql"
DB_HOST = "${MYSQL_HOST}"
DB_PORT = "${MYSQL_PORT}"
DB_DATABASE = "${MYSQL_DATABASE}"
DB_USERNAME = "${MYSQL_USER}"
DB_PASSWORD = "${MYSQL_PASSWORD}"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "bookstack", "nix", "wiki", "laravel"]

[[test.validations]]
path = "/login"
status = 200
contains = "BookStack"
