[test]
name = "nix-bugsink-handcrafted"
category = "nix-app"
tier = "slow"
priority = "P1"
description = "Bugsink via Nix (hand-crafted, __noChroot pip install)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["python", "django", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/accounts/login/"
[validations.expect]
status = 200
