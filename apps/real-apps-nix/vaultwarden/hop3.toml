# hop3.toml - Hop3 configuration for Vaultwarden
# Bitwarden-compatible password manager (Rust single binary via nixpkgs)

[metadata]
id = "vaultwarden"
description = "Bitwarden-compatible password manager"

[build]
builder = "nix"

[run]
start-timeout = 60

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["rust", "nix", "sqlite"]

[[test.validations]]
path = "/alive"
status = 200

[[test.validations]]
path = "/"
status = 200
contains = "Vaultwarden"
