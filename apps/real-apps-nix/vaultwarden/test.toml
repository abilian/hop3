[test]
name = "nix-vaultwarden"
category = "nix-app"
tier = "medium"
priority = "P1"
description = "Vaultwarden password manager deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["rust", "nix", "sqlite"]

[deployment]
path = "."
type = "nix"

# /alive is Vaultwarden's liveness endpoint — returns 200 with a
# timestamp. Safer than "/" which redirects into the web-vault.
[[validations]]
type = "http"
path = "/alive"
[validations.expect]
status = 200
