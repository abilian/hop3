# Hop3 Configuration for Dolibarr (Nix build)
# Open source ERP and CRM

[build]
builder = "nix"

[[addons]]
type = "postgres"

[env]
DOLI_ADMIN_LOGIN = "admin"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "dolibarr", "nix", "erp", "crm"]

[[test.validations]]
path = "/"
status = 200
contains = "Dolibarr"

# Dolibarr's install steps take the super-admin on their command line, so the
# mapping IS the bootstrap.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
