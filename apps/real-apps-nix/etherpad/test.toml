# Test definition for Etherpad built with Nix

[test]
name = "nix-etherpad"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "Etherpad collaborative editor deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "etherpad", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
