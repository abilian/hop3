# hop3.toml - Hop3 configuration for Nix-based Gitea
# Self-hosted Git service

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
start-timeout = 120

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/"
status = 200
