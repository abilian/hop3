# Hop3 Configuration for Matomo (Nix build)
# Web analytics platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
# Matomo signs sessions and cookies with `salt`; generated once so a redeploy
# does not sign every visitor out.
MATOMO_SALT = { generate = "urlsafe" }
MATOMO_DATABASE_HOST = "${MYSQL_HOST}"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "matomo", "nix", "analytics"]

[[test.validations]]
path = "/"
status = 200
contains = "Matomo"

[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
