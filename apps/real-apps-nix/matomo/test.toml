# Test definition for Matomo built with Nix

[test]
name = "nix-matomo"
category = "nix-app"
tier = "medium"
priority = "P2"  # Known: hand-crafted hop3.nix lacks runtime config. Use real-apps-nix-gen/ instead.
description = "Matomo web analytics platform built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "matomo", "nix", "analytics"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
