# Test definition for Isso built with Nix

[test]
name = "nix-isso"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Isso lightweight commenting system deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["python", "isso", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
