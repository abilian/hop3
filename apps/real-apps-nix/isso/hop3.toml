# Hop3 Configuration for Isso (Nix build)
# Lightweight commenting system

[build]
builder = "nix"

# No `ISSO_HOST`: it pinned the address isso hands the browser to
# `http://localhost:8080` and nothing overrode it. The wrapper now takes it from
# HOP3_PUBLIC_URL, which Hop3 injects once the hostname is settled.

# Isso authenticates the moderation dashboard on a password ALONE — there is no
# account to name. Without it the dashboard is served disabled, which the smoke
# test reported as "not asking for a password"; the wrapper now refuses to start
# rather than serve it open.
[admin]
username = "admin"
password = { generate = "password", length = 20 }

[env.computed]
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "isso", "nix"]

[[test.validations]]
path = "/"
status = 400
contains = "missing uri query"
