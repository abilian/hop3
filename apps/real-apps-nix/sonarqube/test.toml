# Test definition for SonarQube built with Nix

[test]
name = "nix-sonarqube"
category = "nix-app"
tier = "heavy"
priority = "P2"
description = "SonarQube code quality platform deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["java", "sonarqube", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/api/system/status"
[validations.expect]
status = 200
