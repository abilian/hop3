# Test definition for WordPress built with Nix

[test]
name = "nix-wordpress"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "WordPress CMS built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "wordpress", "nix", "cms"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
