# hop3.toml - Hop3 configuration for Nix-based Miniflux
# Minimalist RSS reader

[build]
builder = "nix"

[[addons]]
type = "postgres"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/healthcheck"
status = 200
