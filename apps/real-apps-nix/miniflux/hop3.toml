# hop3.toml - Hop3 configuration for Nix-based Miniflux
# Minimalist RSS reader

[build]
builder = "nix"

[[addons]]
type = "postgres"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/healthcheck"
status = 200
contains = "OK"

# Miniflux creates its administrator at first start from CREATE_ADMIN +
# ADMIN_USERNAME/ADMIN_PASSWORD, so there is no post-deploy `create` command —
# the mapping IS the bootstrap. Without it the derivation used to fall back to
# a literal `changeme`.
[admin]
username = "admin"
password = { generate = "password", length = 20 }

[env.computed]
ADMIN_USERNAME = "${HOP3_ADMIN_USER}"
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"
