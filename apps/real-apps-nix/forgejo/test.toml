[test]
name = "nix-forgejo-handcrafted"
category = "nix-app"
tier = "slow"
priority = "P1"
description = "Forgejo Git service deployed via Nix (hand-crafted)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/api/healthz"
[validations.expect]
status = 200
