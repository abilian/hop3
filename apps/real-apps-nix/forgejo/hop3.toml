# hop3.toml - Hop3 configuration for Nix-based Forgejo
# Self-hosted Git service — community fork of Gitea

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
start-timeout = 180

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/api/healthz"
status = 200
