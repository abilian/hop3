# Hand-crafted hop3.nix (not nix-gen). Reason: the nix-gen templates
# don't yet have a `node-pnpm-install` variant, and Directus needs
# pnpm at build time — npm's flat node_modules can't resolve named
# ESM imports from @sinclair/typebox and similar CommonJS modules
# the way Directus's prebuilt code expects. See
# local-notes/stacks-and-apps/DEFERRED-APPS.md platform gap #4.

[metadata]
id = "directus"
description = "Open-source headless CMS"

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
# `directus bootstrap` runs the full migration set on first deploy
# (hundreds of migrations) before `directus start` begins serving;
# 300s is a safe budget for the combined bootstrap + start path.
start-timeout = 300

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "nix", "postgres", "headless-cms"]

[[test.validations]]
path = "/admin/login"
status = 200
