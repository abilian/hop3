[test]
name = "nix-rack-hello"
category = "nix-app"
tier = "medium"
priority = "P1"
description = "Ruby Rack app deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["ruby", "rack", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
