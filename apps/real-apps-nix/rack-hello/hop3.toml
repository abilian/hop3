# hop3.toml - Hop3 configuration for Nix-based Rack app

[build]
builder = "nix"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["ruby", "rack", "nix"]

[[test.validations]]
path = "/"
status = 200
contains = "Hello World, from Rack via Nix!"

[healthcheck]
contains = "Hello World, from Rack via Nix!"
