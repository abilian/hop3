[test]
name = "nix-writefreely-handcrafted"
category = "nix-app"
tier = "medium"
priority = "P1"
description = "WriteFreely deployed via Nix (hand-crafted)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix", "sqlite", "fediverse"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
