[build]
builder = "nix"

[run]
start-timeout = 120

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "sqlite", "fediverse"]

[[test.validations]]
path = "/"
status = 200
contains = "WriteFreely"

[healthcheck]
contains = "WriteFreely"
