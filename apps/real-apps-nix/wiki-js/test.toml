# Test definition for Wiki.js built with Nix

[test]
name = "nix-wiki-js"
category = "nix-app"
tier = "heavy"
priority = "P2"
description = "Wiki.js wiki platform deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "wiki-js", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/healthz"
[validations.expect]
status = 200
