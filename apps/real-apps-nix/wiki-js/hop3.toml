# Hop3 Configuration for Wiki.js (Nix build)
# Modern wiki platform

[build]
builder = "nix"

[[addons]]
type = "postgres"

[env]
NODE_ENV = "production"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "wiki-js", "nix", "postgres"]

[[test.validations]]
path = "/healthz"
status = 200
contains = '{"ok":true}'
