# Hop3 Configuration for Wiki.js (Nix build)
# Modern wiki platform

[build]
builder = "nix"

[[addons]]
type = "postgres"

[env]
NODE_ENV = "production"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "wiki-js", "nix", "postgres"]

[[test.validations]]
path = "/"
status = 200
# Fresh wiki-js serves its setup wizard on every route; match the app name.
contains = "Wiki.js"

[healthcheck]
contains = "Wiki.js"
