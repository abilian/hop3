# Test definition for SearXNG built with Nix

[test]
name = "nix-searxng"
category = "nix-app"
tier = "heavy"
priority = "P2"
description = "SearXNG privacy metasearch engine deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["python", "searxng", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/healthz"
[validations.expect]
status = 200
