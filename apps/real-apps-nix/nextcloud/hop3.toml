# Hop3 Configuration for Nextcloud (Nix build)
# File hosting and collaboration platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
NEXTCLOUD_ADMIN_USER = "admin"
NEXTCLOUD_ADMIN_PASSWORD = "changeme"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "nextcloud", "nix", "file-sharing", "collaboration"]

[[test.validations]]
path = "/status.php"
status = 200
