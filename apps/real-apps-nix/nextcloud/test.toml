# Test definition for Nextcloud built with Nix

[test]
name = "nix-nextcloud"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Nextcloud file hosting platform built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "nextcloud", "nix", "file-sharing", "collaboration"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/status.php"
[validations.expect]
status = 200
