# hop3.toml — Redmine (Ruby on Rails, source-built via bundlerEnv; hand-crafted nix)
#
# First real Ruby app in the corpus. The gem set is built by bundlerEnv from a
# bundix-generated gemset.nix — source gems only (force_ruby_platform: no
# precompiled binaries, per the NGI rule), native extensions (nokogiri/pg)
# compiled in the sandbox. The Rails runtime lazy-copies into a writable home
# (blocker #12), generates config/database.yml from PG*, and runs db:migrate on
# first boot before `rails server`.

[metadata]
id = "redmine"
version = "5.1.10"
description = "Flexible project management web application (Ruby on Rails)"

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
# First boot runs the full schema migration before serving.
start-timeout = 300

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["ruby", "rails", "nix", "postgres"]

[[test.validations]]
path = "/login"
status = 200
contains = "Redmine"
