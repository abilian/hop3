[build]
builder = "nix"

[run]
start-timeout = 120

[[ports]]
number = 1935
protocol = "tcp"
name = "rtmp"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "sqlite", "streaming"]

[[test.validations]]
path = "/api/status"
status = 200
contains = "versionNumber"
