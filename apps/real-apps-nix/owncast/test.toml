[test]
name = "nix-owncast-handcrafted"
category = "nix-app"
tier = "medium"
priority = "P1"
description = "Owncast livestream server via Nix (hand-crafted)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix", "sqlite", "streaming"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/api/status"
[validations.expect]
status = 200
