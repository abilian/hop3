# Hop3 Configuration for Vikunja (Native build)
# Open source task/project management

[metadata]
id = "vikunja"
version = "0.x"
title = "Vikunja"
description = "Open source task and project management"
homepage = "https://vikunja.io/"
license = "AGPL-3.0"
categories = ["project-management", "task-management", "kanban"]

[build]
builder = "local"
toolchain = "generic"

# Download pre-built binary
before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
start = "./vikunja"

[[addons]]
type = "postgres"

[env]
VIKUNJA_FRONTEND_URL = "http://localhost:8080/"

[healthcheck]
path = "/api/v1/info"
