# Test definition for Rack app with Puma

[test]
name = "030-rack"
category = "deployment"
tier = "fast"
priority = "P0"
description = "Basic Rack application with Puma server"

[test.requirements]
targets = ["docker", "remote"]
services = []

[test.metadata]
author = "hop3-team"
covers = ["ruby", "rack", "puma"]

[deployment]
path = "."
type = "ruby"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "Hello world!"
