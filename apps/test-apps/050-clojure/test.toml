# Test definition for Clojure app with Leiningen

[test]
name = "050-clojure"
category = "deployment"
tier = "medium"
priority = "P1"
description = "Clojure web app with Leiningen uberjar"

[test.requirements]
targets = ["docker", "remote"]
services = []

[test.metadata]
author = "hop3-team"
covers = ["clojure", "leiningen", "java"]

[deployment]
path = "."
type = "clojure"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "Hello world!"
