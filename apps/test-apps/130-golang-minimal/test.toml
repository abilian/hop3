# Test definition for minimal Go app

[test]
name = "130-golang-minimal"
category = "deployment"
tier = "medium"
priority = "P0"
description = "Minimal Go application without framework"

[test.requirements]
targets = ["docker", "remote"]
services = []

[test.metadata]
author = "hop3-team"
covers = ["golang", "minimal"]

[deployment]
path = "."
type = "golang"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
