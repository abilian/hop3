# Hop3 Configuration for Formbricks (Docker-based)
# Open source survey and experience management

[metadata]
id = "formbricks"
version = "2.0"
title = "Formbricks"
description = "Open source survey and experience management platform"
homepage = "https://formbricks.com/"
license = "AGPL-3.0"
categories = ["forms", "surveys", "feedback", "analytics"]

[[addons]]
type = "postgres"

[env]
NEXTAUTH_SECRET = "change-me-to-a-random-string"
ENCRYPTION_KEY = "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
CRON_SECRET = "change-me-to-a-cron-secret"

[healthcheck]
path = "/health"

[test]
priority = "P1"
tier = "slow"

[[test.validations]]
path = "/health"
status = 200
