# Hop3 Configuration for Forgejo (Docker-based)

[metadata]
id = "forgejo"
version = "14.0.3"
title = "Forgejo"
description = "Self-hosted Git service (community fork of Gitea)"
homepage = "https://forgejo.org/"
license = "GPL-3.0-or-later"
categories = ["git", "devops", "collaboration"]

[[addons]]
type = "postgres"

[env]
GITEA__log__LEVEL = "Info"

[healthcheck]
path = "/api/healthz"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/api/healthz"
status = 200
contains = "status"
