# Hop3 Configuration for LimeSurvey (Docker-based)
# Professional online survey tool

[metadata]
id = "limesurvey"
version = "6.4"
title = "LimeSurvey"
description = "Professional online survey and data collection tool"
homepage = "https://www.limesurvey.org/"
license = "GPL-2.0"
categories = ["surveys", "forms", "research", "data-collection"]

[[addons]]
type = "postgres"

[env]
ADMIN_USER = "admin"
ADMIN_NAME = "Administrator"
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = "change-me-admin-password"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/"
status = 200
