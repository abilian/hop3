# Hop3 Configuration for Discourse (Docker-based)
# Open source discussion platform

[metadata]
id = "discourse"
version = "2026.x"
title = "Discourse"
description = "Open source discussion platform"
homepage = "https://www.discourse.org/"
license = "GPL-2.0"
categories = ["forum", "discussion", "community"]

[[addons]]
type = "postgres"

[[addons]]
type = "redis"

[env]
DISCOURSE_HOSTNAME = "localhost"

[run]
# First boot does a lot before it can answer: `rake db:migrate` against an empty
# database (Discourse ships hundreds of migrations), Rails boot, and then the CSS
# compile that the build deliberately defers (DONT_PRECOMPILE_CSS=1 — see the
# Dockerfile). The 60s default is nowhere near enough; this is slow, not broken.
start-timeout = 600

[healthcheck]
path = "/"
contains = "Discourse"
