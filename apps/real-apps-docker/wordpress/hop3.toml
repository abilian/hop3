# Hop3 Configuration for WordPress (Docker-based)
# Dockerfile handles build and runtime; hop3.toml defines metadata and dependencies

[metadata]
id = "wordpress"
version = "6.4"
title = "WordPress"
description = "The world's most popular content management system"
homepage = "https://wordpress.org/"
license = "GPL-2.0-or-later"
categories = ["cms", "blog", "website"]

# Database addon - automatically provisioned by hop3 deploy
[[addons]]
type = "mysql"

# Environment variables injected at deploy time
[env]
WP_DEBUG = "false"
WP_DEBUG_LOG = "false"

[healthcheck]
path = "/wp-admin/install.php"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/wp-admin/install.php"
status = 200
