# Hop3 Configuration for Grafana (Docker-based)
# The open observability platform

[metadata]
id = "grafana"
version = "11.0"
title = "Grafana"
description = "The open and composable observability and data visualization platform"
homepage = "https://grafana.com/"
license = "AGPL-3.0"
categories = ["monitoring", "visualization", "observability", "devops"]

# Production-grade: use PostgreSQL for durability and concurrent access.
# (SQLite default is OK for trial/dev, not for production.)

[[addons]]
type = "postgres"

[env]
GF_SERVER_HTTP_PORT = "8080"
GF_SECURITY_ADMIN_USER = "admin"
GF_DATABASE_TYPE = "postgres"
GF_DATABASE_SSL_MODE = "disable"

# Computed vars are resolved against the addon-injected PG* variables
# at deploy time. Using [env] here would store the literal template
# string and grafana would try to connect to "${PGHOST}:${PGPORT}".
[env.computed]
GF_DATABASE_HOST = "${PGHOST}:${PGPORT}"
GF_DATABASE_NAME = "${PGDATABASE}"
GF_DATABASE_USER = "${PGUSER}"
GF_DATABASE_PASSWORD = "${PGPASSWORD}"

[healthcheck]
path = "/api/health"

[test]
priority = "P0"
tier = "medium"

[[test.validations]]
path = "/api/health"
status = 200
