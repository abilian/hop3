# Hop3 Configuration for OpenCloud (Docker-based)
# Self-hosted file sync and sharing platform (Nextcloud alternative)

[metadata]
id = "opencloud"
version = "4.0.0"
title = "OpenCloud"
description = "Self-hosted file sync and sharing platform, a modern Nextcloud/ownCloud alternative"
homepage = "https://opencloud.eu/"
license = "Apache-2.0"
categories = ["file-sharing", "storage", "collaboration"]

[build]
builder = "docker"

[env]
# Default admin password (change this!)
ADMIN_PASSWORD = "admin"

[docker]
# OpenCloud listens on port 9200 by default
port = 9200
runtime = "docker-compose"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "slow"
targets = ["docker"]
covers = ["docker", "opencloud"]

[[test.validations]]
path = "/"
status = 200
contains = "OpenCloud"
