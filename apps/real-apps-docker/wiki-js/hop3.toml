# Hop3 Configuration for Wiki.js (Docker-based)
# Modern and powerful wiki software

[metadata]
id = "wiki-js"
version = "2.x"
title = "Wiki.js"
description = "The most powerful and extensible open source Wiki software"
homepage = "https://js.wiki/"
license = "AGPL-3.0"
categories = ["wiki", "documentation", "knowledge-base"]

[[addons]]
type = "postgres"

[env]
WIKI_ADMIN_EMAIL = "admin@example.com"

[healthcheck]
path = "/healthz"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/healthz"
status = 200
