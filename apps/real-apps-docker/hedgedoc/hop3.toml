# Hop3 Configuration for HedgeDoc (Docker-based)
# Dockerfile handles build and runtime; hop3.toml defines metadata and dependencies

[metadata]
id = "hedgedoc"
version = "1.9"
title = "HedgeDoc"
description = "Real-time collaborative markdown notes"
homepage = "https://hedgedoc.org/"
license = "AGPL-3.0"
categories = ["collaboration", "notes", "markdown"]

# Database addon - automatically provisioned by hop3 deploy
[[addons]]
type = "postgres"

# Environment variables injected at deploy time
[env]
CMD_ALLOW_ANONYMOUS = "false"
CMD_ALLOW_FREEURL = "false"

[healthcheck]
path = "/status"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/status"
status = 200
