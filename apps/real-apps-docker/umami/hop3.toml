# Hop3 Configuration for Umami (Docker-based)
# Simple, fast, privacy-focused web analytics

[metadata]
id = "umami"
version = "2.x"
title = "Umami"
description = "Simple, fast, privacy-focused web analytics"
homepage = "https://umami.is/"
license = "MIT"
categories = ["analytics", "privacy", "web"]

[[addons]]
type = "postgres"

[env]
DISABLE_TELEMETRY = "1"

[healthcheck]
contains = "{}"
path = "/api/heartbeat"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/api/heartbeat"
status = 200
# umami v2.10.1's heartbeat returns an empty JSON object `{}` (200) as its
# liveness signal — not the `{"ok":true}` older versions emitted. Assert the
# observed response (a proxy 502 / error page would be HTML, not `{}`).
contains = "{}"
