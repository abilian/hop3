[test]
name = "docker-keycloak"
category = "docker-app"
tier = "slow"
priority = "P2"
description = "Keycloak SSO / OIDC server — Dockerfile built from debian:bookworm-slim"

[test.requirements]
targets = ["docker", "remote"]
services = ["docker", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["docker", "java", "jvm", "postgres", "sso"]

[deployment]
path = "."
type = "docker"

# /realms/master is a public endpoint on every Keycloak instance and
# returns JSON containing the realm metadata. "master" is built in.
[[validations]]
type = "http"
path = "/realms/master"
[validations.expect]
status = 200
contains = "master"
