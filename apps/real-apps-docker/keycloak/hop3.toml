# Hop3 Configuration for Keycloak (Docker-based)
# Enterprise SSO / OIDC / SAML identity and access management

[metadata]
id = "keycloak"
version = "26.1.4"
title = "Keycloak"
description = "Enterprise SSO / OIDC / SAML identity and access management"
homepage = "https://www.keycloak.org/"
license = "Apache-2.0"
categories = ["auth", "sso", "identity"]

[build]
# Slow tier: Java 21 JRE download (Temurin) + Keycloak tarball extract
# adds up; plus the Docker build context is non-trivial.
tier = "slow"

[[addons]]
type = "postgres"

[healthcheck]
# /realms/master is a public JSON endpoint every Keycloak instance
# exposes; no auth required to confirm liveness.
path = "/realms/master"

[run]
# Keycloak start-dev on a cold JVM + cold Postgres does provider
# install, theme cache, and schema migrations before it binds HTTP;
# 2-4 minutes is normal on first boot.
start-timeout = 420
