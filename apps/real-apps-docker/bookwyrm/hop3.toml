# Hop3 Configuration for BookWyrm (Docker-based)

[metadata]
id = "bookwyrm"
version = "0.8.5"
title = "BookWyrm"
description = "Federated social reading, Goodreads alternative"
homepage = "https://joinbookwyrm.com/"
license = "AGPL-3.0"
categories = ["fediverse", "books", "social"]

[[addons]]
type = "postgres"
# bloom is non-trusted — requires superuser to install. Declaring
# it here has the addon provision it as superuser during addon
# setup, before the app's migrations run.
extensions = ["bloom"]

[[addons]]
type = "redis"

[healthcheck]
path = "/api/v1/instance"
