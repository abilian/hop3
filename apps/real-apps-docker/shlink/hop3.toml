# Hop3 Configuration for Shlink (Docker-based)
# Self-hosted URL shortener with analytics

[metadata]
id = "shlink"
version = "4.3.1"
title = "Shlink URL Shortener"
description = "Self-hosted URL shortener with a REST API and analytics"
homepage = "https://shlink.io/"
license = "MIT"
categories = ["url-shortener", "productivity", "analytics"]

[docker]
port = 8080

[healthcheck]
path = "/rest/health"

[test]
priority = "P1"
tier = "slow"
targets = ["docker"]
covers = ["docker", "shlink"]

# Shlink has no landing page at "/": it is a REST API + short-URL redirector.
# With no DEFAULT_DOMAIN redirect configured, "/" returns 404 ("Not Found | Shlink")
# by design. Validate the health endpoint instead, which proves the app is up.
[[test.validations]]
path = "/rest/health"
status = 200
contains = "pass"
