# Hop3 Configuration for Radicale (Docker-based)
# Simple CalDAV and CardDAV server

[metadata]
id = "radicale"
version = "3.2"
title = "Radicale"
description = "A simple CalDAV and CardDAV server"
homepage = "https://radicale.org/"
license = "GPL-3.0"
categories = ["calendar", "contacts", "caldav", "carddav"]

# Radicale uses file-based storage by default

[env]
RADICALE_AUTH_TYPE = "htpasswd"

[healthcheck]
path = "/.web/"

[test]
priority = "P0"
tier = "medium"

[[test.validations]]
path = "/.web/"
status = 200
contains = "Radicale"
