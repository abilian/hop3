# Hop3 Configuration for GoToSocial (Docker-based)

[metadata]
id = "gotosocial"
version = "0.21.2"
title = "GoToSocial"
description = "Lightweight ActivityPub-compatible microblog server"
homepage = "https://gotosocial.org/"
license = "AGPL-3.0"
categories = ["fediverse", "social", "activitypub"]

[env]
GTS_BIND_ADDRESS = "0.0.0.0"
GTS_DB_TYPE = "sqlite"
GTS_LETSENCRYPT_ENABLED = "false"

[healthcheck]
path = "/api/v1/instance"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/api/v1/instance"
status = 200
contains = "uri"
