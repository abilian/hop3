# Hop3 Configuration for Linkding (Docker-based)
# Self-hosted bookmark manager

[metadata]
id = "linkding"
version = "1.23.1"
title = "Linkding"
description = "Minimal, fast, self-hosted bookmark manager with tag-based organization"
homepage = "https://github.com/sissbruecker/linkding"
license = "MIT"
categories = ["bookmarks", "productivity", "self-hosted"]

[docker]
port = 9090

[[addons]]
type = "postgres"

[env]
LD_SUPERUSER_NAME = "admin"
LD_SUPERUSER_PASSWORD = "changeme123"

[healthcheck]
path = "/login/"

[test]
priority = "P1"
tier = "slow"
targets = ["docker"]
covers = ["docker", "linkding", "postgres"]

[[test.validations]]
path = "/login/"
status = 200
contains = "linkding"
