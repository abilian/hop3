# Hop3 Configuration for XWiki (Docker-based)
# Advanced enterprise wiki with structured data

[metadata]
id = "xwiki"
version = "16.1"
title = "XWiki"
description = "Advanced open source enterprise wiki with structured data support"
homepage = "https://www.xwiki.org/"
license = "LGPL-2.1"
categories = ["wiki", "knowledge-base", "collaboration", "enterprise"]

# XWiki requires PostgreSQL
[[addons]]
type = "postgres"

[env]
JAVA_OPTS = "-Xmx1024m"

[run]
# First boot is heavy: XWiki creates its full schema on an empty PostgreSQL and
# then imports the default wiki flavor before it can answer. That is several
# minutes of Java + DDL + XAR import — the 60s default is far too short.
start-timeout = 600

[healthcheck]
path = "/xwiki/bin/view/Main/"

[test]
priority = "P1"
tier = "slow"

[[test.validations]]
path = "/xwiki/bin/view/Main/"
status_in = [200, 202]
contains = "XWiki"
