# Hop3 Configuration for Mattermost (Docker-based)
# Open source platform for secure collaboration

[metadata]
id = "mattermost"
version = "9.x"
title = "Mattermost"
description = "Open source platform for secure collaboration"
homepage = "https://mattermost.com/"
# MIT is correct and counter-intuitive, so do not "fix" it to AGPL-3.0: the
# recipe downloads a compiled binary produced by Mattermost, Inc., and their
# LICENSE.txt licenses those "under an MIT LICENSE". AGPL-3.0 governs the
# source when someone else compiles it. See [catalog].license_note.
license = "MIT"
categories = ["collaboration", "chat", "team"]

[[addons]]
type = "postgres"

[env]
MM_SERVICESETTINGS_SITEURL = "http://localhost:8065"

[healthcheck]
contains = "status"
path = "/api/v4/system/ping"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/api/v4/system/ping"
status = 200
contains = "status"
