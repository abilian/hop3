# Hop3 Configuration for MediaWiki (Docker-based)

[metadata]
id = "mediawiki"
version = "1.41.2"
title = "MediaWiki"
description = "Free wiki platform — the software powering Wikipedia"
homepage = "https://www.mediawiki.org/"
license = "GPL-2.0-or-later"
categories = ["wiki", "knowledge-base", "collaboration"]

[build]
tier = "medium"

[[addons]]
type = "postgres"

[healthcheck]
path = "/api.php"
