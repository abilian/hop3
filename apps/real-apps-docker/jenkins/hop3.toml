# Hop3 Configuration for Jenkins (Docker-based)
# The leading open source automation server

[metadata]
id = "jenkins"
version = "2.440"
title = "Jenkins"
description = "The leading open source automation server for CI/CD"
homepage = "https://www.jenkins.io/"
license = "MIT"
categories = ["ci-cd", "devops", "automation"]

# Jenkins uses file-based storage by default, no database needed
# For scaling, users can configure external databases via plugins

[env]
JENKINS_OPTS = "--httpPort=8080"
JAVA_OPTS = "-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"

[healthcheck]
contains = "Jenkins"
path = "/login"

[test]
priority = "P0"
tier = "medium"

[[test.validations]]
path = "/login"
status = 200
contains = "Jenkins"
