# Hop3 Configuration for Kanboard (Docker-based)
# Kanban project management software

[metadata]
id = "kanboard"
version = "1.2"
title = "Kanboard"
description = "Kanban project management software"
homepage = "https://kanboard.org/"
license = "MIT"
categories = ["project-management", "kanban", "productivity"]

[[addons]]
type = "mysql"

[env]
DEBUG = "false"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/"
# Kanboard's `/` 302-redirects to the board/login (same as the native/nix
# variants); assert the redirect and let the framework follow it for `contains`.
status = 302
contains = "Kanboard"
