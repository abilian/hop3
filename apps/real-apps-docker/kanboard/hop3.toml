# Hop3 Configuration for Kanboard (Docker-based)
# Kanban project management software

[metadata]
id = "kanboard"
version = "1.2"
title = "Kanboard"
description = "Kanban project management software"
homepage = "https://kanboard.org/"
license = "MIT"
categories = ["project-management", "kanban", "productivity"]

[[addons]]
type = "mysql"

[env]
DEBUG = "false"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/"
# Kanboard's `/` 302-redirects to the login page (same across all variants);
# assert the redirect and let the framework follow it. The login page's <title>
# is "Login" — "Kanboard" only appears once authenticated — so match the login
# form's own controller, kanboard-specific proof it served its own page.
status = 302
contains = "AuthController"
