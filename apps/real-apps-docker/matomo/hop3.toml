# Hop3 Configuration for Matomo (Docker-based)
# Open source web analytics platform

[metadata]
id = "matomo"
version = "5.x"
title = "Matomo"
description = "Open source web analytics platform"
homepage = "https://matomo.org/"
license = "GPL-3.0"
categories = ["analytics", "web-analytics", "privacy"]

[[addons]]
type = "mysql"

[env]
APP_URL = "localhost"

[healthcheck]
contains = "Matomo"
path = "/"

[test]
priority = "P1"
tier = "medium"

[[test.validations]]
path = "/"
status = 200
contains = "Matomo"
