# Hop3 Configuration for Invoice Ninja (Docker-based)
# Open source invoicing platform

[metadata]
id = "invoice-ninja"
version = "5.x"
title = "Invoice Ninja"
description = "Open source invoicing platform"
homepage = "https://invoiceninja.com/"
license = "AAL"
categories = ["invoicing", "business", "crm"]

[[addons]]
type = "mysql"

[env]
APP_DEBUG = "false"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "slow"

[[test.validations]]
path = "/"
status = 302
