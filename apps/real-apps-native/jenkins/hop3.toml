# Hop3 Configuration for Jenkins (Native build)
# The leading open source automation server

[metadata]
id = "jenkins"
version = "2.440"
title = "Jenkins"
description = "The leading open source automation server for CI/CD"
homepage = "https://www.jenkins.io/"
license = "MIT"
categories = ["ci-cd", "devops", "automation"]

[build]
builder = "local"
toolchain = "generic"

before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
start = "java -jar jenkins.war --httpPort=${PORT:-8080}"

# Jenkins uses file-based storage by default

[env]
JENKINS_HOME = "./jenkins_home"
JAVA_OPTS = "-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"

[healthcheck]
contains = "Jenkins"
path = "/login"

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java"]

[[test.validations]]
path = "/login"
status = 200
contains = "Jenkins"
