# Hop3 Configuration for LimeSurvey (Native build)
# Professional online survey tool

[metadata]
id = "limesurvey"
version = "6.4"
title = "LimeSurvey"
description = "Professional online survey and data collection tool"
homepage = "https://www.limesurvey.org/"
license = "GPL-2.0"
categories = ["surveys", "forms", "research", "data-collection"]

[build]
builder = "local"
toolchain = "php"

before-build = "bash scripts/download.sh"
build = "composer install --no-dev --optimize-autoloader || true"

[run]
before-run = "bash scripts/setup-config.sh"
start = "php -S 0.0.0.0:${PORT:-8080}"

[[addons]]
type = "postgres"

[env]
ADMIN_NAME = "Administrator"

# Generated admin credentials (ADR-056). The platform generates the password
# once (stable across redeploys), stores it encrypted, and injects
# HOP3_ADMIN_USER / HOP3_ADMIN_EMAIL / HOP3_ADMIN_PASSWORD into the runtime env.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

# Map LimeSurvey's installer env vars to the injected admin credentials.
# Interpolated after HOP3_ADMIN_* is injected, so these reach setup-config.sh.
[env.computed]
ADMIN_USER = "${HOP3_ADMIN_USER}"
ADMIN_EMAIL = "${HOP3_ADMIN_EMAIL}"
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "postgresql"]

[[test.validations]]
path = "/"
status = 200
contains = "LimeSurvey"
