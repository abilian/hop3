[test]
name = "glitchtip"
category = "native-app"
tier = "slow"
priority = "P1"
description = "GlitchTip error tracking deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql", "redis"]

[test.metadata]
author = "hop3-team"
covers = ["python", "django", "postgres", "redis"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/_health/"
[validations.expect]
status = 200
