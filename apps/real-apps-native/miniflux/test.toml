[test]
name = "miniflux"
category = "native-app"
tier = "medium"
priority = "P1"
description = "Miniflux deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "postgresql"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/healthcheck"
[validations.expect]
status = 200
