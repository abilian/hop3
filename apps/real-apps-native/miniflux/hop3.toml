# Hop3 Configuration for Miniflux (Native build)
# Minimalist RSS reader

[metadata]
id = "miniflux"
version = "2.1.1"
title = "Miniflux"
description = "Minimalist and opinionated RSS reader"
homepage = "https://miniflux.app/"
license = "Apache-2.0"
categories = ["rss", "news", "feed-reader"]

[build]
# Force local builder (source code may include Dockerfile)
builder = "local"

# Download source code
before-build = "bash scripts/download.sh"

# Go toolchain will detect go.mod and build automatically
# The build command creates the binary
build = "make miniflux"

[run]
# Run the compiled binary
start = "./miniflux"

[[addons]]
type = "postgres"

# ADR-056: generate the admin password once (stable across redeploys), store it
# encrypted (retrieve via `hop3 app credentials`), and inject HOP3_ADMIN_USER/
# HOP3_ADMIN_PASSWORD into the app runtime. Miniflux admins are keyed by
# username only — no email field.
[admin]
username = "admin"
password = { generate = "password", length = 20 }

[env]
# Miniflux configuration. CREATE_ADMIN creates the admin from ADMIN_USERNAME/
# ADMIN_PASSWORD at startup, idempotently (miniflux skips creation when the
# user already exists), so it is safe across redeploys.
RUN_MIGRATIONS = "1"
CREATE_ADMIN = "1"

# Map the injected admin creds onto the env vars Miniflux reads at first start.
# Interpolated after the admin creds are injected, so no literal secret lives
# in [env].
[env.computed]
ADMIN_USERNAME = "${HOP3_ADMIN_USER}"
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[healthcheck]
contains = "OK"
path = "/healthcheck"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "postgresql"]

[[test.validations]]
path = "/healthcheck"
status = 200
contains = "OK"
