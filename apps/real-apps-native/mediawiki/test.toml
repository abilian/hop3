[test]
name = "mediawiki"
category = "native-app"
tier = "medium"
priority = "P2"
description = "MediaWiki deployed natively on PHP"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["php", "composer", "postgres", "wiki"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/api.php"
[validations.expect]
status = 200
