[test]
name = "matrix-synapse"
category = "native-app"
tier = "slow"
priority = "P2"
description = "Matrix Synapse homeserver"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["python", "matrix"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/_matrix/client/versions"
[validations.expect]
status = 200
