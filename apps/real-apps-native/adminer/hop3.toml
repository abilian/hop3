# Hop3 Configuration for Adminer (Native build)
# Single-file database management tool

[metadata]
id = "adminer"
version = "4.8.1"
title = "Adminer"
description = "Database management in a single PHP file"
homepage = "https://www.adminer.org/"
license = "Apache-2.0"
categories = ["database", "admin", "mysql", "postgres"]

[build]
# Force local builder for native PHP deployment
builder = "local"
toolchain = "php"

# Download single PHP file
before-build = "bash scripts/download.sh"

[run]
# Run with PHP built-in server
start = "php -S 0.0.0.0:${PORT:-8080}"
start-timeout = 180

[healthcheck]
contains = "Adminer"
path = "/"

[test]
priority = "P1"
tier = "fast"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php"]

[[test.validations]]
path = "/"
status = 200
contains = "Adminer"
