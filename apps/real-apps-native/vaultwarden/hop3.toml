# Hop3 Configuration for Vaultwarden (Native build)
# Bitwarden-compatible password manager

[metadata]
id = "vaultwarden"
version = "1.35.4"
title = "Vaultwarden"
description = "Bitwarden-compatible password manager (Rust)"
homepage = "https://github.com/dani-garcia/vaultwarden"
license = "AGPL-3.0"
categories = ["security", "password-manager"]

[build]
builder = "local"
before-build = "bash scripts/download.sh"
# Rust toolchain auto-detects Cargo.toml and runs `cargo build --release`.
# Explicit feature flags keep the DB matrix predictable.
build = "cargo build --release --features sqlite,postgresql"

[run]
start = "bash scripts/start.sh"
start-timeout = 120

[env]
ROCKET_ADDRESS = "0.0.0.0"
WEB_VAULT_ENABLED = "true"
SIGNUPS_ALLOWED = "false"

[healthcheck]
path = "/alive"

[test]
priority = "P1"
tier = "very-slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["rust", "sqlite"]

[[test.validations]]
path = "/alive"
status = 200

[[test.validations]]
path = "/"
status = 200
contains = "Vaultwarden"
