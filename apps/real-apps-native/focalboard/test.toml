[test]
name = "focalboard"
category = "native-app"
tier = "slow"
priority = "P1"
description = "Focalboard deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "postgresql"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/api/v2/health"
[validations.expect]
status = 200
