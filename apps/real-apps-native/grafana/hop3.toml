# Hop3 Configuration for Grafana (Native build)
# The open observability platform

[metadata]
id = "grafana"
version = "11.0"
title = "Grafana"
description = "The open and composable observability and data visualization platform"
homepage = "https://grafana.com/"
license = "AGPL-3.0"
categories = ["monitoring", "visualization", "observability", "devops"]

[build]
builder = "local"
toolchain = "generic"

# Download pre-built binary
before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
start = "./bin/grafana-server"

[[addons]]
type = "postgres"

[env]
GF_SERVER_HTTP_PORT = "${PORT:-8080}"
GF_SECURITY_ADMIN_USER = "admin"
GF_PATHS_DATA = "./data"
GF_PATHS_LOGS = "./logs"
GF_DATABASE_TYPE = "postgres"
GF_DATABASE_HOST = "${PGHOST}:${PGPORT}"
GF_DATABASE_NAME = "${PGDATABASE}"
GF_DATABASE_USER = "${PGUSER}"
GF_DATABASE_PASSWORD = "${PGPASSWORD}"
GF_DATABASE_SSL_MODE = "disable"

[healthcheck]
path = "/api/health"
