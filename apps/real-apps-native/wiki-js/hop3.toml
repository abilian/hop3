# Hop3 Configuration for Wiki.js (Native build)
# Modern wiki platform

[metadata]
id = "wiki-js"
version = "2.5.303"
title = "Wiki.js"
description = "Modern and powerful wiki platform"
homepage = "https://js.wiki/"
license = "AGPL-3.0"
categories = ["wiki", "documentation", "knowledge-base"]

[build]
# Force local builder and use generic toolchain (Wiki.js is pre-built)
builder = "local"
toolchain = "generic"

# Download Wiki.js pre-built release
before-build = "bash scripts/download.sh"

[run]
# Setup config before starting
before-run = "bash scripts/setup-config.sh"

# Run Wiki.js
start = "node server/index.js"

[[addons]]
type = "postgres"

[env]
NODE_ENV = "production"

[healthcheck]
contains = "Wiki.js"
path = "/"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "postgresql"]

[[test.validations]]
path = "/"
status = 200
# Fresh wiki-js serves its setup wizard on every route; match the app name.
contains = "Wiki.js"
