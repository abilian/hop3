[test]
name = "wiki-js"
category = "native-app"
tier = "medium"
priority = "P1"
description = "Wiki Js deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "postgresql"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/healthz"
[validations.expect]
status = 200
