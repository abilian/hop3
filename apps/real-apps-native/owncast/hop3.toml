# Hop3 Configuration for Owncast (Native build)
# Self-hosted livestream / Twitch alternative

[metadata]
id = "owncast"
version = "0.2.5"
title = "Owncast"
description = "Self-hosted livestream server"
homepage = "https://owncast.online/"
license = "MIT"
categories = ["media", "streaming", "video"]

[build]
builder = "local"
toolchain = "generic"
packages = ["ffmpeg"]
before-build = "bash scripts/download.sh"

[run]
start = "bash scripts/start.sh"
start-timeout = 120

[healthcheck]
path = "/api/status"

[[ports]]
number = 1935
protocol = "tcp"
name = "rtmp"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "sqlite", "streaming"]

[[test.validations]]
path = "/api/status"
status = 200
contains = "versionNumber"
