# Hop3 Configuration for XWiki (Native build)
# Advanced enterprise wiki with structured data

[metadata]
id = "xwiki"
version = "16.1"
title = "XWiki"
description = "Advanced open source enterprise wiki with structured data support"
homepage = "https://www.xwiki.org/"
license = "LGPL-2.1"
categories = ["wiki", "knowledge-base", "collaboration", "enterprise"]

[build]
builder = "local"
toolchain = "generic"

before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
# Pass port via -p argument. The script reads XWIKI_NONINTERACTIVE from env.
start = "bash -c 'export JETTY_PORT=$PORT && ./start_xwiki.sh'"
start-timeout = 180

[[addons]]
type = "postgres"

[env]
JAVA_OPTS = "-Xmx1024m"
XWIKI_NONINTERACTIVE = "true"

[healthcheck]
path = "/xwiki/bin/view/Main/"

[test]
priority = "P2"
tier = "very-slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "xwiki"]

[[test.validations]]
path = "/xwiki/bin/view/Main/"
status_in = [200, 202]
contains = "XWiki"
