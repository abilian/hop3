# Hop3 Configuration for Monica (Native build)
# Personal CRM

[metadata]
id = "monica"
version = "4.0.0"
title = "Monica"
description = "Personal relationship management system"
homepage = "https://www.monicahq.com/"
license = "AGPL-3.0"
categories = ["crm", "personal", "contacts"]

[build]
# Force local builder and explicit PHP toolchain
builder = "local"
toolchain = "php"

before-build = "bash scripts/download.sh"
# Use --ignore-platform-reqs for PHP 8.3, --ignore-scripts to skip yarn-dependent scripts
build = "composer install --no-dev --optimize-autoloader --ignore-platform-reqs && npm install --legacy-peer-deps --ignore-scripts && npm run production"

[run]
before-run = "bash scripts/setup-config.sh"
# Use --no-reload to disable Laravel's file watcher (causes 503 during restarts)
start = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080} --no-reload"

[[addons]]
type = "mysql"

[env]
APP_ENV = "production"

[healthcheck]
path = "/"

[test]
# Monica deploys and runs; its production force-HTTPS middleware redirects GET /
# to https, so it can't be *content*-verified over Hop3's plain HTTP yet (that
# needs HTTPS test support — see local-notes/stacks-and-apps/DEFERRED-APPS.md).
# So we assert the redirect itself — the same pattern kanboard / invoice-ninja /
# easy-appointments use — which proves the app is up and behaving as it does in
# production, and keeps the deploy path (PHP/composer/npm/mysql/before-run) under
# test. `status-in` accepts the redirect family rather than pinning one code.
#
# This replaces `expects-failure = true`, which mis-declared a clean deploy as a
# rejection case: once the deploy started succeeding it flipped to a false FAIL
# ("unexpected deploy success"). expects-failure is for apps that must be
# REJECTED (apps/bad/**), not for apps that deploy but can't be HTTP-verified.
[[test.validations]]
path = "/"
status-in = [301, 302, 307, 308]
