# Hop3 Configuration for Monica (Native build)
# Personal CRM

[metadata]
id = "monica"
version = "4.0.0"
title = "Monica"
description = "Personal relationship management system"
homepage = "https://www.monicahq.com/"
license = "AGPL-3.0"
categories = ["crm", "personal", "contacts"]

[build]
# Force local builder and explicit PHP toolchain
builder = "local"
toolchain = "php"

before-build = "bash scripts/download.sh"
# Use --ignore-platform-reqs for PHP 8.3, --ignore-scripts to skip yarn-dependent scripts
build = "composer install --no-dev --optimize-autoloader --ignore-platform-reqs && npm install --legacy-peer-deps --ignore-scripts && npm run production"

[run]
before-run = "bash scripts/setup-config.sh"
# Use --no-reload to disable Laravel's file watcher (causes 503 during restarts)
start = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080} --no-reload"

[[addons]]
type = "mysql"

[env]
APP_ENV = "production"

[healthcheck]
path = "/"

[test]
# `/` is Monica's first-run entry point: LoginController@showLoginOrRegister 302s
# to /register while no account exists (the harness provisions a fresh MySQL DB
# per deploy, so that is always the case). Assert the redirect...
#
# NB: the 302 is NOT a force-HTTPS redirect. Monica 4.0.0 registers no
# force-HTTPS middleware and calls no URL::forceScheme, so nothing here is
# blocked on HTTPS test support — an earlier version of this comment said
# otherwise and was wrong.
[[test.validations]]
path = "/"
status-in = [301, 302, 307, 308]

# ...and assert the real page it lands on. This heading renders only when Monica
# queries the DB and finds no account, so a pass proves the PHP build, the mysql
# addon and the migrations all worked end to end — not just that something
# answered. Asserted on /register directly, so it never depends on curl following
# the redirect.
[[test.validations]]
path = "/register"
status = 200
contains = "Welcome to your newly installed Monica instance"
