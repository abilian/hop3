# Hop3 Configuration for Invoice Ninja (Native build)
# Invoicing and billing platform

[metadata]
id = "invoice-ninja"
version = "5.8.37"
title = "Invoice Ninja"
description = "Free open-source invoicing platform"
homepage = "https://invoiceninja.com/"
license = "Elastic-2.0"
categories = ["invoicing", "billing", "finance"]

[build]
# Force local builder and explicit PHP toolchain
builder = "local"
toolchain = "php"

before-build = "bash scripts/download.sh"
# Use --ignore-platform-reqs to handle PHP 8.3 compatibility with older lock file
build = "composer install --no-dev --optimize-autoloader --ignore-platform-reqs && npm install --legacy-peer-deps && npm run production"

[run]
before-run = "bash scripts/setup-config.sh"
start = "php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"

[[addons]]
type = "mysql"

[env]
APP_ENV = "production"
APP_DEBUG = "false"

# Generated admin credentials (ADR-056). The platform generates the password
# once (stable across redeploys), stores it encrypted, and injects
# HOP3_ADMIN_EMAIL / HOP3_ADMIN_PASSWORD into the runtime env. Invoice Ninja
# keys admins by email (no username), so username is omitted. scripts/
# setup-config.sh reads these directly to run `ninja:create-account`.
[admin]
email = "operator"
password = { generate = "password", length = 20 }

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "laravel", "mysql"]

# After the headless install completes, an account exists so `/` no longer
# redirects to the /setup wizard — BaseController::flutterRoute serves the SPA
# (HTTP 200) whose <title> is the app name. A redirect back to /setup here means
# the headless account creation did not run.
[[test.validations]]
path = "/"
status = 200
contains = "Invoice Ninja"
