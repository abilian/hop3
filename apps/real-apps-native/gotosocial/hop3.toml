# Hop3 Configuration for GoToSocial (Native build)
# Lightweight ActivityPub server (federated microblog)

[metadata]
id = "gotosocial"
version = "0.21.2"
title = "GoToSocial"
description = "Lightweight ActivityPub-compatible microblog server"
homepage = "https://gotosocial.org/"
license = "AGPL-3.0"
categories = ["fediverse", "social", "activitypub"]

[build]
builder = "local"
toolchain = "generic"
before-build = "bash scripts/download.sh"

[run]
start = "bash scripts/start.sh"

[env]
GTS_BIND_ADDRESS = "0.0.0.0"
GTS_DB_TYPE = "sqlite"
GTS_LETSENCRYPT_ENABLED = "false"

[healthcheck]
path = "/api/v1/instance"
