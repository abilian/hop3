# Hop3 Configuration for Paheko (Native build)
# Nonprofit accounting & association management (SQLite)

[metadata]
id = "paheko"
version = "1.3.15"
title = "Paheko"
description = "Nonprofit accounting and association management"
homepage = "https://paheko.cloud/"
license = "AGPL-3.0"
categories = ["nonprofit", "accounting", "association"]

[build]
builder = "local"
toolchain = "php"
before-build = "bash scripts/download.sh"
build = "true"

[run]
before-run = "bash scripts/setup-config.sh"
# Paheko's `src/www/` is the document root; the router is src/index.php.
start = "php -S 0.0.0.0:${PORT:-8080} -t src/www"
start-timeout = 60

[healthcheck]
path = "/admin/install.php"
