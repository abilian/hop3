# Hop3 Configuration for BookWyrm (Native build)
# Federated Goodreads alternative

[metadata]
id = "bookwyrm"
version = "0.8.5"
title = "BookWyrm"
description = "Federated social reading, Goodreads alternative"
homepage = "https://joinbookwyrm.com/"
license = "AGPL-3.0"
categories = ["fediverse", "books", "social"]

[build]
builder = "local"
toolchain = "python"
before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/migrate.sh"
# BookWyrm reads POSTGRES_* / BOOKWYRM_REDIS_* directly; translate from
# Hop3's PG* / REDIS_URL at daemon-spawn time so the child shell exports
# them before `exec`.
start = "env POSTGRES_USER=$PGUSER POSTGRES_PASSWORD=$PGPASSWORD POSTGRES_DB=$PGDATABASE POSTGRES_HOST=$PGHOST POSTGRES_PORT=$PGPORT gunicorn bookwyrm.wsgi:application --bind 0.0.0.0:$PORT --pythonpath . --access-logfile - --error-logfile -"
start-timeout = 180

[run.workers]
celery = "env POSTGRES_USER=$PGUSER POSTGRES_PASSWORD=$PGPASSWORD POSTGRES_DB=$PGDATABASE POSTGRES_HOST=$PGHOST POSTGRES_PORT=$PGPORT celery -A celerywyrm worker --loglevel=info"

[[addons]]
type = "postgres"
# bloom is non-trusted — requires superuser to install. Declaring
# it here has the addon provision it as superuser during addon
# setup, before the app's migrations run.
extensions = ["bloom"]

[[addons]]
type = "redis"

# BookWyrm reads env vars eagerly at import time via `environs.env(...)`.
# Vars exported from before-run scripts don't propagate to the uWSGI
# daemon; Hop3's [env] block does. Set defaults that let the app boot;
# operators override at deploy time via `hop3 config:set`.
[env]
# BookWyrm's settings.py refuses to boot on the default SECRET_KEY. This is a
# deterministic dev-only value so the native test passes without a manual
# `hop3 config:set` step; production operators override via config:set.
SECRET_KEY = "hop3-dev-bookwyrm-not-for-production-use-only-change-me"
DOMAIN = "localhost"
DEBUG = "false"
USE_HTTPS = "false"
ALLOWED_HOSTS = "*"
BOOKWYRM_DATABASE_BACKEND = "postgres"
REDIS_ACTIVITY_HOST = "127.0.0.1"
REDIS_ACTIVITY_PORT = "6379"
REDIS_BROKER_HOST = "127.0.0.1"
REDIS_BROKER_PORT = "6379"
EMAIL_HOST = "localhost"
EMAIL_PORT = "25"
EMAIL_HOST_USER = "noreply"
EMAIL_HOST_PASSWORD = "changeme"
EMAIL_SENDER_NAME = "Admin"
EMAIL_SENDER_DOMAIN = "localhost"
EMAIL_USE_TLS = "false"
EMAIL_USE_SSL = "false"
DEFAULT_FROM_EMAIL = "noreply@localhost"

[healthcheck]
path = "/api/v1/instance"

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "django", "celery", "postgres", "redis", "fediverse"]

[[test.validations]]
path = "/api/v1/instance"
status = 200
contains = "uri"
