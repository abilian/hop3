[test]
name = "nextcloud"
category = "native-app"
tier = "slow"
priority = "P2"
description = "Nextcloud self-hosted cloud"

[test.requirements]
targets = ["docker", "remote"]
services = ["mysql"]

[test.metadata]
author = "hop3-team"
covers = ["php", "nextcloud", "mysql"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/status.php"
[validations.expect]
status = 200
