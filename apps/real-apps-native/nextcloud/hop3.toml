# Hop3 Configuration for Nextcloud (Native build)
# File hosting and collaboration platform

[metadata]
id = "nextcloud"
version = "28.0.2"
title = "Nextcloud"
description = "Self-hosted productivity platform"
homepage = "https://nextcloud.com/"
license = "AGPL-3.0"
categories = ["file-sharing", "collaboration", "cloud-storage"]

[build]
# Force local builder
builder = "local"
# Generic toolchain since Nextcloud is pre-built - no npm/composer installation needed
toolchain = "generic"

before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
start = "php -S 0.0.0.0:${PORT:-8080}"

[[addons]]
type = "mysql"

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Map the injected admin creds (HOP3_ADMIN_*) onto the env vars the installer
# (scripts/setup-config.sh -> occ maintenance:install) reads. Interpolated
# after the admin creds are injected, so no literal secret lives in [env].
[env.computed]
NEXTCLOUD_ADMIN_USER = "${HOP3_ADMIN_USER}"
NEXTCLOUD_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[healthcheck]
contains = "installed"
path = "/status.php"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "nextcloud", "mysql"]

[[test.validations]]
path = "/status.php"
status = 200
contains = "installed"
