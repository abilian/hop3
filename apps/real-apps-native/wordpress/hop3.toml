# Hop3 Configuration for WordPress (Native build)
# Popular content management system

[metadata]
id = "wordpress"
version = "6.4.2"
title = "WordPress"
description = "Popular open source content management system"
homepage = "https://wordpress.org/"
license = "GPL-2.0"
categories = ["cms", "blog", "content-management"]

[build]
# Force local builder for native PHP deployment
builder = "local"
toolchain = "php"

# Download WordPress
before-build = "bash scripts/download.sh"

# No build step needed for WordPress (pure PHP)

[run]
# Create wp-config.php before starting
before-run = "bash scripts/setup-config.sh"

# Run with PHP built-in server
start = "php -S 0.0.0.0:${PORT:-8080}"

[[addons]]
type = "mysql"

[env]
WP_DEBUG = "false"
WP_TITLE = "WordPress"

# Authentication keys and salts (ADR 046). WordPress hashes session cookies and
# nonces with these 8 secrets. If any changes, every logged-in session is
# invalidated (all users logged out). The platform generates each ONCE on first
# deploy and re-injects the SAME value on every redeploy (keep-existing policy),
# so scripts/setup-config.sh READS them instead of minting fresh ones — which
# would rotate on each redeploy. 64 random bytes, base64-encoded (matches the
# entropy WordPress's own salt generator uses).
AUTH_KEY = { generate = "base64", length = 64 }
SECURE_AUTH_KEY = { generate = "base64", length = 64 }
LOGGED_IN_KEY = { generate = "base64", length = 64 }
NONCE_KEY = { generate = "base64", length = 64 }
AUTH_SALT = { generate = "base64", length = 64 }
SECURE_AUTH_SALT = { generate = "base64", length = 64 }
LOGGED_IN_SALT = { generate = "base64", length = 64 }
NONCE_SALT = { generate = "base64", length = 64 }

# Generated admin credentials (ADR-056). The platform generates the password
# once (stable across redeploys), stores it encrypted, and injects
# HOP3_ADMIN_USER / HOP3_ADMIN_EMAIL / HOP3_ADMIN_PASSWORD into the runtime env.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

# Map WordPress's headless installer inputs (read by scripts/wp-install.php ->
# wp_install()) onto the injected admin credentials. Interpolated AFTER
# HOP3_ADMIN_* is injected, so these reach setup-config.sh with real values.
[env.computed]
WP_ADMIN_USER = "${HOP3_ADMIN_USER}"
WP_ADMIN_EMAIL = "${HOP3_ADMIN_EMAIL}"
WP_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

# /wp-login.php only serves 200 once WordPress is installed; before install it
# 302s to the setup wizard. So a passing healthcheck now proves the headless
# install completed (not just that PHP is up).
[healthcheck]
contains = "user_login"
path = "/wp-login.php"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "mysql"]

# Validate the app is actually INSTALLED and working, not sitting on the wizard.
# Home page renders the default "Hello world!" post -> schema + seed content
# exist. Login page serves the real form -> auth surface is reachable (before
# install it would redirect to /wp-admin/install.php instead).
[[test.validations]]
path = "/"
status = 200
contains = "Hello world"

[[test.validations]]
path = "/wp-login.php"
status = 200
contains = "user_login"
