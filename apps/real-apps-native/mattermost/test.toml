[test]
name = "mattermost"
category = "native-app"
tier = "medium"
priority = "P1"
description = "Mattermost deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "postgresql"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/api/v4/system/ping"
[validations.expect]
status = 200
