# Hop3 Configuration for Listmonk (Native build)
# Self-hosted newsletter and mailing list manager

[metadata]
id = "listmonk"
version = "3.0.0"
title = "Listmonk"
description = "Self-hosted newsletter and mailing list manager"
homepage = "https://listmonk.app/"
license = "AGPL-3.0"
categories = ["newsletter", "email", "mailing-list"]

[build]
# Force local builder (source code may include Dockerfile)
builder = "local"
# Use generic toolchain since this downloads a pre-built binary
toolchain = "generic"

# Download pre-built binary
before-build = "bash scripts/download.sh"

[run]
# Setup config before starting
before-run = "bash scripts/setup-config.sh"

# Run listmonk
start = "./listmonk"

[[addons]]
type = "postgres"

[healthcheck]
path = "/api/health"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "listmonk"]

[[test.validations]]
path = "/"
status = 200
contains = "listmonk"
