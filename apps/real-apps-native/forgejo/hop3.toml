# Hop3 Configuration for Forgejo (Native build)
# Self-hosted Git service — community fork of Gitea

[metadata]
id = "forgejo"
version = "14.0.3"
title = "Forgejo"
description = "Self-hosted Git service (community fork of Gitea)"
homepage = "https://forgejo.org/"
license = "GPL-3.0-or-later"
categories = ["git", "version-control", "development"]

[build]
builder = "local"
toolchain = "generic"
before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
start = "./forgejo web"
start-timeout = 180

[[addons]]
type = "postgres"

[env]
# Stable security secrets (ADR 046): generated once on first deploy and
# re-injected UNCHANGED on every redeploy. scripts/setup-config.sh writes them
# into custom/conf/app.ini, which lives under the source tree the redeploy
# replaces — so without a stable value here each key would rotate on every
# redeploy. Rotation is data loss, not just a re-login:
#   - SECRET_KEY encrypts 2FA secrets, mirror/migration passwords and tokens ->
#     a new key makes all of them undecryptable. Forgejo sha256-derives its AES
#     key from this string, so any long random value works (base64, 32 bytes).
#   - JWT_SECRET signs OAuth2 tokens -> a new one invalidates every grant/token.
#     Forgejo requires base64url (no padding) decoding to exactly 32 bytes,
#     which is exactly what `urlsafe` (token_urlsafe, 32 bytes) produces.
#   - INTERNAL_TOKEN authenticates Forgejo's internal API (git hooks <-> web) and
#     is compared as an opaque string, so a long random hex value is fine.
# Without them in app.ini, Forgejo mints its own and writes them BACK into the
# source-tree app.ini, which the next redeploy wipes — the same rotation.
SECRET_KEY = { generate = "base64" }
INTERNAL_TOKEN = { generate = "hex" }
JWT_SECRET = { generate = "urlsafe" }

[[volumes]]
# Forgejo keeps its git repositories (data/forgejo-repositories per
# [repository].ROOT) plus LFS/avatars/attachments/packages on disk under the
# work dir (src/data). The redeploy wipes and re-extracts src/, so without
# persisting this directory EVERY repository is lost on redeploy. Postgres holds
# only metadata; this volume covers the on-disk repo/object storage (ADR 046 §2).
name = "data"
target = "data"

[admin]
# Not "admin": Forgejo reserves that username (CreateUser rejects it). Use a
# non-reserved name for the generated site admin.
username = "hop3admin"
email = "operator"
password = { generate = "password", length = 20 }
# Forgejo has no env-var admin bootstrap, so create the initial admin once,
# post-deploy, with its CLI (ADR 056). Idempotent — skips when the user already
# exists — and fail-loud: a missing injected credential aborts via ${VAR:?...},
# and a final presence check fails the deploy if the account wasn't created
# (Forgejo's CLI, like Gitea's, can report an error yet exit 0). Runs in src/
# with HOP3_ADMIN_* injected; ./forgejo reads custom/conf/app.ini.
create = '''
set -e
ADMIN_USER="${HOP3_ADMIN_USER:?admin user not injected}"
ADMIN_EMAIL="${HOP3_ADMIN_EMAIL:?admin email not injected}"
ADMIN_PASSWORD="${HOP3_ADMIN_PASSWORD:?admin password not injected}"
export GITEA_WORK_DIR="$(pwd)"
conf="custom/conf/app.ini"
present() { ./forgejo admin user list -c "$conf" | awk 'NR>1{print $2}' | grep -Fxq "$ADMIN_USER"; }
if present; then
  echo "Forgejo admin already exists: $ADMIN_USER"
else
  ./forgejo admin user create --admin --username "$ADMIN_USER" \
    --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" \
    --must-change-password=false -c "$conf"
fi
present || { echo "ERROR: Forgejo admin '$ADMIN_USER' was not created" >&2; exit 1; }
'''

[healthcheck]
path = "/api/healthz"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "postgresql"]

[[test.validations]]
path = "/api/healthz"
status = 200
contains = "status"
