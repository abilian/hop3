# Hop3 Configuration for Kanboard (Native build)
# Kanban project management software

[metadata]
id = "kanboard"
version = "1.2.37"
title = "Kanboard"
description = "Kanban project management software"
homepage = "https://kanboard.org/"
license = "MIT"
categories = ["project-management", "kanban", "productivity"]

[build]
# Force local builder for native PHP deployment
builder = "local"
toolchain = "php"

# Download and extract Kanboard source
before-build = "bash scripts/download.sh"

# Kanboard doesn't use composer by default, but we need to ensure proper permissions
build = "chmod -R 755 . && chmod -R 777 data plugins"

[run]
# Create config, then migrate to completion BEFORE serving. Kanboard otherwise
# migrates lazily on the first web request; the deploy readiness probe interrupts
# that mid-DDL (picodb takes no lock), so version_106 re-runs and fails with
# "table task_has_files already exists". `cli db:migrate` runs once, serialized,
# and suppresses the lazy web-bootstrap migration.
before-run = ["bash scripts/setup-config.sh", "php cli db:migrate"]

# Run with PHP built-in server
start = "php -S 0.0.0.0:${PORT:-8080} -t ."

[[addons]]
type = "mysql"

[env]
DEBUG = "false"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "mysql"]

[[test.validations]]
path = "/"
status = 302
contains = "Kanboard"
