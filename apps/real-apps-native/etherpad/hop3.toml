# Hop3 Configuration for Etherpad (Native build)
# Real-time collaborative editor

[metadata]
id = "etherpad"
version = "2.0.3"
title = "Etherpad"
description = "Real-time collaborative document editor"
homepage = "https://etherpad.org/"
license = "Apache-2.0"
categories = ["collaboration", "editor", "real-time"]

[build]
# Force local builder (source code includes a Dockerfile but we want native build)
builder = "local"
# Explicit toolchain since package.json doesn't exist until before-build downloads source
toolchain = "node"
# Etherpad 2.x drives its build through pnpm, which requires Node >= 22.13.
# Without this the build falls back to the host's apt Node (v18 on Ubuntu
# 24.04) and dies in bin/installDeps.sh. The Node toolchain installs this
# exact version into the app venv via `nodeenv --prebuilt`. Must be a full
# version (not a bare "22") — nodeenv uses the string verbatim as the
# download version, so "22" would resolve to a non-existent dist dir.
node-version = "22.13.1"

# Download source code
before-build = "bash scripts/download.sh"

# Install dependencies using Etherpad's script (uses pnpm internally)
build = "CI=true bin/installDeps.sh"

[run]
# Create settings before starting
before-run = "bash scripts/setup-settings.sh"

# Run Etherpad using pnpm (which manages tsx internally)
start = "pnpm run prod"

[env]
NODE_ENV = "production"

[healthcheck]
path = "/"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs"]

[[test.validations]]
path = "/"
status = 200
