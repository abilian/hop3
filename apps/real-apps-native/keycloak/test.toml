[test]
name = "native-keycloak"
category = "deployment"
tier = "slow"
priority = "P2"
description = "Keycloak SSO / OIDC server — native build with app-local Temurin JRE 21"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["java", "jvm", "native", "postgres", "sso"]

[deployment]
path = "."
type = "generic"

[[validations]]
type = "http"
path = "/realms/master"
[validations.expect]
status = 200
contains = "master"
