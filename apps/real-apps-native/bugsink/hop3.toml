# Hop3 Configuration for Bugsink (Native build)
# Self-hosted error tracking, Sentry SDK-compatible

[metadata]
id = "bugsink"
version = "2.1.2"
title = "Bugsink"
description = "Self-hosted error tracking, Sentry SDK-compatible"
homepage = "https://www.bugsink.com/"
license = "PolyForm Shield License 1.0.0"
categories = ["observability", "error-tracking", "dev-tools"]

[build]
builder = "local"
toolchain = "python"

[run]
before-run = "bash scripts/setup.sh"
# --pythonpath . is required so gunicorn can import bugsink_conf from cwd
# (bugsink.wsgi sets DJANGO_SETTINGS_MODULE=bugsink_conf).
start = "gunicorn bugsink.wsgi:application --bind 0.0.0.0:$PORT --pythonpath . --access-logfile - --error-logfile -"
start-timeout = 120

# Bugsink is a two-process app: the gunicorn web server above, plus a background
# task worker ("snappea") that processes queued events. Without it, ingested
# events queue in the snappea DB but are never processed.
[run.workers]
snappea = "bugsink-runsnappea"

[[addons]]
type = "postgres"

# Outbound email (ADR 054). Inherits the server's email backend (catch/relay/
# direct) — no per-app SMTP credentials. Bugsink reads EMAIL_HOST/EMAIL_PORT from
# the environment (its generated bugsink_conf.py), so this clears the "Email is
# not set up" banner and enables invites / alerts. Optional: on a box with no
# backend the addon degrades gracefully (the app just runs without outbound mail).
[[addons]]
type = "email"

[env]
# Generated once on first deploy and stable across redeploys (ADR 046).
SECRET_KEY = { generate = "urlsafe" }

# Initial admin account (ADR 056). Hop3 generates the password, stores it
# (retrieve via `hop3 app credentials`), and surfaces it once after deploy. The
# account itself is created in scripts/setup.sh from the injected HOP3_ADMIN_*
# after migrate. Bugsink's Django user model keys logins by USERNAME (email is
# a stored field), so `createsuperuser --noinput` requires a username.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

[healthcheck]
# Bugsink redirects `/` to the login page when unauthenticated; point
# at the login page directly so we get a 200 rather than a 302.
path = "/accounts/login/"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "django", "postgres"]

[[test.validations]]
path = "/accounts/login/"
status = 200
contains = "Bugsink"
