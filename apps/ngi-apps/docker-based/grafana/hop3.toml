# Hop3 Configuration for Grafana (Docker-based)
# The open observability platform

[metadata]
id = "grafana"
version = "11.0"
title = "Grafana"
description = "The open and composable observability and data visualization platform"
homepage = "https://grafana.com/"
license = "AGPL-3.0"
categories = ["monitoring", "visualization", "observability", "devops"]

# Grafana can use SQLite (default) or PostgreSQL
# Using SQLite for simplicity - no addon needed

[env]
GF_SERVER_HTTP_PORT = "8080"
GF_SECURITY_ADMIN_USER = "admin"

[healthcheck]
path = "/api/health"
