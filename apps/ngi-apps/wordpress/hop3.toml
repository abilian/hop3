# Hop3 Configuration for WordPress
# https://wordpress.org/

[metadata]
id = "wordpress"
version = "6.4"
title = "WordPress"
description = "The world's most popular content management system"
homepage = "https://wordpress.org/"
license = "GPL-2.0-or-later"
categories = ["cms", "blog", "website"]

[build]
# System packages required for WordPress
packages = [
    "php8.2",
    "php8.2-fpm",
    "php8.2-mysql",
    "php8.2-curl",
    "php8.2-gd",
    "php8.2-intl",
    "php8.2-mbstring",
    "php8.2-xml",
    "php8.2-zip",
    "php8.2-imagick",
    "unzip",
    "curl",
]

# Build script to download and configure WordPress
script = """
#!/bin/bash
set -e

# Download WordPress if not present
if [ ! -f wp-config-sample.php ]; then
    curl -sL https://wordpress.org/latest.tar.gz | tar xz --strip-components=1
fi

# Copy config template if wp-config.php doesn't exist
if [ ! -f wp-config.php ] && [ -f wp-config-hop3.php ]; then
    cp wp-config-hop3.php wp-config.php
fi
"""

[run]
# WordPress runs via PHP-FPM, not a direct command
type = "php-fpm"

[env]
# WordPress environment variables (set via hop3 config:set)
# WORDPRESS_DB_HOST = "localhost"
# WORDPRESS_DB_NAME = "wordpress"
# WORDPRESS_DB_USER = "wordpress"
# WORDPRESS_DB_PASSWORD = ""
# WORDPRESS_AUTH_KEY = ""
# WORDPRESS_SECURE_AUTH_KEY = ""
# WORDPRESS_LOGGED_IN_KEY = ""
# WORDPRESS_NONCE_KEY = ""
# WORDPRESS_AUTH_SALT = ""
# WORDPRESS_SECURE_AUTH_SALT = ""
# WORDPRESS_LOGGED_IN_SALT = ""
# WORDPRESS_NONCE_SALT = ""
WP_DEBUG = "false"

[port]
web = 80

[healthcheck]
path = "/wp-admin/install.php"
timeout = 30
interval = 60

[proxy]
# Nginx configuration for PHP
type = "php"
document_root = "."
index = "index.php"

[[addons]]
type = "mysql"
name = "wordpress-db"
env_prefix = "WORDPRESS_DB"
