# Hop3 Configuration for HedgeDoc (Native build)
# Collaborative markdown editor

[metadata]
id = "hedgedoc"
version = "1.9.9"
title = "HedgeDoc"
description = "Real-time collaborative markdown editor"
homepage = "https://hedgedoc.org/"
license = "AGPL-3.0"
categories = ["collaboration", "markdown", "editor"]

[build]
# Force local builder (source code may include Dockerfile)
builder = "local"
# Explicit toolchain since package.json doesn't exist until before-build downloads source
toolchain = "node"

before-build = "bash scripts/download.sh"
# Use --legacy-peer-deps to handle peer dependency conflicts in older dependencies
build = "npm install --legacy-peer-deps && npm run build"

[run]
before-run = "bash scripts/setup-config.sh"
start = "node app.js"

[[addons]]
type = "postgres"

[env]
NODE_ENV = "production"

[healthcheck]
path = "/status"
