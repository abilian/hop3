# Hop3 Configuration for CryptPad (Native build)
# End-to-end encrypted collaboration suite

[metadata]
id = "cryptpad"
version = "2024.6"
title = "CryptPad"
description = "End-to-end encrypted collaboration suite"
homepage = "https://cryptpad.org/"
license = "AGPL-3.0"
categories = ["collaboration", "encryption", "documents", "privacy"]

[build]
builder = "local"
toolchain = "node"

before-build = "bash scripts/download.sh"
build = "npm install --legacy-peer-deps && npm run build"

[run]
before-run = "bash scripts/setup-config.sh"
start = "node server.js"

# CryptPad uses file-based storage, no database needed

[env]
CPAD_MAIN_DOMAIN = "http://localhost:8080"

[healthcheck]
path = "/api/config"
