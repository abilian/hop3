# Hop3 Configuration for Uptime Kuma (Native build)
# Self-hosted monitoring tool

[metadata]
id = "uptime-kuma"
version = "1.23.11"
title = "Uptime Kuma"
description = "Self-hosted monitoring tool like Uptime Robot"
homepage = "https://uptime.kuma.pet/"
license = "MIT"
categories = ["monitoring", "uptime", "devops"]

[build]
# Force local builder (source code may include Dockerfile)
builder = "local"

# Download source
before-build = "bash scripts/download.sh"

# Install dependencies and build frontend (need devDeps for vite build)
build = "npm ci && npm run build"

[run]
# Run server (uWSGI already sets chdir to src/)
start = "node server/server.js"

[env]
NODE_ENV = "production"
DATA_DIR = "./data"

[healthcheck]
path = "/api/health"
