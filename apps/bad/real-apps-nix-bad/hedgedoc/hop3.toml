# Hop3 Configuration for HedgeDoc (Nix build)
# Collaborative markdown editor

[build]
builder = "nix"

[[addons]]
type = "postgres"

[env]
NODE_ENV = "production"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "hedgedoc", "nix", "postgres"]

[[test.validations]]
path = "/status"
status = 200
