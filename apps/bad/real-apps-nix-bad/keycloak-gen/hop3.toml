# hop3.toml - Hop3 configuration for Nix-based Keycloak (nix-gen variant)
#
# STATUS: DEFERRED — see DEFERRED.md in this directory.
#
# A working, hand-crafted Keycloak deploy lives at
# apps/real-apps-nix/keycloak/. This directory is the nix-gen *probe*
# — it exists to show which template feature is still missing.
#
# Today's install-extra + exec-prefix fields (shipped 2026-04-21)
# weren't enough: `kc.sh build --db=postgres` during installPhase
# fails with Quarkus's ReadOnlyFileSystemException on both macOS and
# Linux Nix sandboxes. The real fix is to let the nixpkgs.keycloak
# derivation run its build with --db=postgres, which requires a new
# template field `nixpkgs-overrides` so we can pass
# `confFile = pkgs.writeText "kc.conf" "db=postgres\n"` to
# `pkgs.keycloak.override { ... }`. See DEFERRED.md for rationale.

[metadata]
id = "keycloak"
description = "Enterprise SSO / OIDC / SAML identity and access management"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "keycloak"
exec-target = "kc.sh"
exec-args = [
    'start-dev',
    '--http-host=0.0.0.0',
    '--http-port=${PORT}',
]
extra-paths = ['${keycloak}/bin']

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
KC_DB = "postgres"

[nix.env-exports]
KC_DB_URL = "jdbc:postgresql://${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-keycloak}"
KC_DB_USERNAME = "${PGUSER:-keycloak}"
KC_DB_PASSWORD = "${PGPASSWORD:-}"
KC_BOOTSTRAP_ADMIN_USERNAME = "admin"
KC_BOOTSTRAP_ADMIN_PASSWORD = "changeme"

[[addons]]
type = "postgres"

[run]
start-timeout = 420

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "jvm", "nix", "nixpkgs-wrapper", "postgres", "sso"]

[[test.validations]]
path = "/realms/master"
status = 200
contains = "master"
