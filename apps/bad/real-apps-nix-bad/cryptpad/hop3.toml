# Hop3 Configuration for CryptPad (Nix build)
# End-to-end encrypted collaboration suite

[build]
builder = "nix"

[env]
CPAD_MAIN_DOMAIN = "http://localhost:8080"

[test]
priority = "P2"
tier = "very-slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "cryptpad", "nix"]

[[test.validations]]
path = "/api/config"
status = 200
