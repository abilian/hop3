# Test definition for CryptPad built with Nix

[test]
name = "nix-cryptpad"
category = "nix-app"
# CryptPad's nix build includes a ~1GB npm install that exceeds 20 min;
# bumped to very-slow to match hop3.toml's [build].tier.
tier = "very-slow"
priority = "P2"
description = "CryptPad encrypted collaboration suite deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "cryptpad", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/api/config"
[validations.expect]
status = 200
