# Hop3 Configuration for Etherpad (Nix build)
# Real-time collaborative editor

[build]
builder = "nix"

[env]
NODE_ENV = "production"

[run]
start-timeout = 120

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "etherpad", "nix"]

[[test.validations]]
path = "/"
status = 200
