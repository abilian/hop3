# Test definition for XWiki built with Nix

[test]
name = "nix-xwiki"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "XWiki enterprise wiki deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["java", "xwiki", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/xwiki/bin/view/Main/"
[validations.expect]
status = 200
