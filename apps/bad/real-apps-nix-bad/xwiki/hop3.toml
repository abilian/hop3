# Hop3 Configuration for XWiki (Nix build)
# Advanced enterprise wiki with structured data

[build]
builder = "nix"

[[addons]]
type = "postgres"

[env]
JAVA_OPTS = "-Xmx1024m"
XWIKI_NONINTERACTIVE = "true"

[run]
# First boot does a ~400MB copy from the Nix store into .xwiki-home,
# then Jetty + HSQLDB + XWiki initialisation. 60s is too short even
# on a warm box. 180s gives first-deploy headroom; subsequent restarts
# reuse the copy and are much faster.
start-timeout = 180

[test]
priority = "P2"
tier = "very-slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "xwiki", "nix", "postgres"]

[[test.validations]]
# XWiki's first-boot returns HTTP 202 (Accepted) while its install
# wizard runs schema migrations + initial page content import. Once
# that finishes (can take minutes), subsequent requests get 200.
# `status_in` accepts either.
path = "/xwiki/bin/view/Main/"
status_in = [200, 202]
