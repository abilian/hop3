[test]
name = "nix-directus-handcrafted"
category = "nix-app"
tier = "slow"
priority = "P1"
description = "Directus via Nix (hand-crafted, __noChroot npm install)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "nix", "postgres", "headless-cms"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/admin/login"
[validations.expect]
status = 200
