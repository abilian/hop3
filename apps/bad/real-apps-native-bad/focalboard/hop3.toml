# Hop3 Configuration for Focalboard (Native build)
# Project management and organization tool

[metadata]
id = "focalboard"
version = "7.10.5"
title = "Focalboard"
description = "Open source project management tool"
homepage = "https://www.focalboard.com/"
license = "MIT"
categories = ["project-management", "kanban", "productivity"]

[build]
# Force local builder (source code may include Dockerfile)
builder = "local"
# Explicit toolchain since go.mod doesn't exist until before-build downloads source
toolchain = "go"

before-build = "bash scripts/download.sh"
build = "make prebuild && make server && cd webapp && npm install && npm run pack"

[run]
before-run = "bash scripts/setup-config.sh"
start = "./bin/focalboard-server"

[[addons]]
type = "postgres"

[env]
FOCALBOARD_EDITION = "personal"

[healthcheck]
path = "/api/v2/health"

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "postgresql"]

[[test.validations]]
path = "/api/v2/health"
status = 200
contains = "status"
