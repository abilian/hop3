[test]
name = "bookwyrm"
category = "native-app"
tier = "slow"
priority = "P1"
description = "BookWyrm federated reading deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql", "redis"]

[test.metadata]
author = "hop3-team"
covers = ["python", "django", "celery", "postgres", "redis", "fediverse"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/api/v1/instance"
[validations.expect]
status = 200
