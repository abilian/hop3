# Hop3 Configuration for Directus (Native build)
# Headless CMS — turn any SQL DB into admin UI + API

[metadata]
id = "directus"
version = "11.17.2"
title = "Directus"
description = "Open-source headless CMS"
homepage = "https://directus.io/"
license = "BSL-1.1"
categories = ["cms", "api", "headless"]

[build]
builder = "local"
toolchain = "node"
# Directus 11.x requires Node 22+. Debian/Ubuntu's apt-installed
# nodejs is 18 on bookworm / 20 on trixie; neither is sufficient.
# Hop3 installs nodeenv as part of hop3-install server; the Node
# toolchain calls `nodeenv --prebuilt --node=22` into the app's
# virtualenv when this field is set. See blocker #8 in DEFERRED-APPS.
node-version = "22"
# Directus pulls native Node modules (isolated-vm, others) that compile
# at install time. The full link-time closure under Debian-packaged
# Node 18, where node-gyp resolves to *system* shared libs (unlike the
# upstream NodeSource binary that bundles them):
#
#   libbrotli-dev   → -lbrotlicommon/-lbrotlienc/-lbrotlidec
#   libc-ares-dev   → -lcares
#   libnghttp2-dev  → -lnghttp2
#   libicu-dev      → -licui18n / -licuuc / -licudata
#   libnode-dev     → Node headers + extra runtime libs
#   build-essential + python3 + pkg-config are node-gyp prerequisites.
#
# (Node 18 is also below what Directus 11.x officially supports;
# separate blocker #8 — "single Node version on the server". Once that
# lands with Node 22 via NodeSource, some of these -dev libs may
# become redundant since NodeSource bundles them.)
packages = [
    "libbrotli-dev",
    "libc-ares-dev",
    "libnghttp2-dev",
    "libicu-dev",
    "libnode-dev",
    "build-essential",
    "python3",
    "pkg-config",
]
before-build = "bash scripts/install.sh"

[run]
before-run = "bash scripts/bootstrap.sh"
start = "npx directus start"
start-timeout = 180

[[addons]]
type = "postgres"

[env]
KEY = { random = true }
SECRET = { random = true }
DB_CLIENT = "pg"
PUBLIC_URL = "http://localhost"
ADMIN_EMAIL = "admin@example.com"
ADMIN_PASSWORD = { random = true }

[healthcheck]
path = "/admin/login"

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "postgres", "headless-cms"]

[[test.validations]]
path = "/admin/login"
status = 200
