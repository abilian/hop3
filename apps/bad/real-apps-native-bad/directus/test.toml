[test]
name = "directus"
category = "native-app"
tier = "slow"
priority = "P1"
description = "Directus headless CMS deployed natively"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["nodejs", "postgres", "headless-cms"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/admin/login"
[validations.expect]
status = 200
