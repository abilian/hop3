[test]
name = "sonarqube"
category = "native-app"
tier = "very-slow"
priority = "P2"
description = "SonarQube code quality platform (slow startup)"

[test.requirements]
targets = ["docker", "remote"]
services = ["postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["java", "sonarqube"]

[deployment]
path = "."

[[validations]]
type = "http"
path = "/api/system/status"
[validations.expect]
status = 200
