# Hop3 Configuration for SonarQube (Native build)
# Code quality and security analysis platform

[metadata]
id = "sonarqube"
version = "26.2.0"
title = "SonarQube"
description = "Continuous inspection of code quality and security"
homepage = "https://www.sonarsource.com/products/sonarqube/"
license = "LGPL-3.0"
categories = ["devops", "code-quality", "security", "ci-cd"]

[build]
builder = "local"
toolchain = "generic"

before-build = "bash scripts/download.sh"

[run]
before-run = "bash scripts/setup-config.sh"
start = "./bin/linux-x86-64/sonar.sh console"
# SonarQube's bundled Elasticsearch takes 3-5 min to become healthy,
# especially on first start when it initialises the index directory.
start-timeout = 360

[[addons]]
type = "postgres"

[env]
SONAR_SEARCH_JAVAADDITIONALOPTS = "-Dnode.store.allow_mmap=false"

[healthcheck]
path = "/api/system/status"
