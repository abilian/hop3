[metadata]
id = "bookstack"
version = "24.02"
description = "Simple, self-hosted documentation platform"

[nix]
composer-deps-hash = "sha256-ir7mLBoB5djufwvFcWof16xai9bnHt9IZm2/mq+pKIU="
template = "php-app"
needs-writable-dir = true
# Migrate (idempotent, fail-loud — no more swallowed errors), then re-key the
# admin to the injected credentials (ADR 056): BookStack's migration seeds a
# fixed admin@admin.com, so create the platform admin explicitly. Guarded on a
# marker (create-admin errors if the email already exists).
pre-exec = [
  "PHPBIN/php artisan migrate --force",
  "if [ ! -f .hop3-admin ]; then PHPBIN/php artisan bookstack:create-admin --email=\"$HOP3_ADMIN_EMAIL\" --name=\"$HOP3_ADMIN_USER\" --password=\"$HOP3_ADMIN_PASSWORD\"; touch .hop3-admin; fi",
]
serve-mode = "artisan"
url = "https://github.com/BookStackApp/BookStack/archive/refs/tags/v${version}.tar.gz"
sha256 = "CDJ0X2x274ohrevyH+9w4J/wY9SEpdJTNO2MA0resLI="
archive = "tar-gz"
php-version = "php82"
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'mbstring', 'curl', 'zip', 'tokenizer', 'bcmath', 'intl', 'ldap']
needs-composer = true
post-install-dirs = ['storage/app', 'storage/framework/cache', 'storage/framework/sessions', 'storage/framework/views', 'storage/logs', 'bootstrap/cache']
extra-paths = ['${php}/bin']

[nix.runtime-env]
APP_ENV = "production"
APP_DEBUG = "false"

# Hop3 Configuration for BookStack (Nix build)
# Documentation/wiki platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

# Generated admin credentials (ADR 056), consumed by the create-admin step.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

[env]
APP_KEY = "base64:YY6Y7MPsG9s105LprP4KohEbjGwQ8sUG7iYIoJs1t4Y="
APP_ENV = "production"
APP_DEBUG = "false"

[env.computed]
DB_CONNECTION = "mysql"
DB_HOST = "${MYSQL_HOST}"
DB_PORT = "${MYSQL_PORT}"
DB_DATABASE = "${MYSQL_DATABASE}"
DB_USERNAME = "${MYSQL_USER}"
DB_PASSWORD = "${MYSQL_PASSWORD}"

[[nix.config-files]]
path = ".env"
format = "raw"
raw-content = """
APP_ENV=${APP_ENV:-production}
APP_DEBUG=${APP_DEBUG:-false}
APP_KEY=${APP_KEY}
APP_URL=${HOP3_PUBLIC_URL:-http://localhost:${PORT:-8080}}
DB_CONNECTION=mysql
DB_HOST=${DB_HOST:-127.0.0.1}
DB_PORT=${DB_PORT:-3306}
DB_DATABASE=${DB_DATABASE:-bookstack}
DB_USERNAME=${DB_USERNAME:-bookstack}
DB_PASSWORD=${DB_PASSWORD:-}
"""

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "bookstack", "nix", "wiki", "laravel"]

[[test.validations]]
path = "/login"
status = 200
contains = "BookStack"
