# Test definition for BookStack built with Nix

[test]
name = "nix-bookstack"
category = "nix-app"
tier = "medium"
priority = "P2"  # Known: returns 500 without app-specific config
description = "BookStack wiki platform built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["mysql", "nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "bookstack", "nix", "wiki", "laravel"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/login"
[validations.expect]
status = 200
