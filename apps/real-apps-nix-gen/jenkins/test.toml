# Test definition for Jenkins built with Nix

[test]
name = "nix-jenkins"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "Jenkins CI/CD server deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["java", "jenkins", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/login"
[validations.expect]
status = 200
