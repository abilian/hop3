[metadata]
id = "jenkins"
version = "2.541.2"
description = "The leading open source automation server for CI/CD"

[nix]
template = "java-war"
url = "https://get.jenkins.io/war-stable/${version}/jenkins.war"
sha256 = "3J1TLlTUt+t9eO3NMheHbdSBG0nRo7ZuWZrUpkLVcZM="
runtime-package = "jdk17"
war-file = "jenkins.war"
exec-args = ['--httpPort="${PORT:-8080}"', '"$@"']
extra-paths = ['${jdk}/bin']
pre-exec = ['mkdir -p "$JENKINS_HOME"']

[nix.env-exports]
JENKINS_HOME = "${JENKINS_HOME:-./jenkins_home}"

[nix.runtime-env]
JENKINS_HOME = "./jenkins_home"
JAVA_OPTS = "-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"

# Hop3 Configuration for Jenkins (Nix build)
# The leading open source automation server

[build]
builder = "nix"

[env]
JENKINS_HOME = "./jenkins_home"
JAVA_OPTS = "-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "jenkins", "nix"]

[[test.validations]]
path = "/login"
status = 200
contains = "Jenkins"
