# hop3.toml — Redmine (Ruby on Rails), generated from the ruby-bundler template.
#
# The Rails specifics live here rather than in the template: a Rails app writes
# inside its own tree, so it takes writable-home-at-runtime, and its runtime
# config / migration / boot command are expressed with the shared config-files,
# pre-exec and exec-args fields. The gem set is pinned by a bundix-generated
# gemset.nix resolved with force_ruby_platform, so every gem — including the
# native nokogiri and pg — is compiled from source rather than fetched as a
# precompiled binary.

[metadata]
id = "redmine"
version = "5.1.10"
description = "Flexible project management web application (Ruby on Rails)"

[build]
builder = "nix"

[nix]
template = "ruby-bundler"
url = "https://www.redmine.org/releases/redmine-${version}.tar.gz"
sha256 = "0hbgzbg38ky1gcs8czbhdw11naarlz81mvmvyzx44kw0l367s60g"
archive = "tar-gz"
# redmine 5.1.10 requires ruby >= 2.7, < 3.3 — ruby_3_3 (the template default)
# is refused by its own Gemfile.
runtime-package = "ruby_3_2"
# Rails writes config/database.yml, the secret token, tmp/ and log/ inside its
# install tree; the Nix store is read-only (blocker #12).
writable-home-at-runtime = true
exec-target = "rails"
exec-args = ["server", "-b", "0.0.0.0", "-p", "$PORT"]

# Both are idempotent, so they are safe on every boot. `rake` resolves through
# the gem set, which the template puts on PATH.
pre-exec = [
  "[ -f config/initializers/secret_token.rb ] || rake generate_secret_token",
  "rake db:migrate",
]

[nix.env-exports]
RAILS_ENV = "production"
RAILS_SERVE_STATIC_FILES = "1"

# Written into the writable home at every boot, from the addon's PG* values.
[[nix.config-files]]
path = "config/database.yml"
format = "raw"
raw-content = """
production:
  adapter: postgresql
  database: ${PGDATABASE:-redmine}
  host: ${PGHOST}
  port: ${PGPORT:-5432}
  username: ${PGUSER}
  password: "${PGPASSWORD}"
  encoding: utf8
"""

[[addons]]
type = "postgres"

[run]
# First boot runs the full schema migration before serving.
start-timeout = 300

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["ruby", "rails", "nix", "postgres"]

[[test.validations]]
path = "/login"
status = 200
contains = "Redmine"
