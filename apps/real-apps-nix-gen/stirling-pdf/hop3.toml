# hop3.toml - Hop3 configuration for Stirling-PDF (nix-gen)
# Local web PDF toolkit — compiled FROM SOURCE with java-gradle: Gradle builds
# the jar offline (deps pinned by deps.json), run with `java -jar`. Not wrapped
# from nixpkgs, not a prebuilt dist.

[metadata]
id = "stirling-pdf"
# Version nixpkgs-24.11 packages; its deps.json lockfile + build-timestamp
# patch are reused here (committed alongside this recipe).
version = "0.33.1"
description = "Local web PDF toolkit"

[build]
builder = "nix"

[nix]
template = "java-gradle"
url = "https://github.com/Stirling-Tools/Stirling-PDF/archive/refs/tags/v${version}.tar.gz"
sha256 = "krXPvvP0b4G2CEJM7BwRDrzOFKBVjTPHr28Fc14MpKg="
archive = "tar-gz"
runtime-package = "jre"
gradle-patches = ["remove-props-file-timestamp.patch"]
# spotless tries to fetch files not in deps.json (and slows the build).
gradle-flags = ["-x", "spotlessApply"]
gradle-jar-glob = "build/libs/Stirling-PDF-*.jar"
gradle-jar-name = "Stirling-PDF.jar"
pre-exec = ['mkdir -p configs customFiles logs pipeline']

[nix.env-exports]
SERVER_PORT = "${PORT:-8080}"
SERVER_ADDRESS = "0.0.0.0"
DOCKER_ENABLE_SECURITY = "false"
SYSTEM_DEFAULTLOCALE = "en-US"

[nix.runtime-env]
SERVER_ADDRESS = "0.0.0.0"
DOCKER_ENABLE_SECURITY = "false"
SYSTEM_DEFAULTLOCALE = "en-US"

[run]
start-timeout = 180

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "spring-boot", "nix"]

[[test.validations]]
path = "/login"
status = 200
contains = "Stirling"
