[test]
name = "nix-stirling-pdf"
category = "nix-app"
tier = "slow"
priority = "P1"
description = "Stirling-PDF web PDF toolkit deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["java", "spring-boot", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/login"
[validations.expect]
status = 200
