[metadata]
id = "wordpress"
version = "6.4.2"
description = "Popular open source content management system"

[nix]
template = "php-app"
url = "https://wordpress.org/wordpress-${version}.tar.gz"
sha256 = "m4KJELf5zs3gwAQPmAhoPe2rhopZFsYN6OzAv6Wzo6c="
archive = "tar-gz"
php-version = "php82"
# `xml` is deliberately absent: the Nix PHP already provides it, and naming
# it again makes every PHP invocation print a module-already-loaded warning
# on STDOUT. Harmless until something reads that stdout, which nextcloud's
# install check does -- it was handed that warning instead of the database
# type and refused a correct install.
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'zip', 'curl', 'mbstring', 'intl', 'exif']
post-install-dirs = ['wp-content/uploads', 'wp-content/plugins', 'wp-content/themes']
extra-paths = ['${php}/bin']
# WordPress writes wp-content/uploads and serves its own wp-config.php; the Nix
# store is read-only, so serve from a writable cwd copy.
needs-writable-dir = true

# Ship the app's own config + headless installer into the tree (they are not in
# the upstream tarball — WordPress bundles no CLI). Reused verbatim, reviewable
# PHP files rather than install logic re-encoded in the recipe. wp-config.php
# reads all settings from getenv() at request time; wp-install.php calls core
# wp_install() from the pre-exec step below.
install-files = ['wp-config.php', 'wp-install.php']

# Headless install (schema + first admin), idempotent + fail-loud. Runs in the
# writable cwd after the tree is materialized and reads the WP_ADMIN_* mapped
# from the injected HOP3_ADMIN_* (ADR 056). PHPBIN is sed-replaced with the php
# store path by the template.
pre-exec = ['PHPBIN/php wp-install.php || exit 1']

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
WP_DEBUG = "false"
WP_TITLE = "WordPress"
# Authentication keys and salts (ADR 046): stable generated secrets, injected
# identically on every redeploy so sessions/nonces survive a redeploy.
AUTH_KEY = { generate = "base64", length = 64 }
SECURE_AUTH_KEY = { generate = "base64", length = 64 }
LOGGED_IN_KEY = { generate = "base64", length = 64 }
NONCE_KEY = { generate = "base64", length = 64 }
AUTH_SALT = { generate = "base64", length = 64 }
SECURE_AUTH_SALT = { generate = "base64", length = 64 }
LOGGED_IN_SALT = { generate = "base64", length = 64 }
NONCE_SALT = { generate = "base64", length = 64 }

# Generated admin credentials (ADR 056): the platform mints the password once,
# stores it encrypted, and injects HOP3_ADMIN_USER/EMAIL/PASSWORD at runtime.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

# Map WordPress's installer inputs (read by wp-install.php) onto the injected
# admin credentials. Interpolated AFTER HOP3_ADMIN_* is injected.
[env.computed]
WP_ADMIN_USER = "${HOP3_ADMIN_USER}"
WP_ADMIN_EMAIL = "${HOP3_ADMIN_EMAIL}"
WP_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

# /wp-login.php serves 200 only once WordPress is installed; before install it
# 302s to the wizard. A passing healthcheck therefore proves the headless
# install completed, not just that PHP is up.
[healthcheck]
path = "/wp-login.php"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "wordpress", "nix", "cms"]

# Installed + working, not sitting on the wizard: the home page renders the
# default "Hello world!" post (schema + seed content), and the login page serves
# the real form (before install it would redirect to /wp-admin/install.php).
[[test.validations]]
path = "/"
status = 200
contains = "Hello world"

[[test.validations]]
path = "/wp-login.php"
status = 200
contains = "user_login"
