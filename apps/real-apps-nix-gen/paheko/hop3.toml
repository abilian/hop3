[metadata]
id = "paheko"
version = "1.3.15"
description = "Nonprofit accounting and association management"

[nix]
template = "php-app"
url = "https://codeload.github.com/paheko/paheko/tar.gz/refs/tags/${version}"
sha256 = "sha256-D83byx+kmeDvKwiGIMN0lIx25Jp+vR0Mfmk1jCx+Nzw="
archive = "tar-gz"
php-version = "php82"
web-root = "src/www"
php-extensions = ['sqlite3', 'gd', 'mbstring', 'xml', 'curl', 'zip', 'intl']
needs-composer = false
extra-paths = ['${php}/bin']

[[nix.config-files]]
path = "src/config.local.php"
format = "raw"
create-if-missing = true
raw-content = """
<?php
const DATA_ROOT = __DIR__ . '/../data';
const DB_FILE = DATA_ROOT . '/paheko.sqlite';
const SECRET_KEY = '__SECRET_KEY__';
"""

# Hop3 Configuration for Paheko (Nix build)

[build]
builder = "nix"

[run]
start-timeout = 60

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "nix", "sqlite", "nonprofit"]

[[test.validations]]
path = "/admin/install.php"
status = 200
contains = "Paheko"
