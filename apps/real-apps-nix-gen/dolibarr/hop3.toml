[metadata]
id = "dolibarr"
version = "19.0.3"
description = "Open source ERP and CRM for small and medium businesses"

[nix]
template = "php-app"
# Writes inside its own install directory (config file, cache, data),
# which a read-only store path cannot support.
needs-writable-dir = true
url = "https://github.com/Dolibarr/dolibarr/archive/refs/tags/${version}.tar.gz"
sha256 = "UvzqWjVPhoj6Moq/+qGWv5BW9UUWTNf+iC0bt95lQWM="
archive = "tar-gz"
php-version = "php82"
web-root = "htdocs"
# `xml` is deliberately absent: the Nix PHP already provides it, and naming
# it again makes every PHP invocation print a module-already-loaded warning
# on STDOUT. Harmless until something reads that stdout, which nextcloud's
# install check does -- it was handed that warning instead of the database
# type and refused a correct install.
php-extensions = ['pgsql', 'pdo_pgsql', 'gd', 'mbstring', 'curl', 'zip', 'intl', 'calendar', 'imap', 'ldap']
# Upstream ships `composer.json.disabled` and vendors its dependencies in-tree
# under htdocs/includes/, so there is no composer step. This was previously
# `true`, and the template's `composer install ... || true` swallowed the
# resulting "could not find a composer.json" on every build.
needs-composer = false
post-install-dirs = ['documents']
extra-paths = ['${php}/bin']

[nix.runtime-env]
DOLI_ADMIN_LOGIN = "admin"

# Hop3 Configuration for Dolibarr (Nix build)
# Open source ERP and CRM

[build]
builder = "nix"

[[addons]]
type = "postgres"

[env]
DOLI_ADMIN_LOGIN = "admin"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "dolibarr", "nix", "erp", "crm"]

[[test.validations]]
path = "/"
status = 200
contains = "Dolibarr"

# The native bootstrap, ported unchanged.
[run]
before-run = "bash scripts/setup-config.sh"

[admin]
username = "admin"
password = { generate = "password", length = 20 }

[healthcheck]
contains = "Dolibarr"
