# Test definition for Dolibarr built with Nix

[test]
name = "nix-dolibarr"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Dolibarr ERP/CRM built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["php", "dolibarr", "nix", "erp", "crm"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "Dolibarr"
