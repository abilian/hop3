[metadata]
id = "gitea"
version = "1.21.4"
description = "Self-hosted Git service"

[nix]
template = "prebuilt-binary"
url = "https://dl.gitea.io/gitea/${version}/gitea-${version}-linux-amd64"
sha256 = "WKxZM2BGLQAAHisMlMhDoXF6pTFW8Pt30y5+V57jv6s="
executable = true
binary-name = "gitea"
exec-args = ['web']
pre-exec = ['mkdir -p custom/conf data']

[nix.local-vars]
PORT = "${PORT:-8080}"
DB_HOST = "${PGHOST:-localhost}"
DB_PORT = "${PGPORT:-5432}"
DB_NAME = "${PGDATABASE:-gitea}"
DB_USER = "${PGUSER:-gitea}"
DB_PASS = "${PGPASSWORD:-}"

[nix.env-exports]
GITEA_WORK_DIR = "$PWD"

[[nix.config-files]]
path = "custom/conf/app.ini"
format = "ini"
[nix.config-files.sections.server]
HTTP_PORT = "${PORT}"
ROOT_URL = "http://localhost:${PORT}/"
[nix.config-files.sections.database]
DB_TYPE = "postgres"
HOST = "${DB_HOST}:${DB_PORT}"
NAME = "${DB_NAME}"
USER = "${DB_USER}"
PASSWD = "${DB_PASS}"
[nix.config-files.sections.repository]
ROOT = "data/gitea-repositories"
[nix.config-files.sections.log]
MODE = "console"
LEVEL = "Info"
[nix.config-files.sections.security]
INSTALL_LOCK = "true"
SECRET_KEY = "$(head -c 32 /dev/urandom | base64)"

# hop3.toml - Hop3 configuration for Nix-based Gitea
# Self-hosted Git service

[build]
builder = "nix"

[[addons]]
type = "postgres"

[run]
start-timeout = 120
