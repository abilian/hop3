# hop3.toml - Hop3 configuration for Nix-based Keycloak (nix-gen)
#
# Uses the writable-home-at-runtime template feature with two extra
# escape hatches (let-extra + env-exports-raw) to match the working
# hand-crafted variant's shape declaratively:
#
#   1. Lazy-cp ${keycloak}/. into $PWD/.keycloak-home and chmod u+w
#      so Quarkus' first-boot augmentation can rewrite lib/quarkus.
#   2. Exec `.kc.sh-wrapped` directly — nixpkgs' kc.sh is a compiled
#      Go wrapper (via makeBinaryWrapper) that hardcodes a path back
#      into the read-only nix store. Bypass it so DIRNAME resolves
#      from inside the writable copy.
#   3. Set JAVA_HOME ourselves (the Go wrapper is what normally does
#      it; without it, .kc.sh-wrapped falls back to `java` on PATH).

[metadata]
id = "keycloak"
# From the pinned nixpkgs (keycloak); not the native recipe's version,
# which differs. Re-read it with `nix eval` when the pin moves.
version = "26.1.4"
description = "Enterprise SSO / OIDC / SAML identity and access management"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "keycloak"
# Exec the raw upstream shell script, not the compiled Go wrapper.
exec-target = ".kc.sh-wrapped"
exec-args = [
    'start-dev',
    '--http-host=0.0.0.0',
    '--http-port=${PORT}',
]
writable-home-at-runtime = true
writable-home-env-var = "KC_HOME_DIR"
extra-paths = ['${pkg}/bin']

# Pull a JDK into the let-block. Zulu 21 matches what nixpkgs.keycloak
# itself ships (hand-crafted reference in apps/real-apps-nix/keycloak/
# uses the same).
[nix.let-extra]
jdk = "pkgs.zulu21"

# Raw env exports (no nix_escape) so ${jdk} interpolates at Nix
# build time into the actual JDK store path.
[nix.env-exports-raw]
JAVA_HOME = "${jdk}"

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
KC_DB = "postgres"

[nix.env-exports]
KC_DB_URL = "jdbc:postgresql://${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-keycloak}"
KC_DB_USERNAME = "${PGUSER:-keycloak}"
KC_DB_PASSWORD = "${PGPASSWORD:-}"
# Keycloak reads these at first start to create the bootstrap admin. They must
# be the credential Hop3 generated and advertises — a literal 'changeme' here
# meant the deployed realm had a publicly known administrator while the operator
# was handed a password that did not work. No default: if the injection is
# missing, refuse to start rather than create a public admin.
KC_BOOTSTRAP_ADMIN_USERNAME = "${HOP3_ADMIN_USER:?keycloak: HOP3_ADMIN_USER not injected}"
KC_BOOTSTRAP_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD:?keycloak: HOP3_ADMIN_PASSWORD not injected — refusing to create an admin with a default password}"
# Keycloak builds its OIDC issuer, redirect URIs and admin-console asset paths
# from the address it believes it is served on. Behind Hop3's nginx it sees
# `http://0.0.0.0:<port>`, so the console's own sign-in redirect pointed at an
# origin no visitor can reach: the page loaded and never rendered a form, while
# `/realms/master` — which needs none of this — answered 200.
KC_HOSTNAME = "${HOP3_PUBLIC_URL:-http://localhost:${PORT:-8080}}"
# Trust the proxy's X-Forwarded-* so the scheme is https, not the http Keycloak
# is actually listening on. Without it the console redirects to http:// and the
# browser is bounced back by HSTS.
KC_PROXY_HEADERS = "xforwarded"

[[addons]]
type = "postgres"

[run]
# First deploy: ~200 MB cp into $PWD/.keycloak-home + Quarkus
# augmentation + schema migrations + master-realm provisioning.
# 7 minutes is generous.
start-timeout = 420

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["java", "jvm", "nix", "nixpkgs-wrapper", "postgres", "sso"]

[[test.validations]]
path = "/realms/master"
status = 200
contains = "master"

[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
bin/kcadm.sh config credentials --server http://localhost:${PORT:-8080} \
  --realm master --user "$HOP3_ADMIN_USER" --password "$HOP3_ADMIN_PASSWORD"
if ! bin/kcadm.sh get users -r master -q username="$HOP3_PROBE_USER" 2>/dev/null | grep -q "$HOP3_PROBE_USER"; then
  bin/kcadm.sh create users -r master -s username="$HOP3_PROBE_USER" \
    -s email="$HOP3_PROBE_EMAIL" -s enabled=true
  bin/kcadm.sh set-password -r master --username "$HOP3_PROBE_USER" \
    --new-password "$HOP3_PROBE_PASSWORD"
fi
bin/kcadm.sh get users -r master -q username="$HOP3_PROBE_USER" 2>/dev/null | grep -q "$HOP3_PROBE_USER" || {
  echo "Keycloak probe user missing after create" >&2
  exit 1
}
'''

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Map the injected admin creds onto the env vars Keycloak 26 reads at first
# start to create the temporary admin (KC_BOOTSTRAP_ADMIN_*). Interpolated
# after the admin creds are injected, so no literal secret lives in [env].
