[test]
name = "nix-gatus"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Gatus deployed via Nix (template)"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix", "sqlite", "monitoring"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/health"
[validations.expect]
status = 200
