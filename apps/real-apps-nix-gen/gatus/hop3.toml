# hop3.toml - Hop3 configuration for Gatus (nix-gen)
# Status pages / health-check monitoring — compiled FROM SOURCE with
# buildGoModule (go-source), not wrapped from nixpkgs.

[metadata]
id = "gatus"
# Pinned to the version nixpkgs-24.11 packages (Go-1.23-buildable). A newer
# gatus needs a per-app nixpkgs bump.
version = "5.13.0"
description = "Status pages and health-check monitoring"

[build]
builder = "nix"

[nix]
template = "go-source"
url = "https://github.com/TwiN/gatus/archive/refs/tags/v${version}.tar.gz"
sha256 = "4+AJp9EbiD8bPQxCl0NguMldxY3u2kHIJe2BUoJ0jHM="
archive = "tar-gz"
exec-target = "gatus"
go-vendor-hash = "sha256-pM47Jy7WIS8+3mFEmPZdnyxcDjoxgdP46xuTmf4p2JM="
pre-exec = ['mkdir -p config data']

[[nix.config-files]]
path = "config/config.yaml"
format = "raw"
raw-content = """
storage:
  type: sqlite
  path: data/gatus.db

web:
  address: 0.0.0.0
  port: ${PORT:-8080}

endpoints:
  - name: self
    url: http://localhost:${PORT:-8080}/health
    interval: 60s
    conditions:
      - \"[STATUS] == 200\"
"""

[run]
start-timeout = 60

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "sqlite", "monitoring"]

[[test.validations]]
path = "/health"
status = 200
contains = "status"
