# Test definition for Easy!Appointments built with Nix

[test]
name = "nix-easy-appointments"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Easy!Appointments scheduling app built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["mysql", "nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "easy-appointments", "nix", "scheduling"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "config"
