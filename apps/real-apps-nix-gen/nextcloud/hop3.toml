[metadata]
id = "nextcloud"
version = "28.0.2"
description = "Self-hosted productivity platform"

[nix]
template = "php-app"
needs-writable-dir = true
url = "https://download.nextcloud.com/server/releases/nextcloud-${version}.tar.bz2"
sha256 = "3jTWuvPszqz90TjoVSDNheHSzmeY2f+keKwX6x76HQg="
archive = "tar-bz2"
php-version = "php82"
# `xml` is deliberately absent: the Nix PHP already provides it, and naming
# it again makes every PHP invocation print a module-already-loaded warning
# on STDOUT. Harmless until something reads that stdout, which nextcloud's
# install check does -- it was handed that warning instead of the database
# type and refused a correct install.
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'mbstring', 'curl', 'zip', 'intl', 'bcmath', 'gmp', 'exif', 'apcu', 'opcache', 'fileinfo']
post-install-dirs = ['data', 'config']
extra-paths = ['${php}/bin']

# Headless install via Nextcloud's own occ CLI, run OUT OF BAND before the HTTP
# worker starts. The previous browser-triggered config/autoconfig.php installed
# on the first web request, which under single-threaded `php -S` deadlocked on
# Nextcloud's own internal sub-requests — so /status.php never became ready.
# occ is a plain CLI, so the install completes without any loopback request.
# Idempotent (guarded on config/config.php, which occ writes on success) and
# fail-loud (a non-zero occ exit aborts the wrapper, so a broken install can't
# masquerade as a running app). Admin comes from the injected HOP3_ADMIN_*
# (ADR 056); the data dir MUST be absolute (a relative one 503s every request).
pre-exec = ["if [ ! -f config/config.php ]; then PHPBIN/php occ maintenance:install --database mysql --database-name \"$MYSQL_DATABASE\" --database-host \"$MYSQL_HOST:$MYSQL_PORT\" --database-user \"$MYSQL_USER\" --database-pass \"$MYSQL_PASSWORD\" --admin-user \"$HOP3_ADMIN_USER\" --admin-pass \"$HOP3_ADMIN_PASSWORD\" --data-dir \"$PWD/data\" || { echo 'nextcloud occ maintenance:install failed' >&2; exit 1; }; fi"]

[build]
builder = "nix"

[[addons]]
type = "mysql"

# Generated admin credentials (ADR 056): the platform mints the password once,
# stores it encrypted, and injects HOP3_ADMIN_USER/EMAIL/PASSWORD at runtime —
# the occ install above consumes them.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "nextcloud", "nix", "file-sharing", "collaboration"]

# /status.php reports the real install state as JSON. `"installed":true` proves
# the occ install completed — before it, Nextcloud reports `"installed":false`,
# so a bare `contains = "installed"` would pass on an *un*installed instance.
[[test.validations]]
path = "/status.php"
status = 200
contains = '"installed":true'

# The native bootstrap, ported unchanged.
[run]
before-run = "bash scripts/setup-config.sh"

# The app reads these at first start; map the generated credential on.
[env.computed]
NEXTCLOUD_ADMIN_USER = "${HOP3_ADMIN_USER}"
NEXTCLOUD_ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"

[probe]
username = "hop3probe"
create = '''
if ! php occ user:list --output=json | grep -q "\"$HOP3_PROBE_USER\""; then
  OC_PASS="$HOP3_PROBE_PASSWORD" php occ user:add --password-from-env \
    --display-name="Hop3 probe" "$HOP3_PROBE_USER"
fi
php occ user:list --output=json | grep -q "\"$HOP3_PROBE_USER\"" || {
  echo "Nextcloud probe account missing after user:add" >&2
  exit 1
}
'''
