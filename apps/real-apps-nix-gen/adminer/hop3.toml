[metadata]
id = "adminer"
version = "4.8.1"
description = "Database management in a single PHP file"

[nix]
template = "php-app"
url = "https://github.com/vrana/adminer/releases/download/v${version}/adminer-${version}.php"
sha256 = "L9fm2PmHskOrGDkklVH2KtzhlwTEfT0MjdnlfqW5xrM="
php-version = "php82"
php-extensions = ['mysqli', 'pgsql', 'pdo_mysql', 'pdo_pgsql', 'pdo_sqlite']
single-file = true
extra-paths = ['${php}/bin']

# Hop3 Configuration for Adminer (Nix build)
# Single-file database management tool

[build]
builder = "nix"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "adminer", "nix", "database"]

[[test.validations]]
path = "/"
status = 200
contains = "Adminer"
