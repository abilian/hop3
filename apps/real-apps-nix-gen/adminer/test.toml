# Test definition for Adminer built with Nix

[test]
name = "nix-adminer"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Adminer database management tool built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "adminer", "nix", "database"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
