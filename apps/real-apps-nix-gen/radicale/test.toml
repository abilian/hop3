# Test definition for Radicale built with Nix

[test]
name = "nix-radicale"
category = "nix-app"
tier = "medium"
priority = "P2"
description = "Radicale CalDAV/CardDAV server deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["python", "radicale", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/.web/"
[validations.expect]
status = 200
