# hop3.toml - Hop3 configuration for Radicale (nix-gen)
# Simple CalDAV/CardDAV server — installed FROM SOURCE with python-venv: a
# hash-pinned requirements.txt is vendored by a fixed-output derivation and the
# venv is built offline in the sandbox (not wrapped from nixpkgs).

[metadata]
id = "radicale"
version = "3.7.7"
description = "A simple CalDAV and CardDAV server"

[build]
builder = "nix"

[nix]
template = "python-venv"
pip-requirements = "requirements.txt"
pip-deps-hash = "sha256-gZagzX91IQTJGmozvm1W787gazDr+ocDooW4RbQPmTo="
pip-packages = ['radicale[bcrypt]']
runtime-package = "python3"
exec-target = "radicale"
exec-args = ['--config', 'config']
extra-paths = ['$out/venv/bin']
pre-exec = ['mkdir -p collections']

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
RADICALE_AUTH_TYPE = "none"

[[nix.config-files]]
path = "config"
format = "raw"
create-if-missing = true
raw-content = """
[server]
hosts = 0.0.0.0:${PORT}

[auth]
type = ${RADICALE_AUTH_TYPE:-none}

[storage]
filesystem_folder = collections
"""

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "radicale", "nix"]

[[test.validations]]
path = "/.web/"
status = 200
contains = "Radicale"
