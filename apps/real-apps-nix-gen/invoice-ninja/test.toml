# Test definition for Invoice Ninja built with Nix

[test]
name = "nix-invoice-ninja"
category = "nix-app"
tier = "medium"
priority = "P2"  # Known: returns 500 without app-specific config
description = "Invoice Ninja invoicing platform built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["mysql", "nix"]

[test.metadata]
author = "hop3-team"
covers = ["php", "invoice-ninja", "nix", "invoicing", "laravel"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 302
