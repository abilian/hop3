[metadata]
id = "invoice-ninja"
version = "5.8.37"
description = "Free open-source invoicing platform"

[nix]
composer-deps-hash = "sha256-IoNfYWq/Ocu2P50U65uWWQR2I4/BuZ/CoOrfDCAM8B8="
template = "php-app"
needs-writable-dir = true
# Headless setup, fail-loud (set -e), so Invoice Ninja no longer lands on its
# /setup wizard: migrate the schema, then once (marker-guarded, since the seeder
# and account creation are not idempotent) seed the reference data and create the
# first account/admin from the injected HOP3_ADMIN_* (ADR 056). `ninja:create-account`
# is Invoice Ninja's own headless account command.
pre-exec = [
  "PHPBIN/php artisan migrate --force",
  "if [ ! -f .hop3-account ]; then PHPBIN/php artisan db:seed --force; PHPBIN/php artisan ninja:create-account --email=\"$HOP3_ADMIN_EMAIL\" --password=\"$HOP3_ADMIN_PASSWORD\"; touch .hop3-account; fi",
]
serve-mode = "artisan"
url = "https://github.com/invoiceninja/invoiceninja/archive/refs/tags/v${version}.tar.gz"
sha256 = "7NZs3hAxH3awKMeIlwqem6gnVCRGdpDvZZ+7SW033qY="
archive = "tar-gz"
php-version = "php82"
# `xml` is deliberately absent: the Nix PHP already provides it, and naming
# it again makes every PHP invocation print a module-already-loaded warning
# on STDOUT. Harmless until something reads that stdout, which nextcloud's
# install check does -- it was handed that warning instead of the database
# type and refused a correct install.
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'mbstring', 'curl', 'zip', 'bcmath', 'intl', 'soap', 'fileinfo', 'tokenizer']
needs-composer = true
# Upstream composer.json fails composer's strict `validate` (benign for a
# packaged release); skip it explicitly so buildComposerProject proceeds.
composer-strict-validation = false
composer-extra-flags = ['--ignore-platform-reqs']
post-install-dirs = ['storage/app', 'storage/framework/cache', 'storage/framework/sessions', 'storage/framework/views', 'storage/logs', 'bootstrap/cache', 'public/storage']
extra-native-build-inputs = ['pkgs.nodejs']
extra-paths = ['${php}/bin']

[nix.runtime-env]
APP_ENV = "production"
APP_DEBUG = "false"

# Hop3 Configuration for Invoice Ninja (Nix build)
# Invoicing and billing platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

# Generated admin credentials (ADR 056), consumed by ninja:create-account.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

[env]
APP_KEY = "base64:YY6Y7MPsG9s105LprP4KohEbjGwQ8sUG7iYIoJs1t4Y="
APP_ENV = "production"
APP_DEBUG = "false"

[env.computed]
DB_CONNECTION = "mysql"
DB_HOST = "${MYSQL_HOST}"
DB_PORT = "${MYSQL_PORT}"
DB_DATABASE = "${MYSQL_DATABASE}"
DB_USERNAME = "${MYSQL_USER}"
DB_PASSWORD = "${MYSQL_PASSWORD}"

[[nix.config-files]]
path = ".env"
format = "raw"
raw-content = """
APP_ENV=${APP_ENV:-production}
APP_DEBUG=${APP_DEBUG:-false}
APP_KEY=${APP_KEY}
APP_URL=http://localhost:${PORT:-8080}
DB_CONNECTION=mysql
DB_HOST=${DB_HOST:-127.0.0.1}
DB_PORT=${DB_PORT:-3306}
DB_DATABASE=${DB_DATABASE:-invoiceninja}
DB_USERNAME=${DB_USERNAME:-invoiceninja}
DB_PASSWORD=${DB_PASSWORD:-}
"""

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "invoice-ninja", "nix", "invoicing", "laravel"]

# `/` is a server-side 302 with an EMPTY body (the harness can't assert a
# Location header and doesn't follow redirects), so validate the login SPA
# directly: once setup completed, /login serves the Flutter app (200) whose HTML
# carries the "Invoice Ninja" title. The fail-loud setup pre-exec above is the
# real install gate; this content check proves the app serves its own page, not
# a placeholder. (If the box shows /login is not 200 / lacks this marker, the
# failure output pins the exact status+body to adjust to.)
[[test.validations]]
path = "/login"
status = 200
contains = "Invoice Ninja"
