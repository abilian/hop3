[metadata]
id = "invoice-ninja"
version = "5.8.37"
description = "Free open-source invoicing platform"

[nix]
template = "php-app"
needs-writable-dir = true
serve-mode = "artisan"
url = "https://github.com/invoiceninja/invoiceninja/archive/refs/tags/v${version}.tar.gz"
sha256 = "7NZs3hAxH3awKMeIlwqem6gnVCRGdpDvZZ+7SW033qY="
archive = "tar-gz"
php-version = "php82"
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'mbstring', 'xml', 'curl', 'zip', 'bcmath', 'intl', 'soap', 'fileinfo', 'tokenizer']
needs-composer = true
composer-extra-flags = ['--ignore-platform-reqs']
post-install-dirs = ['storage/app', 'storage/framework/cache', 'storage/framework/sessions', 'storage/framework/views', 'storage/logs', 'bootstrap/cache', 'public/storage']
extra-native-build-inputs = ['pkgs.nodejs']
extra-paths = ['${php}/bin']

[nix.runtime-env]
APP_ENV = "production"
APP_DEBUG = "false"

# Hop3 Configuration for Invoice Ninja (Nix build)
# Invoicing and billing platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
APP_KEY = "base64:dGhpc2lzYXRlc3RrZXlmb3Job3AzZGV2c2VydmVyMQ=="
APP_ENV = "production"
APP_DEBUG = "false"

[env.computed]
DB_CONNECTION = "mysql"
DB_HOST = "${MYSQL_HOST}"
DB_PORT = "${MYSQL_PORT}"
DB_DATABASE = "${MYSQL_DATABASE}"
DB_USERNAME = "${MYSQL_USER}"
DB_PASSWORD = "${MYSQL_PASSWORD}"

[[nix.config-files]]
path = ".env"
format = "raw"
raw-content = """
APP_ENV=${APP_ENV:-production}
APP_DEBUG=${APP_DEBUG:-false}
APP_KEY=${APP_KEY}
APP_URL=http://localhost:${PORT:-8080}
DB_CONNECTION=mysql
DB_HOST=${DB_HOST:-127.0.0.1}
DB_PORT=${DB_PORT:-3306}
DB_DATABASE=${DB_DATABASE:-invoiceninja}
DB_USERNAME=${DB_USERNAME:-invoiceninja}
DB_PASSWORD=${DB_PASSWORD:-}
"""
