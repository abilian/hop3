# hop3.toml - Hop3 configuration for Nix-based Bugsink (template variant)
# Self-hosted error tracking, Sentry SDK-compatible.

[metadata]
id = "bugsink"
version = "2.1.2"
description = "Self-hosted error tracking, Sentry SDK-compatible"

[build]
builder = "nix"

[nix]
pip-deps-hash = "sha256-TkO55z60uSwG1dif67DVRcjDv3QuTKP7bAzF9SvRcMk="
pip-requirements = "requirements.txt"
template = "python-venv"
runtime-package = "python3"
exec-target = "gunicorn"
exec-args = [
    'bugsink.wsgi:application',
    '--bind', '0.0.0.0:${PORT:-8080}',
    '--pythonpath', '.',
    '--access-logfile', '-',
    '--error-logfile', '-',
]
# Pure-Python psycopg v3 (not psycopg2-binary). The binary wheels bake
# a hash-pinned libkrb5 reference (`libkrb5-fcafa220.so.3.3`) that's
# absent from the Nix-built Python venv; the pure-Python build loads
# libpq.so.5 / libkrb5 / libstdc++.so.6 dynamically at runtime via the
# LD_LIBRARY_PATH emitted below from nix-runtime-libs.
extra-paths = ['$out/venv/bin']

# DEFERRED-APPS blocker #2 resolution: the python-venv template now
# emits `export LD_LIBRARY_PATH="${pkgs.X.lib}/lib:..."` with raw Nix
# interpolation, bypassing nix_escape so the store paths resolve at
# build time. Replaces the hand-crafted-wrapper workaround previously
# living in apps/real-apps-nix/bugsink/hop3.nix.
nix-runtime-libs = [
    "postgresql.lib",  # libpq.so.5 — psycopg client
    "krb5.lib",        # libkrb5 — psycopg transitive (GSSAPI)
    "stdenv.cc.cc.lib", # libstdc++.so.6 — sentry-sdk transitive
]


[nix.env-exports]
# NOT `$(head -c 32 /dev/urandom | base64)`. The wrapper re-evaluates its exports
# on every start, so that minted a new Django SECRET_KEY each restart and
# invalidated every session. It comes from [env] below, generated once.
SECRET_KEY = "${SECRET_KEY:?bugsink: SECRET_KEY not injected}"
# Bugsink builds each project's Sentry ingest DSN from BASE_URL, so it must be
# the public host — an SDK cannot report to `localhost`.
BASE_URL = "${HOP3_PUBLIC_URL:-http://localhost:${PORT:-8080}}"

# The same script the native variant runs, byte-identical: it generates
# bugsink_conf.py, migrates BOTH databases, and creates the admin. It works here
# because a Nix app's before-run now gets the app's own directory as its cwd and
# the venv's bin on PATH.
[run]
before-run = "bash scripts/setup.sh"
start-timeout = 180

# Bugsink is two processes. Its background queue ("snappea") lives in a separate
# database and is drained by this worker; without it the app signs in and then
# 500s on the first task path — the "serves a login page but does not work"
# failure the smoke test exists to catch.
[run.workers]
snappea = "bugsink-runsnappea"

# Generated once and re-injected unchanged (ADR 046). bugsink_conf.py lives
# under src/, which a redeploy wipes and regenerates, so the key must come from
# outside or it rotates with the tree.
[env]
SECRET_KEY = { generate = "urlsafe" }

# DATABASE_URL belongs in the APP's env, not in [nix.env-exports]. Those are
# shell exports inside the generated wrapper, so only the app process ever sees
# them — and [probe].create runs `bugsink-manage` directly, which then had the
# PG* parts but not the composed URL and died building a connection. Resolved
# here at deploy time, it reaches the wrapper, before-run and create alike.
[env.computed]
DATABASE_URL = "postgresql://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}"

[[addons]]
type = "postgres"


[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "django", "nix", "postgres"]

[[test.validations]]
path = "/accounts/login/"
status = 200
contains = "Bugsink"

[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
bugsink-manage shell -c "
import os
from django.contrib.auth import get_user_model
User = get_user_model()
username = os.environ['HOP3_PROBE_USER']
if not User.objects.filter(username=username).exists():
    User.objects.create_user(
        username=username,
        email=os.environ.get('HOP3_PROBE_EMAIL', ''),
        password=os.environ['HOP3_PROBE_PASSWORD'],
    )
    print('probe user created')
"
'''

[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
