# hop3.toml - Hop3 configuration for Nix-based Listmonk
# Self-hosted newsletter and mailing list manager — built via nixpkgs.

[metadata]
id = "listmonk"
description = "Self-hosted newsletter and mailing list manager"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "listmonk"
exec-target = "listmonk"
exec-args = ['--config', 'config.toml']
extra-paths = ['${listmonk}/bin']
pre-exec = [
    # First-run bootstrap: install schema into the per-app Postgres
    # database. Uses PKGBIN (sed-replaced at Nix build time with
    # ${listmonk}/bin) — NOT a literal shell ${listmonk}, which would
    # be an unset variable at runtime and silently no-op. Idempotent
    # thanks to --yes and the || true guard on subsequent deploys.
    'PKGBIN/listmonk --install --yes --config config.toml 2>/dev/null || true',
]

[nix.local-vars]
PORT = "${PORT:-8080}"
DB_HOST = "${PGHOST:-localhost}"
DB_PORT = "${PGPORT:-5432}"
DB_NAME = "${PGDATABASE:-listmonk}"
DB_USER = "${PGUSER:-listmonk}"
DB_PASS = "${PGPASSWORD:-}"

[[nix.config-files]]
path = "config.toml"
format = "raw"
raw-content = """
[app]
address = "0.0.0.0:${PORT}"
admin_username = "admin"
admin_password = "changeme"

[db]
host = "${DB_HOST}"
port = ${DB_PORT}
user = "${DB_USER}"
password = "${DB_PASS}"
database = "${DB_NAME}"
ssl_mode = "disable"
max_open = 25
max_idle = 25
max_lifetime = "300s"
"""

[[addons]]
type = "postgres"

[run]
start-timeout = 60
