[test]
name = "nix-listmonk"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "Listmonk newsletter manager deployed via nixpkgs-wrapper template"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix", "nixpkgs-wrapper", "postgres"]

[deployment]
path = "."
type = "nix"

# Root path serves the admin login UI (public, no auth required).
# /api/health on listmonk is auth-gated and returns 401 for unauth'd
# requests — not usable as a liveness probe without credentials.
[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
contains = "listmonk"
