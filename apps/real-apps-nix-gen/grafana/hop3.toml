# hop3.toml - Hop3 configuration for Nix-based Grafana
# Observability platform — built from source via nixpkgs
# Uses PostgreSQL for production durability and concurrent access.

[metadata]
id = "grafana"
description = "The open and composable observability and data visualization platform"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "grafana"
exec-target = "grafana"
# --homepath uses $GRAFANA_HOMEPATH (set via runtime-env below).
# This is a shell variable, expanded at runtime, not a Nix placeholder.
exec-args = ['server', '--homepath', '"$GRAFANA_HOMEPATH"', '--config', '"$PWD/conf/custom.ini"']
extra-paths = ['${grafana}/bin']
pre-exec = ['mkdir -p data logs conf/provisioning/datasources conf/provisioning/dashboards']

[nix.local-vars]
PORT = "${PORT:-8080}"
DB_HOST = "${PGHOST:-localhost}"
DB_PORT = "${PGPORT:-5432}"
DB_NAME = "${PGDATABASE:-grafana}"
DB_USER = "${PGUSER:-grafana}"
DB_PASS = "${PGPASSWORD:-}"

[nix.env-exports]
GF_SERVER_HTTP_PORT = "${PORT}"
GF_PATHS_DATA = "$PWD/data"
GF_PATHS_LOGS = "$PWD/logs"
GF_PATHS_PROVISIONING = "$PWD/conf/provisioning"

[nix.runtime-env]
GF_SECURITY_ADMIN_USER = "admin"
GF_PATHS_DATA = "./data"
GF_PATHS_LOGS = "./logs"
# GRAFANA_HOMEPATH is a custom env var read by the wrapper script
# (passed to grafana via --homepath). It uses Nix interpolation
# (${grafana}) — expanded at install time because runtime-env values
# are written into runtime.json inside the Nix '' string of the
# installPhase. spawn.py exports this env var at runtime.
GRAFANA_HOMEPATH = "${grafana}/share/grafana"

[[nix.config-files]]
path = "conf/custom.ini"
format = "ini"
create-if-missing = true
[nix.config-files.sections.server]
http_port = "${PORT}"
[nix.config-files.sections.paths]
data = "data"
logs = "logs"
[nix.config-files.sections.database]
type = "postgres"
host = "${DB_HOST}:${DB_PORT}"
name = "${DB_NAME}"
user = "${DB_USER}"
password = "${DB_PASS}"
ssl_mode = "disable"
[nix.config-files.sections.security]
admin_user = "${GF_SECURITY_ADMIN_USER:-admin}"

[[addons]]
type = "postgres"

[run]
start-timeout = 120

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix"]

[[test.validations]]
path = "/api/health"
status = 200
