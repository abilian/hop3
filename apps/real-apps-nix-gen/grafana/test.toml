[test]
name = "nix-grafana"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "Grafana observability platform deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/api/health"
[validations.expect]
status = 200
