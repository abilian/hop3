# hop3.toml - Hop3 configuration for Nix-based Directus (nix-gen)
#
# Uses the node-pnpm-install template (shipped 2026-04-22, closes
# platform gap #4). Previously this app lived at
# apps/real-apps-nix/directus/ as a hand-crafted hop3.nix because
# the nix-gen layer didn't have a pnpm template; that file is now
# redundant and should be dropped.
#
# Why pnpm: Directus 11's prebuilt code imports
#   @sinclair/typebox via `import { Type } from '.../typebox...'`
# which only resolves against pnpm's content-addressed
# node_modules/.pnpm/<pkg>@<ver>/ layout. `npm install` produces a
# flat tree that breaks the named-export-from-CJS resolution.

[metadata]
id = "directus"
version = "11.17.2"
description = "Open-source headless CMS"

[build]
builder = "nix"

[nix]
template = "node-pnpm-install"
# Reuses nixpkgs-package as the npm package name (semantically
# distinct but no reason to add another field).
nixpkgs-package = "directus"
# Binary under node_modules/.bin/ — launched from the wrapper with
# Node 22 on PATH.
exec-target = "directus"
exec-args = ["start"]
runtime-package = "nodejs_22"
# Additional npm packages alongside `directus`. Reuses the generic
# `pip-packages` slot (language-agnostic extras list).
pip-packages = ["pg@^8.11.0"]

# Symlink the built tree into the wrapper's writable cwd so directus
# finds node_modules/ at the expected relative path. Must happen
# before the bootstrap step below (which writes migration state into
# data/).
#
# Use `$APPDIR` (exported by the wrapper) rather than `$out` — the
# latter is only defined inside the Nix build sandbox and expands to
# empty at wrapper runtime, silently producing broken `/app/...`
# paths.
pre-exec = [
  "ln -sfn $APPDIR/node_modules ./node_modules",
  "ln -sfn $APPDIR/package.json ./package.json",
  "mkdir -p data",
  "$APPDIR/node_modules/.bin/directus bootstrap",
]

[nix.env-exports]
DB_CLIENT = "${DB_CLIENT:-pg}"
DB_HOST = "${PGHOST}"
DB_PORT = "${PGPORT:-5432}"
DB_DATABASE = "${PGDATABASE}"
DB_USER = "${PGUSER}"
DB_PASSWORD = "${PGPASSWORD}"
HOST = "0.0.0.0"
PORT = "${PORT:-8055}"
PUBLIC_URL = "${PUBLIC_URL:-http://localhost:${PORT}}"
KEY = "${KEY:-$(head -c 32 /dev/urandom | base64)}"
SECRET = "${SECRET:-$(head -c 32 /dev/urandom | base64)}"
ADMIN_EMAIL = "${ADMIN_EMAIL:-admin@example.com}"
ADMIN_PASSWORD = "${ADMIN_PASSWORD:-$(head -c 16 /dev/urandom | base64)}"

[[addons]]
type = "postgres"

[run]
# `directus bootstrap` runs the full migration set on first deploy
# (hundreds of migrations) in pre-exec before `directus start` begins
# serving; 300s is a safe budget for the combined path.
start-timeout = 300

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "nix", "postgres", "headless-cms", "pnpm"]

[[test.validations]]
path = "/admin/login"
status = 200
