[metadata]
id = "isso"
version = "0.13.1"
description = "A lightweight commenting system, Disqus alternative"

[nix]
pip-deps-hash = "sha256-pB776ewrTH7Q2a3pJ8IFigRmqpc1FlPZt0MRJt75Trc="
pip-requirements = "requirements.txt"
template = "python-venv"
exec-target = "isso"
runtime-package = "python3"
exec-args = ['-c', 'isso-runtime.cfg']
extra-paths = ['$out/venv/bin']
pre-exec = ['mkdir -p data']

[[nix.config-files]]
path = "isso-runtime.cfg"
format = "raw"
raw-content = """
[general]
dbpath = data/comments.db
host = ${HOP3_PUBLIC_URL}

[server]
listen = http://${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}
public-endpoint = ${HOP3_PUBLIC_URL}

# The moderation dashboard at /admin/. Absent, isso serves it disabled: the
# smoke test reported "the admin dashboard is not asking for a password", and
# it was right — there was no dashboard to ask. Isso has no admin username;
# the password IS the credential.
[admin]
enabled = true
password = ${ADMIN_PASSWORD}

# Hold new comments for approval instead of publishing them on submission.
# Without it any anonymous visitor self-publishes — the isso equivalent of open
# registration, and the native recipe closes it for that reason.
[moderation]
enabled = true
"""

# Hop3 Configuration for Isso (Nix build)
# Lightweight commenting system

[build]
builder = "nix"


[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "isso", "nix"]

[[test.validations]]
path = "/"
status = 400
contains = "missing uri query"

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Isso reads its password from the config file above, which the wrapper writes
# at startup by interpolating this variable.
[env.computed]
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"
