[metadata]
id = "isso"
version = "0.13.1"
description = "A lightweight commenting system, Disqus alternative"

[nix]
pip-deps-hash = "sha256-pB776ewrTH7Q2a3pJ8IFigRmqpc1FlPZt0MRJt75Trc="
pip-requirements = "requirements.txt"
template = "python-venv"
exec-target = "isso"
runtime-package = "python3"
exec-args = ['-c', 'isso-runtime.cfg']
extra-paths = ['$out/venv/bin']
pre-exec = ['mkdir -p data']

[[nix.config-files]]
path = "isso-runtime.cfg"
format = "raw"
raw-content = """
[general]
dbpath = data/comments.db
host = http://localhost:${PORT:-8080}

[server]
listen = http://${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}
"""

# Hop3 Configuration for Isso (Nix build)
# Lightweight commenting system

[build]
builder = "nix"

[env]
ISSO_HOST = "http://localhost:8080"

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "isso", "nix"]

[[test.validations]]
path = "/"
status = 400
contains = "missing uri query"
