[metadata]
id = "matomo"
version = "5.0.1"
description = "Open source web analytics platform"

[nix]
template = "php-app"
needs-writable-dir = true
url = "https://builds.matomo.org/matomo-${version}.tar.gz"
sha256 = "4dtIUinaEPtuEaangdlaIsw0xduG4AeUEaIUJ0IJ8Dw="
archive = "tar-gz"
php-version = "php82"
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'mbstring', 'xml', 'curl', 'zip', 'zlib', 'intl']
post-install-dirs = ['tmp']
extra-paths = ['${php}/bin']

# Hop3 Configuration for Matomo (Nix build)
# Web analytics platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
MATOMO_DATABASE_HOST = "${MYSQL_HOST}"

[[nix.config-files]]
path = "config/config.ini.php"
format = "raw"
create-if-missing = true
raw-content = """; <?php exit; ?> DO NOT REMOVE THIS LINE
[database]
host = "${MYSQL_HOST:-127.0.0.1}"
username = "${MYSQL_USER:-matomo}"
password = "${MYSQL_PASSWORD:-}"
dbname = "${MYSQL_DATABASE:-matomo}"
port = ${MYSQL_PORT:-3306}
tables_prefix = "matomo_"

[General]
trusted_hosts[] = "localhost:${PORT:-8080}"
"""

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "matomo", "nix", "analytics"]

[[test.validations]]
path = "/"
status = 200
