[metadata]
id = "matomo"
version = "5.0.1"
description = "Open source web analytics platform"

[nix]
template = "php-app"
needs-writable-dir = true
url = "https://builds.matomo.org/matomo-${version}.tar.gz"
sha256 = "4dtIUinaEPtuEaangdlaIsw0xduG4AeUEaIUJ0IJ8Dw="
archive = "tar-gz"
php-version = "php82"
php-extensions = ['mysqli', 'pdo_mysql', 'gd', 'mbstring', 'xml', 'curl', 'zip', 'zlib', 'intl']
post-install-dirs = ['tmp']
extra-paths = ['${php}/bin']

# Hop3 Configuration for Matomo (Nix build)
# Web analytics platform

[build]
builder = "nix"

[[addons]]
type = "mysql"

[env]
# Matomo derives session and cookie signing from this. Generated once and
# re-injected, because config.ini.php lives under src/ which a redeploy wipes.
MATOMO_SALT = { generate = "urlsafe" }
MATOMO_DATABASE_HOST = "${MYSQL_HOST}"


[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "matomo", "nix", "analytics"]

[[test.validations]]
path = "/"
status = 200
contains = "Matomo"

# The native bootstrap, ported unchanged: it seeds config.ini.php (with the
# stable salt and the real trusted host) and then runs the installer that
# creates the schema, the superuser and the first site. The generated
# config-files block it replaces had no salt at all and trusted only localhost,
# so Matomo answered the smoke test with an error page, not a login form.
# BLOCKED, deliberately left declared so the failure is loud.
#
# `needs-writable-dir` materialises the app's code from the read-only store into
# this directory, but it does so in the generated WRAPPER — which runs when the
# app starts, after before-run. So at before-run time src/ holds only the recipe
# files, and this script dies on `Failed opening required core/bootstrap.php`.
#
# The bootstrap itself is correct and ported unchanged from the native variant.
# What is missing is a platform decision: the writable tree has to be
# materialised at deploy time, before before-run, for any php-app that declares
# needs-writable-dir. Until then this app cannot be installed by the Nix path,
# and it fails at deploy rather than serving an uninstalled Matomo.
[run]
before-run = "bash scripts/setup-config.sh"

[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = "php scripts/install.php --probe-only"

[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
