[test]
name = "nix-miniflux"
category = "nix-app"
tier = "slow"
priority = "P2"
description = "Miniflux RSS reader deployed via Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["golang", "nix", "postgres"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/healthcheck"
[validations.expect]
status = 200
