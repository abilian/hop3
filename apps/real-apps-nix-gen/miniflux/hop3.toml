# hop3.toml - Hop3 configuration for Nix-based Miniflux
# Minimalist RSS reader — built from source via nixpkgs

[metadata]
id = "miniflux"
description = "Minimalist and opinionated RSS reader"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "miniflux"
exec-target = "miniflux"
extra-paths = ['${miniflux}/bin']

[nix.env-exports]
LISTEN_ADDR = "0.0.0.0:${PORT:-8080}"
RUN_MIGRATIONS = "1"
CREATE_ADMIN = "1"
ADMIN_USERNAME = "${ADMIN_USERNAME:-admin}"
ADMIN_PASSWORD = "${ADMIN_PASSWORD:-changeme}"

[[nix.conditional-env]]
name = "DATABASE_URL"
condition-var = "DATABASE_URL"
value = "postgres://${PGUSER:-miniflux}:${PGPASSWORD:-}@${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-miniflux}?sslmode=disable"

[nix.runtime-env]
RUN_MIGRATIONS = "1"
CREATE_ADMIN = "1"
ADMIN_USERNAME = "admin"
ADMIN_PASSWORD = "changeme"

[[addons]]
type = "postgres"
