# hop3.toml - Hop3 configuration for Miniflux (nix-gen)
# Minimalist RSS reader — compiled FROM SOURCE with buildGoModule (go-source),
# not wrapped from nixpkgs: go.sum + vendorHash pin the module set and the
# compile runs offline in the sandbox, so the build is hermetic and Tier-1
# reproducible.

[metadata]
id = "miniflux"
# Pinned to the version nixpkgs-24.11 packages: building from source ties the
# app to the pinned nixpkgs' Go toolchain (1.23), and 2.2.8's go.mod is
# Go-1.23-compatible. A newer miniflux (2.3+ wants Go ≥ 1.26) needs a per-app
# nixpkgs bump (`nixpkgs-rev`/`nixpkgs-sha256`), not available in 24.11.
version = "2.2.8"
description = "Minimalist and opinionated RSS reader"

[build]
builder = "nix"

[nix]
template = "go-source"
url = "https://github.com/miniflux/v2/archive/refs/tags/${version}.tar.gz"
sha256 = "HDYAEsPdAgJgHbJnVcURlptsUn+W1oKYYadAlWM6NcI="
archive = "tar-gz"
# buildGoModule names the binary after the module path element before the
# `/vN` suffix: miniflux's module is `miniflux.app/v2`, so the binary is
# `miniflux.app` (not `miniflux`).
exec-target = "miniflux.app"
go-vendor-hash = "sha256-9I0/dyjanuV8oZystox9RY/gGx1SZuFRTghArv5aJ64="
# Stamp the real version into the binary (else it self-reports "dev").
go-ldflags = ["-X miniflux.app/v2/internal/version.Version=${version}"]

[nix.env-exports]
LISTEN_ADDR = "0.0.0.0:${PORT:-8080}"
RUN_MIGRATIONS = "1"
CREATE_ADMIN = "1"
ADMIN_USERNAME = "${ADMIN_USERNAME:?miniflux: ADMIN_USERNAME not injected}"
# NO default. `${ADMIN_PASSWORD:-changeme}` meant that whenever the injection
# was missing — as it was, because nothing mapped HOP3_ADMIN_PASSWORD onto it —
# CREATE_ADMIN made an `admin` account with a password published in this file,
# while Hop3 advertised a generated one that did not work. The smoke test read
# that as "Invalid username or password", which was true and buried the point:
# the deployed app had a publicly known administrator. Refusing to start is the
# only acceptable behaviour when the credential is absent.
ADMIN_PASSWORD = "${ADMIN_PASSWORD:?miniflux: ADMIN_PASSWORD not injected — refusing to create an admin with a default password}"

[[nix.conditional-env]]
name = "DATABASE_URL"
condition-var = "DATABASE_URL"
value = "postgres://${PGUSER:-miniflux}:${PGPASSWORD:-}@${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-miniflux}?sslmode=disable"

[nix.runtime-env]
RUN_MIGRATIONS = "1"
CREATE_ADMIN = "1"

[[addons]]
type = "postgres"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/healthcheck"
status = 200
contains = "OK"

[admin]
username = "admin"
password = { generate = "password", length = 20 }

# Map the generated credential onto the vars Miniflux reads at first start.
# This is the whole bootstrap: CREATE_ADMIN makes the account from these, and
# skips when the user already exists, so it is safe across redeploys. The
# native recipe has had this mapping all along; the nix-gen variant was
# generated without it.
[env.computed]
ADMIN_USERNAME = "${HOP3_ADMIN_USER}"
ADMIN_PASSWORD = "${HOP3_ADMIN_PASSWORD}"
