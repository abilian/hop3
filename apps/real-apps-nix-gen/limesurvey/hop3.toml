[metadata]
id = "limesurvey"
version = "6.16.10"
description = "Professional online survey and data collection tool"

[nix]
template = "php-app"
needs-writable-dir = true
# Headless install via LimeSurvey's console.php, wired to the injected admin
# (ADR 056) — no more hardcoded password123. Idempotent (guarded on a marker,
# since console.php install errors if the schema already exists) and fail-loud
# (a failed install aborts the wrapper via set -e instead of leaving the app on
# its web installer). Signature: install <user> <password> <full-name> <email>.
pre-exec = ['if [ ! -f .hop3-installed ]; then PHPBIN/php application/commands/console.php install "$HOP3_ADMIN_USER" "$HOP3_ADMIN_PASSWORD" Administrator "$HOP3_ADMIN_EMAIL"; touch .hop3-installed; fi']
url = "https://download.limesurvey.org/latest-master/limesurvey${version}+260223.zip"
sha256 = "jXRc89eWmPd354Zk2peRJR7v4G9ePwTJT9BS2es3tnk="
archive = "zip"
source-root = "limesurvey"
php-version = "php82"
php-extensions = ['pgsql', 'pdo_pgsql', 'gd', 'mbstring', 'xml', 'curl', 'zip', 'intl', 'ldap', 'imap']
post-install-dirs = ['tmp', 'upload']
extra-paths = ['${php}/bin']

# Hop3 Configuration for LimeSurvey (Nix build)
# Professional online survey tool

[build]
builder = "nix"

[[addons]]
type = "postgres"

# Generated admin credentials (ADR 056): the platform mints the password once
# and injects HOP3_ADMIN_USER/EMAIL/PASSWORD at runtime — consumed by the
# console.php install above.
[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }

[[nix.config-files]]
path = "application/config/config.php"
format = "raw"
create-if-missing = true
raw-content = """<?php if (!defined("BASEPATH")) exit("No direct script access allowed");
return array(
  "components" => array(
    "db" => array(
      "connectionString" => "pgsql:host=" . getenv("PGHOST") . ";port=" . getenv("PGPORT") . ";dbname=" . getenv("PGDATABASE"),
      "username" => getenv("PGUSER"),
      "password" => getenv("PGPASSWORD"),
      "charset" => "utf8",
      "tablePrefix" => "lime_",
    ),
    "urlManager" => array(
      "urlFormat" => "path",
      "showScriptName" => true,
    ),
  ),
  "config" => array(
    "debug" => 0,
    "debugsql" => 0,
  ),
);
"""

[test]
priority = "P2"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["php", "limesurvey", "nix", "surveys"]

[[test.validations]]
path = "/"
status = 200
contains = "LimeSurvey"
