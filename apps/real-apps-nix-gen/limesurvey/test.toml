# Test definition for LimeSurvey built with Nix

[test]
name = "nix-limesurvey"
category = "nix-app"
tier = "medium"
priority = "P2"  # Known: returns 500 without app-specific config
description = "LimeSurvey online survey tool built and deployed using Nix"

[test.requirements]
targets = ["docker", "remote"]
services = ["nix", "postgresql"]

[test.metadata]
author = "hop3-team"
covers = ["php", "limesurvey", "nix", "surveys"]

[deployment]
path = "."
type = "nix"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
