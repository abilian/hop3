# hop3.toml - Hop3 configuration for Owncast (nix-gen)
# Self-hosted livestream server — compiled FROM SOURCE with go-source
# (buildGoModule). The web UI is committed and embedded, so no frontend build;
# ffmpeg is added to the runtime PATH (owncast shells out to it for transcoding).

[metadata]
id = "owncast"
# Version nixpkgs-24.11 packages (Go-1.23-buildable); vendorHash reused.
version = "0.2.0"
description = "Self-hosted livestream server"

[build]
builder = "nix"

[nix]
template = "go-source"
url = "https://github.com/owncast/owncast/archive/refs/tags/v${version}.tar.gz"
sha256 = "ID9AXVqAB9md0XO/6gVgxvNEBcpqY7Smbct7Ld6YCjc="
archive = "tar-gz"
exec-target = "owncast"
exec-args = [
    '--webserverport', '${PORT:-8080}',
    '--webserverip', '0.0.0.0',
    '--database', 'data/owncast.db',
]
go-vendor-hash = "sha256-ERilQZ8vnhGW1IEcLA4CcmozDooHKbnmASMw87tjYD4="
# owncast invokes ffmpeg at runtime for transcoding; put it on the app PATH.
extra-paths = ['${pkgs.ffmpeg}/bin']
pre-exec = ['mkdir -p data']

[run]
start-timeout = 120

[[ports]]
number = 1935
protocol = "tcp"
name = "rtmp"

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "sqlite", "streaming"]

[[test.validations]]
path = "/api/status"
status = 200
contains = "versionNumber"
