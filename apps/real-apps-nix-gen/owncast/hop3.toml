# hop3.toml - Hop3 configuration for Nix-based Owncast
# Self-hosted livestream server — built from source via nixpkgs

[metadata]
id = "owncast"
description = "Self-hosted livestream server"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "owncast"
exec-target = "owncast"
exec-args = [
    '--webserverport', '${PORT:-8080}',
    '--webserverip', '0.0.0.0',
    '--database', 'data/owncast.db',
]
extra-paths = ['${owncast}/bin']
pre-exec = ['mkdir -p data']

[run]
start-timeout = 120

[test]
priority = "P1"
tier = "medium"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "sqlite", "streaming"]

[[test.validations]]
path = "/api/status"
status = 200
contains = "viewerCount"
