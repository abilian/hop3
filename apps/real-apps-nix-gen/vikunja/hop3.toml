# hop3.toml - Hop3 configuration for Nix-based Vikunja
# Open source task and project management — built from source via nixpkgs

[metadata]
id = "vikunja"
description = "Open source task and project management"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "vikunja"
exec-target = "vikunja"
extra-paths = ['${vikunja}/bin']
pre-exec = ['mkdir -p files']

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
VIKUNJA_FRONTEND_URL = "http://localhost:8080/"

[[nix.config-files]]
path = "config.yml"
format = "raw"
create-if-missing = true
raw-content = """
service:
  interface: ":${PORT}"
  frontendurl: "${VIKUNJA_FRONTEND_URL:-http://localhost:${PORT}/}"
  publicurl: "${VIKUNJA_FRONTEND_URL:-http://localhost:${PORT}/}"

cors:
  enable: false

database:
  type: postgres
  host: ${PGHOST:-localhost}
  port: ${PGPORT:-5432}
  database: ${PGDATABASE:-vikunja}
  user: ${PGUSER:-vikunja}
  password: ${PGPASSWORD:-}

files:
  basepath: ./files
"""

[[addons]]
type = "postgres"
