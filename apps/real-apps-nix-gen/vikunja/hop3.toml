[metadata]
id = "vikunja"
version = "0.24.6"
description = "Open source task and project management"

[nix]
template = "prebuilt-archive"
url = "https://dl.vikunja.io/vikunja/${version}/vikunja-v${version}-linux-amd64-full.zip"
sha256 = "AAfg+56IAhs5DYmK2IpE2JgdUv7lfsGeBYZwOvso8Bo="
archive = "zip"
exec-target = "vikunja"
source-root = "."
pre-exec = ['mkdir -p files']

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
VIKUNJA_FRONTEND_URL = "http://localhost:8080/"

[[nix.config-files]]
path = "config.yml"
format = "raw"
create-if-missing = true
raw-content = """
service:
  interface: ":${PORT}"
  frontendurl: "${VIKUNJA_FRONTEND_URL:-http://localhost:${PORT}/}"

database:
  type: postgres
  host: ${PGHOST:-localhost}
  port: ${PGPORT:-5432}
  database: ${PGDATABASE:-vikunja}
  user: ${PGUSER:-vikunja}
  password: ${PGPASSWORD:-}

files:
  basepath: ./files
"""

[[nix.file-mappings]]
source = "vikunja-v${version}-linux-amd64"
destination = "bin/vikunja"
recursive = false
executable = true

# hop3.toml - Hop3 configuration for Nix-based Vikunja
# Open source task and project management

[build]
builder = "nix"

[[addons]]
type = "postgres"
