# hop3.toml - Hop3 configuration for Vikunja (nix-gen)
# Task/project management — compiled FROM SOURCE with go-source: Go backend via
# buildGoModule + Vue frontend via pnpm (pnpm.fetchDeps), both offline and
# hash-pinned. Unlike gitea, vikunja `//go:embed`s its frontend, so the built
# `dist/` is copied into `frontend/dist` before the Go compile.

[metadata]
id = "vikunja"
# Version nixpkgs-24.11 packages (go.mod wants Go 1.22, default pin is fine);
# its vendorHash + frontend pnpmDeps hash are reused here.
version = "0.24.6"
description = "Open source task and project management"

[build]
builder = "nix"

[nix]
template = "go-source"
# The app's own bin, so a create command can reach its CLI.
extra-paths = ['${pkg}/bin']
url = "https://github.com/go-vikunja/vikunja/archive/refs/tags/v${version}.tar.gz"
sha256 = "1sKQpXfd248jXiiw9TZ3P6/48+zONGDrTG4Wka5WyxM="
archive = "tar-gz"
# Go module is `code.vikunja.io/api`, so buildGoModule names the binary `api`.
exec-target = "api"
go-vendor-hash = "sha256-OsKejno8QGg7HzRsrftngiWGiWHFc1jDLi5mQ9/NjI4="
go-ldflags = ["-X code.vikunja.io/api/pkg/version.Version=${version}"]
# Frontend: pnpm (Vue/Vite), embedded via go:embed into frontend/dist.
go-frontend-pnpm = true
# Re-pinned after the vendored set resolved differently than the recorded
# hash: nix reported `hash mismatch in fixed-output derivation`, which is
# the pin doing its job. The value below is what pnpm actually produced.
go-pnpm-deps-hash = "sha256-d4OkpJ6uuGSJyv5nql4rDZK/HGDAkZ+In9NCDCArqWE="
go-frontend-build = "pnpm run build"
go-frontend-output = "dist"
go-frontend-source-root = "vikunja-${version}/frontend"
go-frontend-embed-path = "frontend/dist"
pre-exec = ['mkdir -p files']

[nix.local-vars]
PORT = "${PORT:-8080}"

[[nix.config-files]]
path = "config.yml"
format = "raw"
create-if-missing = true
# `publicurl` is what the BROWSER is told to call, not what the server binds.
# It used to come from a `[nix.runtime-env] VIKUNJA_FRONTEND_URL` pinned to
# `http://localhost:8080/` — baked into the wrapper at build time, so no deploy
# could correct it. The Vue frontend then aimed its API calls at the visitor's
# own machine, failed to reach /api/v1/info, and rendered an error instead of
# the login form: the app answered its API check and showed nobody a way in.
raw-content = """
service:
  interface: ":${PORT}"
  frontendurl: "${HOP3_PUBLIC_URL:-http://localhost:${PORT}}/"
  publicurl: "${HOP3_PUBLIC_URL:-http://localhost:${PORT}}/"

cors:
  enable: false

database:
  type: postgres
  host: ${PGHOST:-localhost}
  port: ${PGPORT:-5432}
  database: ${PGDATABASE:-vikunja}
  user: ${PGUSER:-vikunja}
  password: ${PGPASSWORD:-}

files:
  basepath: ./files
"""

[[addons]]
type = "postgres"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/api/v1/info"
status = 200

[[test.validations]]
path = "/"
status = 200
contains = "Vikunja"

# `api`, not `./vikunja`: buildGoModule names the binary after the module
# path element (that is what exec-target says), and it lives in the store,
# not in the directory a create command runs from — `sh: ./vikunja: not
# found`. Declared here so the generator's graft of the native section,
# which is correct for the native layout only, goes inert.
[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
if ! api user list 2>/dev/null | grep -q "$HOP3_PROBE_USER"; then
  api user create --username "$HOP3_PROBE_USER" \
    --email "$HOP3_PROBE_EMAIL" --password "$HOP3_PROBE_PASSWORD"
fi
api user list 2>/dev/null | grep -q "$HOP3_PROBE_USER" || {
  echo "Vikunja probe account missing after user create" >&2
  exit 1
}
'''

[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
# Runs once, post-deploy, in src/ (the app has started and migrated the DB by
# then) with HOP3_ADMIN_* + the postgres addon's PG* vars in the env. Vikunja's
# `user create` reads config.yml from the cwd, and `-p` makes it non-interactive
# (without it, the CLI PROMPTS and would hang). `user create` errors (exit != 0)
# on a duplicate username, so guard it with an idempotent presence check parsing
# the Username column (field 3) of `user list` — grep -Fxq gives an exact match
# that can't false-hit an address in the Email column. A final presence check
# fails the deploy loudly if the account still isn't there.
create = '''
set -eu
ADMIN_USER="${HOP3_ADMIN_USER:?admin user not injected}"
ADMIN_EMAIL="${HOP3_ADMIN_EMAIL:?admin email not injected}"
ADMIN_PASSWORD="${HOP3_ADMIN_PASSWORD:?admin password not injected}"
present() {
  api user list 2>/dev/null \
    | awk -F'|' 'NF>=4 { gsub(/^[ \t]+|[ \t]+$/, "", $3); print $3 }' \
    | grep -Fxq "$ADMIN_USER"
}
if present; then
  echo "Vikunja admin already exists: $ADMIN_USER"
else
  api user create -u "$ADMIN_USER" -e "$ADMIN_EMAIL" -p "$ADMIN_PASSWORD"
fi
present || { echo "ERROR: Vikunja admin '$ADMIN_USER' was not created" >&2; exit 1; }
'''

[healthcheck]
contains = "Vikunja"
