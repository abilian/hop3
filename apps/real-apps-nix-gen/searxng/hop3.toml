# Hop3 Configuration for SearXNG (Nix build via nixpkgs)
# Privacy-respecting metasearch engine

[metadata]
id = "searxng"
description = "Privacy-respecting, hackable metasearch engine"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "searxng"
exec-target = "searxng-run"
extra-paths = ['${searxng}/bin']

[nix.env-exports]
# No default. A published fallback secret is the same secret on every
# deployment, which is what SEARXNG_SECRET exists to prevent.
SEARXNG_SECRET = "${SEARXNG_SECRET:?searxng: SEARXNG_SECRET not injected}"
SEARXNG_PORT = "${PORT:-8080}"
SEARXNG_BIND_ADDRESS = "0.0.0.0"

# Generated once and re-injected unchanged (ADR 046), so it is unique per
# deployment and stable across redeploys.
[env]
SEARXNG_SECRET = { generate = "base64" }

[run]
start-timeout = 120

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["python", "searxng", "nix"]

[[test.validations]]
path = "/healthz"
status = 200
contains = "OK"
