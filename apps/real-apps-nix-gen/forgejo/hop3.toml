# hop3.toml - Hop3 configuration for Forgejo (nix-gen)
# Self-hosted Git service (Gitea fork) — compiled FROM SOURCE with go-source:
# Go backend via buildGoModule + JS frontend via buildNpmPackage, both offline
# and hash-pinned. Webpack assets served from disk via STATIC_ROOT_PATH.

[metadata]
id = "forgejo"
# Version nixpkgs-24.11 packages (Go-1.23-buildable); its vendorHash +
# npmDepsHash are reused here.
version = "11.0.1"
description = "Self-hosted Git service (community fork of Gitea)"

[build]
builder = "nix"

[nix]
template = "go-source"
url = "https://codeberg.org/forgejo/forgejo/archive/v${version}.tar.gz"
sha256 = "rprFyfldGCdUdbyIz4nReJgiJzgaiB9FOwzX6Fv0C2M="
archive = "tar-gz"
# Module is `forgejo.org`, so buildGoModule names the binary `forgejo`.
# forgejo's go.mod declares `module forgejo.org`, and buildGoModule names the
# binary after the module path's last element, so the produced file is
# bin/forgejo.org. (gitea's module is code.gitea.io/gitea, hence bin/gitea.)
exec-target = "forgejo.org"
exec-args = ['web']
go-vendor-hash = "sha256-8fa6l89+6NhVsi6VuTvQs35E3HuiBFxM8NUQ/jzlzV0="
# forgejo 11's go.mod needs Go >= 1.24; the pin's default is 1.23, so build
# with go_1_24 (still shipped by nixpkgs-24.11).
go-version = "go_1_24"
go-sub-packages = ["."]
go-ldflags = ["-X main.Version=${version}"]
go-frontend-build = "BROWSERSLIST_IGNORE_OLD_DATA=true npx webpack"
# Same as gitea, whose codebase this forked from: forgejo resolves BOTH
# `public/` (built above) and `options/` (locales, gitignores, licences, label
# templates) under STATIC_ROOT_PATH. Without options/ it boots far enough to
# serve nothing and then dies registering a cron task — "translation is missing
# for task update_mirrors". options/ is a source asset, not a build output.
# `templates` as well as `options`: both are SOURCE assets resolved under
# STATIC_ROOT_PATH, and shipping only `options` left forgejo unable to render
# any page — "the template system is broken, or Forgejo can't find your
# template files" — on a build that otherwise succeeded.
go-static-dirs = ["options", "templates"]
go-npm-deps-hash = "sha256-laHHXq59/7+rJSYTD1Aq/AvFcio6vsnWkeV8enq3yTg="
pre-exec = ['mkdir -p custom/conf data']
# The app's OWN bin, so [admin].create can reach its CLI. `$out/bin` (always
# on the runtime path) holds only the generated wrapper, which execs
# `forgejo web` and nothing else — the bootstrap failed with `forgejo: not found`
# while the binary sat in this derivation, one store path away.
extra-paths = ['${pkg}/bin']

[nix.local-vars]
PORT = "${PORT:-8080}"
DB_HOST = "${PGHOST:-localhost}"
DB_PORT = "${PGPORT:-5432}"
DB_NAME = "${PGDATABASE:-forgejo}"
DB_USER = "${PGUSER:-forgejo}"
DB_PASS = "${PGPASSWORD:-}"


[nix.env-exports]
GITEA_WORK_DIR = "$PWD"

[[nix.config-files]]
path = "custom/conf/app.ini"
format = "ini"
[nix.config-files.sections.server]
HTTP_PORT = "${PORT}"
ROOT_URL = "http://localhost:${PORT}/"
DISABLE_SSH = "true"
# Serve the webpack-built assets from the frontend derivation.
STATIC_ROOT_PATH = "$HOP3_GO_FRONTEND"
[nix.config-files.sections.database]
DB_TYPE = "postgres"
HOST = "${DB_HOST}:${DB_PORT}"
NAME = "${DB_NAME}"
USER = "${DB_USER}"
PASSWD = "${DB_PASS}"
[nix.config-files.sections.repository]
ROOT = "data/forgejo-repositories"
[nix.config-files.sections.log]
MODE = "console"
LEVEL = "Info"
[nix.config-files.sections.security]
INSTALL_LOCK = "true"
# Hop3's generated-once secrets, NOT minted here. The config file is rewritten
# on every start (no create-if-missing) and the heredoc marker is unquoted, so
# `$(head -c 32 /dev/urandom | base64)` re-evaluated on every restart: SECRET_KEY
# encrypts 2FA secrets and stored credentials, JWT_SECRET signs OAuth2 grants,
# INTERNAL_TOKEN authenticates git hooks to the web process. Rotating them turns
# 2FA and encrypted data undecryptable, invalidates every token, and breaks
# internal auth — silently, on a restart nobody connected to it.
SECRET_KEY = "${SECRET_KEY}"
INTERNAL_TOKEN = "${INTERNAL_TOKEN}"
JWT_SECRET = "${JWT_SECRET}"

# Stable security secrets (ADR 046): generated once on first deploy and
# re-injected unchanged on every redeploy, so they survive the source tree
# being replaced. See the [nix.config-files] security section for what each
# one protects and what rotating it destroys.
[env]
SECRET_KEY = { generate = "base64" }
INTERNAL_TOKEN = { generate = "hex" }
JWT_SECRET = { generate = "urlsafe" }

[[addons]]
type = "postgres"

[run]
start-timeout = 180

[test]
priority = "P1"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/api/healthz"
status = 200
contains = "status"

[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
if ! forgejo.org admin user list 2>/dev/null | awk '{print $2}' | grep -qx "$HOP3_PROBE_USER"; then
  forgejo.org admin user create --username "$HOP3_PROBE_USER" \
    --email "$HOP3_PROBE_EMAIL" --password "$HOP3_PROBE_PASSWORD" \
    --must-change-password=false
fi
forgejo.org admin user list 2>/dev/null | awk '{print $2}' | grep -qx "$HOP3_PROBE_USER" || {
  echo "Forgejo probe account missing after create (its CLI exits 0 on refusal)" >&2
  exit 1
}
'''

[admin]
# Not "admin": Forgejo reserves that username (CreateUser rejects it). Use a
# non-reserved name for the generated site admin.
username = "hop3admin"
email = "operator"
password = { generate = "password", length = 20 }
# Forgejo has no env-var admin bootstrap, so create the initial admin once,
# post-deploy, with its CLI (ADR 056). Idempotent — skips when the user already
# exists — and fail-loud: a missing injected credential aborts via ${VAR:?...},
# and a final presence check fails the deploy if the account wasn't created
# (Forgejo's CLI, like Gitea's, can report an error yet exit 0). Runs in src/
# with HOP3_ADMIN_* injected; forgejo reads custom/conf/app.ini.
# NOT `./forgejo`: this command runs in the app's SOURCE directory, while the
# binary lives in the read-only Nix store. `$out/bin` is first on the runtime
# PATH (nix-gen always puts it there), so the plain name resolves; the `./`
# was carried over from the native recipe, where the binary sits in the tree
# beside the command. It failed with `sh: ./forgejo: not found` after a 200-second
# build, and the deploy correctly refused to leave an app with no admin.
# The binary is `forgejo.org`, not `forgejo`: buildGoModule names it after the
# module path element (the same reason miniflux's is `miniflux.app`). That is
# what `exec-target` says, and it is what lands in ${pkg}/bin.
create = '''
set -e
ADMIN_USER="${HOP3_ADMIN_USER:?admin user not injected}"
ADMIN_EMAIL="${HOP3_ADMIN_EMAIL:?admin email not injected}"
ADMIN_PASSWORD="${HOP3_ADMIN_PASSWORD:?admin password not injected}"
export GITEA_WORK_DIR="$(pwd)"
conf="custom/conf/app.ini"
present() { forgejo.org admin user list -c "$conf" | awk 'NR>1{print $2}' | grep -Fxq "$ADMIN_USER"; }
if present; then
  echo "Forgejo admin already exists: $ADMIN_USER"
else
  forgejo.org admin user create --admin --username "$ADMIN_USER" \
    --email "$ADMIN_EMAIL" --password "$ADMIN_PASSWORD" \
    --must-change-password=false -c "$conf"
fi
present || { echo "ERROR: Forgejo admin '$ADMIN_USER' was not created" >&2; exit 1; }
'''
