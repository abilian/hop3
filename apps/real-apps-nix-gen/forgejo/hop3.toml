# hop3.toml - Hop3 configuration for Nix-based Forgejo
# Self-hosted Git service — built from source via nixpkgs (Gitea fork)

[metadata]
id = "forgejo"
description = "Self-hosted Git service (community fork of Gitea)"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "forgejo"
exec-target = "forgejo"
exec-args = ['web']
extra-paths = ['${forgejo}/bin']
pre-exec = ['mkdir -p custom/conf data']

[nix.local-vars]
PORT = "${PORT:-8080}"
DB_HOST = "${PGHOST:-localhost}"
DB_PORT = "${PGPORT:-5432}"
DB_NAME = "${PGDATABASE:-forgejo}"
DB_USER = "${PGUSER:-forgejo}"
DB_PASS = "${PGPASSWORD:-}"

[nix.env-exports]
GITEA_WORK_DIR = "$PWD"

[[nix.config-files]]
path = "custom/conf/app.ini"
format = "ini"
[nix.config-files.sections.server]
HTTP_PORT = "${PORT}"
ROOT_URL = "http://localhost:${PORT}/"
DISABLE_SSH = "true"
[nix.config-files.sections.database]
DB_TYPE = "postgres"
HOST = "${DB_HOST}:${DB_PORT}"
NAME = "${DB_NAME}"
USER = "${DB_USER}"
PASSWD = "${DB_PASS}"
[nix.config-files.sections.repository]
ROOT = "data/forgejo-repositories"
[nix.config-files.sections.log]
MODE = "console"
LEVEL = "Info"
[nix.config-files.sections.security]
INSTALL_LOCK = "true"
SECRET_KEY = "$(head -c 32 /dev/urandom | base64)"

[[addons]]
type = "postgres"

[run]
start-timeout = 180
