# Hop3 Configuration for Wiki.js (Nix build)
# Modern wiki platform.
#
# NOTE: This config still uses the upstream pre-built tarball via the
# 'node-prebuilt' template. Reason: nixpkgs ships wiki-js as a raw
# source tree (no bin/wiki-js wrapper) which requires invoking
# `node server` from a writable directory. The 'nixpkgs-wrapper'
# template assumes ${pkg}/bin/<name> exists and isn't a good fit.
# The hand-crafted real-apps-nix/wiki-js/hop3.nix uses pkgs.wiki-js
# from nixpkgs (source-built) — see that variant for the proper fix.

[metadata]
id = "wiki-js"
version = "2.5.303"
description = "Modern and powerful wiki platform"

[build]
builder = "nix"

[nix]
template = "node-prebuilt"
url = "https://github.com/Requarks/wiki/releases/download/v${version}/wiki-js.tar.gz"
sha256 = "Jpv4D+ldGPvJz+8cwNhrmC+Ii5dG0UOTC5JIWPwUzvk="
archive = "tar-gz"
exec-target = "server/index.js"
runtime-package = "nodejs_22"
unpack-without-top-level = true
extra-paths = ['${nodejs}/bin']
pre-exec = [
  "mkdir -p data",
  """# Symlink Wiki.js assets from the read-only Nix store to the writable cwd
for item in server node_modules assets package.json; do
  if [ -e APPDIR/$item ] && [ ! -e $item ]; then
    ln -sf APPDIR/$item $item
  fi
done"""
,
]

[nix.local-vars]
PORT = "${PORT:-8080}"
DB_HOST = "${PGHOST:-localhost}"
DB_PORT = "${PGPORT:-5432}"
DB_NAME = "${PGDATABASE:-wikijs}"
DB_USER = "${PGUSER:-wikijs}"
DB_PASS = "${PGPASSWORD:-}"

[nix.env-exports]
NODE_ENV = "production"

[nix.runtime-env]
NODE_ENV = "production"

[[nix.config-files]]
path = "config.yml"
format = "raw"
raw-content = """
port: ${PORT}
bindIP: 0.0.0.0

db:
  type: postgres
  host: ${DB_HOST}
  port: ${DB_PORT}
  user: ${DB_USER}
  pass: ${DB_PASS}
  db: ${DB_NAME}
  ssl: false

logLevel: info

offline: false
ha: false

dataPath: ./data
"""

[[addons]]
type = "postgres"

[env]
NODE_ENV = "production"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["nodejs", "wiki-js", "nix", "postgres"]

[[test.validations]]
path = "/healthz"
status = 200
contains = '{"ok":true}'
