# hop3.toml - Hop3 configuration for Nix-based Mattermost
# Team collaboration platform — built from source via nixpkgs

[metadata]
id = "mattermost"
description = "Open source team collaboration platform"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "mattermost"
exec-target = "mattermost"
exec-args = ['--config', '"$PWD/config/config.json"']
extra-paths = ['${mattermost}/bin']
pre-exec = [
  "mkdir -p data logs config plugins client/plugins",
  """# Symlink Mattermost assets from the nixpkgs package into the writable cwd
for item in templates fonts i18n client; do
  if [ -e PKGOUT/share/mattermost/$item ] && [ ! -e $item ]; then
    ln -sf PKGOUT/share/mattermost/$item $item
  fi
done"""
,
]

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
MM_SERVICESETTINGS_SITEURL = "http://localhost:8080"

[[nix.config-files]]
path = "config/config.json"
format = "raw"
raw-content = """
{
  "ServiceSettings": {
    "SiteURL": "${MM_SERVICESETTINGS_SITEURL:-http://localhost:${PORT}}",
    "ListenAddress": ":${PORT}",
    "ConnectionSecurity": "",
    "TLSCertFile": "",
    "TLSKeyFile": "",
    "EnableLocalMode": false
  },
  "SqlSettings": {
    "DriverName": "postgres",
    "DataSource": "postgres://${PGUSER:-mattermost}:${PGPASSWORD:-}@${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-mattermost}?sslmode=disable",
    "MaxIdleConns": 20,
    "MaxOpenConns": 300,
    "Trace": false,
    "AtRestEncryptKey": "$(head -c 32 /dev/urandom | base64)",
    "QueryTimeout": 30
  },
  "LogSettings": {
    "EnableConsole": true,
    "ConsoleLevel": "INFO",
    "EnableFile": false
  },
  "FileSettings": {
    "DriverName": "local",
    "Directory": "./data/"
  },
  "EmailSettings": {
    "SendEmailNotifications": false,
    "RequireEmailVerification": false
  },
  "PluginSettings": {
    "Enable": true,
    "Directory": "./plugins",
    "ClientDirectory": "./client/plugins"
  }
}
"""

[[addons]]
type = "postgres"
