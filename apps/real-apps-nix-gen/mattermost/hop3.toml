[metadata]
id = "mattermost"
version = "9.4.2"
description = "Open source team collaboration platform"

[nix]
template = "prebuilt-archive"
url = "https://releases.mattermost.com/${version}/mattermost-${version}-linux-amd64.tar.gz"
sha256 = "e/1ZaogKFir/NR5Eel35es+CZAWp2YM1pByldNtjJuc="
archive = "tar-gz"
exec-target = "mattermost"
source-root = "mattermost"
pre-exec = [
  "mkdir -p data logs config plugins client/plugins",
  """# Symlink Mattermost assets from Nix store into working directory
for item in SHAREDIR/*; do
  base="$(basename "$item")"
  if [ ! -e "$base" ]; then
    ln -sf "$item" "$base"
  fi
done"""
,
]

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.runtime-env]
MM_SERVICESETTINGS_SITEURL = "http://localhost:8080"

[[nix.config-files]]
path = "config/config.json"
format = "raw"
raw-content = """
{
  "ServiceSettings": {
    "SiteURL": "${MM_SERVICESETTINGS_SITEURL:-http://localhost:${PORT}}",
    "ListenAddress": ":${PORT}",
    "ConnectionSecurity": "",
    "TLSCertFile": "",
    "TLSKeyFile": "",
    "EnableLocalMode": false
  },
  "SqlSettings": {
    "DriverName": "postgres",
    "DataSource": "postgres://${PGUSER:-mattermost}:${PGPASSWORD:-}@${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-mattermost}?sslmode=disable",
    "MaxIdleConns": 20,
    "MaxOpenConns": 300,
    "Trace": false,
    "AtRestEncryptKey": "$(head -c 32 /dev/urandom | base64)",
    "QueryTimeout": 30
  },
  "LogSettings": {
    "EnableConsole": true,
    "ConsoleLevel": "INFO",
    "EnableFile": false
  },
  "FileSettings": {
    "DriverName": "local",
    "Directory": "./data/"
  },
  "EmailSettings": {
    "SendEmailNotifications": false,
    "RequireEmailVerification": false
  },
  "PluginSettings": {
    "Enable": true,
    "Directory": "./plugins",
    "ClientDirectory": "./client/plugins"
  }
}
"""

[[nix.file-mappings]]
source = "bin/mattermost"
destination = "bin/"
recursive = false

[[nix.file-mappings]]
source = "templates fonts i18n"
destination = "share/mattermost/"

[[nix.file-mappings]]
source = "client"
destination = "share/mattermost/"

# hop3.toml - Hop3 configuration for Nix-based Mattermost
# Team collaboration platform

[build]
builder = "nix"

[[addons]]
type = "postgres"
