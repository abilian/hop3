# hop3.toml - Hop3 configuration for Nix-based Mattermost
# Team collaboration platform — built from source via nixpkgs

[metadata]
id = "mattermost"
# From the pinned nixpkgs (mattermost); not the native recipe's version,
# which differs. Re-read it with `nix eval` when the pin moves.
version = "9.11.16"
description = "Open source team collaboration platform"

[build]
builder = "nix"

[nix]
template = "nixpkgs-wrapper"
nixpkgs-package = "mattermost"
exec-target = "mattermost"
exec-args = ['--config', '"$PWD/config/config.json"']
# mmctl is a SEPARATE nixpkgs package — the mattermost derivation's bin holds
# only `mattermost`, so every `mmctl --local` call in the bootstrap exited 127
# (command not found) and the deploy correctly refused to leave the app
# without an admin.
extra-paths = ['${pkg}/bin', '${mmctl}/bin']
pre-exec = [
  "mkdir -p data logs config plugins client/plugins",
  """# Symlink Mattermost assets from the nixpkgs package into the writable cwd
for item in templates fonts i18n client; do
  if [ -e PKGOUT/share/mattermost/$item ] && [ ! -e $item ]; then
    ln -sf PKGOUT/share/mattermost/$item $item
  fi
done"""
,
]

[nix.local-vars]
PORT = "${PORT:-8080}"

[nix.let-extra]
mmctl = "pkgs.mmctl"

[[nix.config-files]]
path = "config/config.json"
format = "raw"
# `SiteURL` is the address Mattermost hands to its own webapp, and it was pinned
# to `http://localhost:8080` by a `[nix.runtime-env]` entry baked into the
# wrapper at build time — no deploy could correct it. The webapp then loaded
# against an origin the visitor cannot reach and never rendered its form, while
# the REST check (which posts to /api/v4/users/login) passed.
raw-content = """
{
  "ServiceSettings": {
    "SiteURL": "${HOP3_PUBLIC_URL:-http://localhost:${PORT}}",
    "ListenAddress": ":${PORT}",
    "ConnectionSecurity": "",
    "TLSCertFile": "",
    "TLSKeyFile": "",
    "EnableLocalMode": true,
    "LocalModeSocketLocation": "${PWD}/mattermost_local.socket"
  },
  "SqlSettings": {
    "DriverName": "postgres",
    "DataSource": "postgres://${PGUSER:-mattermost}:${PGPASSWORD:-}@${PGHOST:-localhost}:${PGPORT:-5432}/${PGDATABASE:-mattermost}?sslmode=disable",
    "MaxIdleConns": 20,
    "MaxOpenConns": 300,
    "Trace": false,
    "AtRestEncryptKey": "$(head -c 32 /dev/urandom | base64)",
    "QueryTimeout": 30
  },
  "LogSettings": {
    "EnableConsole": true,
    "ConsoleLevel": "INFO",
    "EnableFile": false
  },
  "FileSettings": {
    "DriverName": "local",
    "Directory": "./data/"
  },
  "EmailSettings": {
    "SendEmailNotifications": false,
    "RequireEmailVerification": false
  },
  "PluginSettings": {
    "Enable": true,
    "Directory": "./plugins",
    "ClientDirectory": "./client/plugins"
  }
}
"""

[[addons]]
type = "postgres"

[test]
priority = "P2"
tier = "slow"
author = "hop3-team"
targets = ["docker", "remote"]
covers = ["golang", "nix", "postgres"]

[[test.validations]]
path = "/api/v4/system/ping"
status = 200
contains = "status"

[probe]
username = "hop3probe"
email = "probe@hop3.invalid"
create = '''
if ! mmctl --local user search "$HOP3_PROBE_USER" 2>/dev/null | grep -q "$HOP3_PROBE_USER"; then
  mmctl --local user create --username "$HOP3_PROBE_USER" \
    --email "$HOP3_PROBE_EMAIL" --password "$HOP3_PROBE_PASSWORD"
fi
mmctl --local user search "$HOP3_PROBE_USER" 2>/dev/null | grep -q "$HOP3_PROBE_USER" || {
  echo "Mattermost probe account missing after user create" >&2
  exit 1
}
'''

[admin]
username = "admin"
email = "operator"
password = { generate = "password", length = 20 }
# Runs once post-deploy in src/ (cwd), with HOP3_ADMIN_* in env, failing the
# deploy loud on a non-zero exit. Local mode talks to the running server over a
# unix socket (no network auth); MMCTL_LOCAL_SOCKET_PATH must match
# ServiceSettings.LocalModeSocketLocation written by scripts/setup-config.sh.
# The socket lives under the per-app src/ dir so multiple Mattermost instances
# never collide on the shared /var/tmp default. Idempotent (create-if-absent)
# and fail-loud: it waits for the server's local-mode socket, then creates the
# system admin only if it does not already exist. mmctl's plain CreateUser
# bypasses the disabled web signup, so the admin is still created.
create = '''
set -e
: "${HOP3_ADMIN_USER:?admin bootstrap: HOP3_ADMIN_USER not injected}"
: "${HOP3_ADMIN_EMAIL:?admin bootstrap: HOP3_ADMIN_EMAIL not injected (set [admin].email)}"
: "${HOP3_ADMIN_PASSWORD:?admin bootstrap: HOP3_ADMIN_PASSWORD not injected}"
sock="$(pwd)/mattermost_local.socket"
export MMCTL_LOCAL_SOCKET_PATH="$sock"
i=0
while [ ! -S "$sock" ]; do
  i=$((i + 1))
  if [ "$i" -gt 60 ]; then
    echo "Mattermost local-mode socket $sock never appeared (120s); cannot create admin" >&2
    exit 1
  fi
  sleep 2
done
if mmctl --local user list --all | grep -Fq ": $HOP3_ADMIN_USER ("; then
  echo "Admin user '$HOP3_ADMIN_USER' already exists; skipping creation."
else
  mmctl --local user create --system-admin --email-verified \
    --email "$HOP3_ADMIN_EMAIL" \
    --username "$HOP3_ADMIN_USER" \
    --password "$HOP3_ADMIN_PASSWORD"
fi
'''
