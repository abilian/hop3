# Hop3 Configuration for SearXNG (Docker-based)
# Privacy-respecting metasearch engine

[metadata]
id = "searxng"
version = "2024"
title = "SearXNG"
description = "Privacy-respecting, hackable metasearch engine"
homepage = "https://docs.searxng.org/"
license = "AGPL-3.0"
categories = ["search", "privacy", "metasearch"]

# SearXNG uses file-based configuration, no database needed
# Redis is optional for rate limiting (not enabled by default)

[env]
SEARXNG_BASE_URL = "http://localhost:8080"

[healthcheck]
path = "/healthz"
