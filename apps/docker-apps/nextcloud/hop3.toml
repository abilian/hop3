# Hop3 Configuration for Nextcloud (Docker-based)
# Dockerfile handles build and runtime; hop3.toml defines metadata and dependencies

[metadata]
id = "nextcloud"
version = "28"
title = "Nextcloud"
description = "A safe home for all your data - file sync, share, and collaboration platform"
homepage = "https://nextcloud.com/"
license = "AGPL-3.0"
categories = ["collaboration", "file-sharing", "productivity"]

# Database and cache addons - automatically provisioned by hop3 deploy
[[addons]]
type = "postgres"

[[addons]]
type = "redis"

# Environment variables injected at deploy time
[env]
NEXTCLOUD_ADMIN_USER = "admin"
NEXTCLOUD_TRUSTED_DOMAINS = "localhost"

[healthcheck]
path = "/status.php"
