# Test definition for Flask with Gunicorn and Poetry

[test]
name = "110-flask-gunicorn-poetry"
category = "deployment"
tier = "medium"
priority = "P0"
description = "Flask application with Gunicorn and Poetry"

[test.requirements]
targets = ["docker", "remote"]
services = []

[test.metadata]
author = "hop3-team"
covers = ["python", "flask", "gunicorn", "poetry"]

[deployment]
path = "."
type = "python"

[[validations]]
type = "http"
path = "/"
[validations.expect]
status = 200
